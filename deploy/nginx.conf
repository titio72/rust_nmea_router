server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # Replace with real certs via: certbot --nginx -d yourdomain.com
    ssl_certificate     /etc/ssl/certs/trips_viewer.crt;
    ssl_certificate_key /etc/ssl/private/trips_viewer.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Allow large trip payloads from the sync endpoint.
    client_max_body_size 100m;

    location / {
        proxy_pass         http://127.0.0.1:1115;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
