[workspace]
members = [".", "nmea2k"]
resolver = "2"

[package]
name = "nmea_router"
version = "0.1.0"
edition = "2021"

[dependencies]
nmea2k = { path = "nmea2k" }
nmea2000 = "0.2.2"
socketcan = "3.0"
mysql = "25.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "json", "local-time"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
nix = { version = "0.29", features = ["time"] }
axum = { version = "0.7", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
approx = "0.5"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
world_magnetic_model = "0.4.0"
once_cell = "1.20"
futures-util = "0.3"
rand = "0.8"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rmcp = { version = "1.5.0", features = ["server", "transport-io"] }
schemars = { version = "1.0", features = ["chrono04"] }
openssl = { version = "0.10", features = ["vendored"] }

[[bin]]
name = "nmea_router"
path = "src/main.rs"

[[bin]]
name = "gap_filler"
path = "src/bin/gap_filler.rs"

[[bin]]
name = "mcp_server"
path = "src/bin/mcp_server.rs"

[[bin]]
name = "backfill_legs"
path = "src/bin/backfill_legs.rs"

