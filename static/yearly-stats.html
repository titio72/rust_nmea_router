<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yearly Statistics - NMEA Router</title>
    <link rel="icon" type="image/png" href="/nmeasail.png">
    <link rel="stylesheet" href="/shared.css">
    <script src="/shared-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 400px;
            margin-bottom: 30px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            padding: 15px;
            background: var(--bg-tertiary);
            border-radius: 6px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .stats-table th,
        .stats-table td {
            padding: 10px 16px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .stats-table th:first-child,
        .stats-table td:first-child {
            text-align: left;
        }

        .stats-table th {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stats-table tbody tr {
            transition: background-color 0.15s ease;
        }

        .cell-max {
            color: #e74c3c;
            font-weight: 700;
        }

        .stats-table tbody tr:hover {
            background-color: rgba(52, 152, 219, 0.15);
            cursor: default;
        }

        .stats-table tbody tr:hover td.cell-max {
            color: #e74c3c;
            font-weight: 700;
        }

        .stats-table tbody tr:last-child td {
            border-bottom: none;
        }

        .error {
            color: #e74c3c;
            background: #fadbd8;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #e74c3c;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
        }

        .tableValue {
            font-size: 16px;
            color: var(--text-primary);
            font-weight: 700;
        }

        .tableValueMax {
            color: #e74c3c;
        }

        .tablePercentage {
            font-size: 12px;
            color: var(--text-secondary);
        }

    </style>
</head>
<body>
    <div id="headerContainer"></div>

    <div class="level-1-container">
        <div id="loading" class="loading">Loading statistics...</div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="statsContent" style="display: none;">

            <div class="summary-grid" style="grid-column: 1 / -1;">
                <div class="analyticsCard">
                    <div class="analyticsCardTitle">Total Sailing</div>
                    <div class="analyticsValue" id="totalSailing">0</div>
                    <div class="analyticsDetail">nm</div>
                </div>
                <div class="analyticsCard">
                    <div class="analyticsCardTitle">Total Motoring</div>
                    <div class="analyticsValue" id="totalMotoring">0</div>
                    <div class="analyticsDetail">nm</div>
                </div>
                <div class="analyticsCard">
                    <div class="analyticsCardTitle">Total Distance</div>
                    <div class="analyticsValue" id="totalDistance">0</div>
                    <div class="analyticsDetail">nm</div>
                </div>
                <div class="analyticsCard">
                    <div class="analyticsCardTitle">Sailing Percentage</div>
                    <div class="analyticsValue" id="sailingPercent">0%</div>
                    <div class="analyticsDetail">of total distance</div>
                </div>
            </div>

            <div class="chart-wrapper">
                <canvas id="yearlyChart"></canvas>
            </div>

            <div class="chart-wrapper">
                <canvas id="accumulatedChart"></canvas>
            </div>

            <table class="stats-table" id="yearlyTable">
                <thead>
                    <tr>
                        <th>Year</th>
                        <th>Sailing (nm)</th>
                        <th>Motoring (nm)</th>
                        <th>Total (nm)</th>
                        <th id="ytdHeader">Jan–Mar (nm)</th>
                    </tr>
                </thead>
                <tbody id="yearlyTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Initialize header and theme
        document.getElementById('headerContainer').innerHTML = createHeaderBar('stats');
        initializeTheme();
        
        const chartColors = {
            light: {
                sailing: '#2980b9',
                motoring: '#95a5a6',
                text: '#1a1a1a',
                border: '#ddd',
                bg: '#f5f5f5'
            },
            dark: {
                sailing: '#3498db',
                motoring: '#bdc3c7',
                text: '#e0e8f0',
                border: '#2a4a6f',
                bg: '#0a1628'
            }
        };

        let yearlyChart = null;
        let accumulatedChart = null;

        // Override toggleTheme to update charts when theme changes
        function toggleTheme() {
            const isDark = baseToggleTheme();
            
            // Recreate chart with new theme
            if (yearlyChart) {
                updateChart();
            }
            if (accumulatedChart) {
                updateAccumulatedChart();
            }
        }

        function getChartColors() {
            const isDark = document.body.classList.contains('dark-theme');
            return isDark ? chartColors.dark : chartColors.light;
        }

        async function loadStatistics() {
            try {
                const response = await fetch('/api/monthly_statistics');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const result = await response.json();

                if (result.status !== 'ok' || !result.data) {
                    throw new Error(result.error || 'Failed to load statistics');
                }

                processStatistics(result.data);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('statsContent').style.display = 'block';
            } catch (error) {
                console.error('Error loading statistics:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = `Error: ${error.message}`;
                document.getElementById('error').style.display = 'block';
            }
        }

        function processStatistics(data) {
            // Group data by year
            const yearlyData = {};

            data.months.forEach(month => {
                if (!yearlyData[month.year]) {
                    yearlyData[month.year] = {
                        sailing: 0,
                        motoring: 0
                    };
                }
                yearlyData[month.year].sailing += month.sailing_distance_nm;
                yearlyData[month.year].motoring += month.motoring_distance_nm;
            });

            // Calculate totals
            let totalSailing = 0;
            let totalMotoring = 0;

            Object.values(yearlyData).forEach(year => {
                totalSailing += year.sailing;
                totalMotoring += year.motoring;
            });

            const totalDistance = totalSailing + totalMotoring;
            const sailingPercent = totalDistance > 0 ? ((totalSailing / totalDistance) * 100).toFixed(1) : 0;

            // Update summary
            document.getElementById('totalSailing').textContent = Math.round(totalSailing);
            document.getElementById('totalMotoring').textContent = Math.round(totalMotoring);
            document.getElementById('totalDistance').textContent = Math.round(totalDistance);
            document.getElementById('sailingPercent').textContent = sailingPercent + '%';

            // Create chart
            createChart(yearlyData);
            
            // Create accumulated chart
            createAccumulatedChart(data.months);

            // Populate yearly table
            populateYearlyTable(yearlyData, data.months);
        }

        function populateYearlyTable(yearlyData, monthlyData) {
            const currentMonth = new Date().getMonth() + 1; // 1-based
            const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const ytdLabel = `Jan\u2013${monthNames[currentMonth - 1]} (nm)`;
            document.getElementById('ytdHeader').textContent = ytdLabel;

            // Build YTD lookup: year -> total distance for months 1..currentMonth
            const ytdByYear = {};
            monthlyData.forEach(m => {
                if (m.month <= currentMonth) {
                    if (!ytdByYear[m.year]) ytdByYear[m.year] = 0;
                    ytdByYear[m.year] += m.sailing_distance_nm + m.motoring_distance_nm;
                }
            });

            const tbody = document.getElementById('yearlyTableBody');
            tbody.innerHTML = '';
            const years = Object.keys(yearlyData).sort((a, b) => b - a);

            // Find max total and max YTD
            const maxTotal = Math.max(...years.map(y => yearlyData[y].sailing + yearlyData[y].motoring));
            const ytdValues = years.map(y => ytdByYear[y] !== undefined ? ytdByYear[y] : -Infinity);
            const maxYtd = Math.max(...ytdValues);

            years.forEach(year => {
                const sailing = yearlyData[year].sailing;
                const motoring = yearlyData[year].motoring;
                const total = sailing + motoring;
                const pct = total > 0 ? ((sailing / total) * 100).toFixed(1) : '0.0';
                const pctM = total > 0 ? ((motoring / total) * 100).toFixed(1) : '0.0';
                const ytdRaw = ytdByYear[year] !== undefined ? ytdByYear[year] : null;
                const ytdDisplay = ytdRaw !== null ? Math.round(ytdRaw) : '\u2013';
                const totalClass = total === maxTotal ? 'tableValueMax' : 'tableValue';
                const ytdClass = ytdRaw !== null && ytdRaw === maxYtd ? 'tableValueMax' : 'tableValue';
                const tr = document.createElement('tr');
                tr.innerHTML = 
                    `<td>${year}</td>
                    <td class="tableValue">${Math.round(sailing)}<br><span class="tablePercentage">${pct}%</span></td>
                    <td class="tableValue">${Math.round(motoring)}<br><span class="tablePercentage">${pctM}%</span></td>
                    <td class="${totalClass}">${Math.round(total)}</td>
                    <td class="${ytdClass}">${ytdDisplay}</td>`;
                tbody.appendChild(tr);
            });
        }

        function createAccumulatedChart(monthlyData) {
            // Group data by year and calculate accumulated miles per month
            const yearMonthData = {};
            
            monthlyData.forEach(month => {
                if (!yearMonthData[month.year]) {
                    yearMonthData[month.year] = {};
                }
                const total = month.sailing_distance_nm + month.motoring_distance_nm;
                yearMonthData[month.year][month.month] = total;
            });

            // Get all years sorted
            const years = Object.keys(yearMonthData).sort((a, b) => a - b);
            
            // Months labels (just month numbers)
            const monthLabels = Array.from({length: 12}, (_, i) => (i + 1).toString());
            
            // Color palette for different years
            const colors = [
                'rgba(41, 128, 185, 0.8)',   // Blue
                'rgba(230, 126, 34, 0.8)',   // Orange
                'rgba(46, 204, 113, 0.8)',   // Green
                'rgba(231, 76, 60, 0.8)',    // Red
                'rgba(155, 89, 182, 0.8)',   // Purple
                'rgba(52, 73, 94, 0.8)',     // Dark Blue
                'rgba(22, 160, 133, 0.8)',   // Turquoise
                'rgba(241, 196, 15, 0.8)'    // Yellow
            ];

            // Create datasets for each year
            const datasets = years.map((year, index) => {
                const yearData = yearMonthData[year];
                const accumulatedData = [];
                let accumulated = 0;
                
                for (let month = 1; month <= 12; month++) {
                    if (yearData[month]) {
                        accumulated += yearData[month];
                    }
                    accumulatedData.push(accumulated);
                }
                
                return {
                    label: year,
                    data: accumulatedData,
                    borderColor: colors[index % colors.length],
                    backgroundColor: colors[index % colors.length].replace('0.8', '0.1'),
                    borderWidth: 2,
                    fill: false,
                    tension: 0.3,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                    pointBackgroundColor: colors[index % colors.length]
                };
            });

            const chartColors = getChartColors();
            const ctx = document.getElementById('accumulatedChart').getContext('2d');

            if (accumulatedChart) {
                accumulatedChart.destroy();
            }

            accumulatedChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: monthLabels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                color: chartColors.text,
                                usePointStyle: true
                            }
                        },
                        tooltip: {
                            backgroundColor: chartColors.bg === '#0a1628' ? 'rgba(15, 31, 60, 0.9)' : 'rgba(255, 255, 255, 0.9)',
                            titleColor: chartColors.text,
                            bodyColor: chartColors.text,
                            borderColor: chartColors.border,
                            borderWidth: 1,
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + Math.round(context.parsed.y) + ' nm';
                                }
                            }
                        },
                        title: {
                            display: true,
                            text: 'Accumulated Distance by Month',
                            color: chartColors.text
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Month',
                                color: chartColors.text
                            },
                            ticks: {
                                color: chartColors.text
                            },
                            grid: {
                                color: chartColors.border
                            }
                        },
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Accumulated Distance (nm)',
                                color: chartColors.text
                            },
                            ticks: {
                                color: chartColors.text,
                                callback: function(value) {
                                    return Math.round(value) + ' nm';
                                }
                            },
                            grid: {
                                color: chartColors.border
                            }
                        }
                    }
                }
            });
        }

        function createChart(yearlyData) {
            const years = Object.keys(yearlyData).sort((a, b) => a - b);
            const sailingData = years.map(year => yearlyData[year].sailing);
            const motoringData = years.map(year => yearlyData[year].motoring);

            const colors = getChartColors();
            const ctx = document.getElementById('yearlyChart').getContext('2d');

            if (yearlyChart) {
                yearlyChart.destroy();
            }

            yearlyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: years,
                    datasets: [
                        {
                            label: 'Sailing',
                            data: sailingData,
                            backgroundColor: colors.sailing,
                            borderColor: colors.sailing,
                            borderWidth: 1
                        },
                        {
                            label: 'Motoring',
                            data: motoringData,
                            backgroundColor: colors.motoring,
                            borderColor: colors.motoring,
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: colors.bg === '#0a1628' ? 'rgba(15, 31, 60, 0.9)' : 'rgba(255, 255, 255, 0.9)',
                            titleColor: colors.text,
                            bodyColor: colors.text,
                            borderColor: colors.border,
                            borderWidth: 1,
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    label += Math.round(context.parsed.y) + ' nm';
                                    return label;
                                },
                                afterLabel: function(context) {
                                    if (context.datasetIndex === 1) {
                                        const total = context.chart.data.datasets[0].data[context.dataIndex] + 
                                                    context.chart.data.datasets[1].data[context.dataIndex];
                                        return 'Total: ' + Math.round(total) + ' nm';
                                    }
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            stacked: true,
                            ticks: {
                                color: colors.text
                            },
                            grid: {
                                color: colors.border
                            }
                        },
                        y: {
                            stacked: true,
                            beginAtZero: true,
                            ticks: {
                                color: colors.text,
                                callback: function(value) {
                                    return value + ' nm';
                                }
                            },
                            grid: {
                                color: colors.border
                            }
                        }
                    }
                }
            });
        }

        function updateChart() {
            if (yearlyChart) {
                const colors = getChartColors();
                yearlyChart.options.scales.x.ticks.color = colors.text;
                yearlyChart.options.scales.x.grid.color = colors.border;
                yearlyChart.options.scales.y.ticks.color = colors.text;
                yearlyChart.options.scales.y.grid.color = colors.border;
                
                yearlyChart.data.datasets[0].backgroundColor = colors.sailing;
                yearlyChart.data.datasets[0].borderColor = colors.sailing;
                yearlyChart.data.datasets[1].backgroundColor = colors.motoring;
                yearlyChart.data.datasets[1].borderColor = colors.motoring;
                
                yearlyChart.update();
            }
        }

        function updateAccumulatedChart() {
            if (accumulatedChart) {
                const colors = getChartColors();
                accumulatedChart.options.scales.x.ticks.color = colors.text;
                accumulatedChart.options.scales.x.grid.color = colors.border;
                accumulatedChart.options.scales.x.title.color = colors.text;
                accumulatedChart.options.scales.y.ticks.color = colors.text;
                accumulatedChart.options.scales.y.grid.color = colors.border;
                accumulatedChart.options.scales.y.title.color = colors.text;
                accumulatedChart.options.plugins.legend.labels.color = colors.text;
                accumulatedChart.options.plugins.title.color = colors.text;
                
                accumulatedChart.update();
            }
        }

        // Load statistics when DOM is ready
        window.addEventListener('DOMContentLoaded', () => {
            loadStatistics();
        });
    </script>
</body>
</html>
