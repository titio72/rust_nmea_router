<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMEA Router Dashboard</title>
    <link rel="icon" type="image/png" href="/nmeasail.png">
    <link rel="stylesheet" href="/shared.css">
    <script src="/shared-theme.js"></script>
    <script src="/voyage-bar-component.js"></script>
    <script src="/trip-card-component.js"></script>
    <style>
        .tracking-toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .tracking-toggle-container:hover {
            opacity: 0.8;
        }

        .toggle-switch {
            display: inline-block;
            width: 30px;
            height: 18px;
            background-color: #999;
            border-radius: 9px;
            position: relative;
            transition: background-color 0.3s ease;
        }

        .toggle-switch.active {
            background-color: var(--sailing-color);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s ease;
        }

        .toggle-switch.active::after {
            left: 14px;
        }

        .container {
            max-width: 100%;
            margin: 0;
            background: transparent;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            transition: background-color 0.3s ease;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .nav-tab {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-secondary);
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--sailing-color);
        }

        .nav-tab:hover {
            color: var(--text-primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
        }

        .error {
            color: #e74c3c;
            background: #fadbd8;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            border-left: 4px solid #e74c3c;
        }

        .trips-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 30px;
        }




        .trip-line-1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .trip-line-2,
        .trip-line-3 {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 13px;
        }

        .trip-line-4 {
            width: 100%;
        }

        .line-item {
            flex: 1;
            min-width: 200px;
        }

        .line-item .label {
            font-weight: 600;
            color: var(--text-bold);
        }

        .trip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .trip-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-bold);
            flex: 1;
        }

        .trip-title-id {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-secondary);
            flex: 1;
        }

        .trip-dates {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .trip-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 15px;
        }

        .no-trips {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
            font-style: italic;
        }

        .trips-filter {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .trips-filter label {
            color: var(--text-primary);
            font-weight: 500;
        }

        .trips-filter select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .trips-filter select:hover {
            border-color: var(--sailing-color);
        }

        input[type="date"] {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            transition: background-color 0.3s ease;
        }

        .day-labels {
            display: grid;
            grid-template-rows: repeat(7, 23px);
            gap: 4px;
            margin-right: 8px;
            padding-top: 0;
        }

        .day-label {
            height: 23px;
            line-height: 23px;
            text-align: right;
        }

        .heatmap-wrapper {
            display: flex;
            overflow-x: auto;
            width: 100%;
        }

        .heatmap-inner {
            display: flex;
            flex-direction: column;
            margin: 0 auto;
        }

        .legend {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .legend-box {
            width: 14px;
            height: 14px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
        }

        .heatmap {
            display: grid;
            grid-template-columns: repeat(54, 23px);
            grid-template-rows: repeat(7, 23px);
            gap: 4px;
            margin-bottom: 8px;
        }

        .heatmap-cell {
            border: 1px solid var(--border-color);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: var(--cell-color, var(--heatmap-empty));
        }

        .heatmap-cell:hover {
            box-shadow: 0 0 8px rgba(39, 174, 96, 0.5);
            transform: scale(1.2);
            z-index: 100;
        }

        .heatmap-cell.empty {
            background-color: var(--heatmap-empty);
        }

        .edit-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .edit-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .edit-modal-content {
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px var(--card-shadow);
            max-width: 500px;
            width: 90%;
        }

        .edit-modal-header {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-bold);
            margin-bottom: 20px;
        }

        .edit-modal-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
            margin-bottom: 20px;
            resize: vertical;
            min-height: 100px;
        }

        .edit-modal-input:focus {
            outline: none;
            border-color: var(--sailing-color);
            box-shadow: 0 0 5px rgba(39, 174, 96, 0.3);
        }

        .edit-modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .edit-modal-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .edit-modal-save {
            background-color: var(--sailing-color);
            color: white;
        }

        .edit-modal-save:hover {
            background-color: #229954;
        }

        .edit-modal-cancel {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .edit-modal-cancel:hover {
            opacity: 0.8;
        }

        .week-labels {
            display: grid;
            grid-template-columns: repeat(54, 23px);
            gap: 4px;
            margin-top: 8px;
        }

        .week-label {
            height: 20px;
            line-height: 20px;
            font-size: 11px;
            text-align: center;
            color: var(--text-secondary);
        }

        .tooltip {
            position: fixed;
            background: var(--text-bold);
            color: var(--bg-primary);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            box-shadow: 0 2px 8px var(--card-shadow);
            z-index: 1000;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .trips-grid {
                grid-template-columns: 1fr;
            }

            .header-bar {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .tracking-toggle-container {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>
    <div id="headerContainer"></div>

    <div class="container">
        <div id="editModal" class="edit-modal">
            <div class="edit-modal-content">
                <div class="edit-modal-header">Edit Trip Description</div>
                <textarea id="editModalInput" class="edit-modal-input"
                    placeholder="Enter trip description..."></textarea>
                <div class="edit-modal-buttons">
                    <button class="edit-modal-cancel" onclick="closeEditModal()">Cancel</button>
                    <button class="edit-modal-save" onclick="saveEditModal()">Save</button>
                </div>
            </div>
        </div>

        <input type="file" id="importFileInput" accept=".json" style="display: none;"
            onchange="handleFileImport(event)">
    </div>

    <div id="settingsSection" class="level-1-container">
        <div style="display: flex; gap: 15px; align-items: center;">
            <div class="tracking-toggle-container" onclick="toggleTracking()">
                <span>Position Tracking:</span>
                <div class="toggle-switch" id="trackingToggle"></div>
            </div>
            <div class="tracking-toggle-container" onclick="toggleMetrics()">
                <span>Metrics Tracking:</span>
                <div class="toggle-switch" id="metricsToggle"></div>
            </div>
            <div class="tracking-toggle-container" onclick="toggleSignalk()">
                <span>SignalK Broadcasting:</span>
                <div class="toggle-switch" id="signalkToggle"></div>
            </div>
            <div class="trips-filter">
                <label for="yearFilter">Filter:</label>
                <select id="yearFilter" onchange="onFilterChange()">
                    <option value="12months">Last 12 Months</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Heatmap Section -->
    <div id="heatmapSection" class="level-1-container">
        <div id="errorContainer"></div>
        <div class="stats" id="stats"></div>
        <div id="loadingContainer" style="display: none;" class="loading">
            Loading heatmap data...
        </div>
        <div id="heatmapContainer" style="display: none;">
            <div class="heatmap-wrapper">
                <div class="day-labels">
                    <div class="day-label">Mon</div>
                    <div class="day-label">Tue</div>
                    <div class="day-label">Wed</div>
                    <div class="day-label">Thu</div>
                    <div class="day-label">Fri</div>
                    <div class="day-label">Sat</div>
                    <div class="day-label">Sun</div>
                </div>
                <div class="heatmap-inner">
                    <div class="heatmap" id="heatmap"></div>
                    <div class="week-labels" id="weekLabels"></div>
                </div>
            </div>
            <div class="legend">
                <span>Less</span>
                <div class="legend-box" style="background-color: var(--heatmap-empty);"></div>
                <div class="legend-box" style="background-color: var(--heatmap-1);"></div>
                <div class="legend-box" style="background-color: var(--heatmap-2);"></div>
                <div class="legend-box" style="background-color: var(--heatmap-3);"></div>
                <div class="legend-box" style="background-color: var(--heatmap-4);"></div>
                <div class="legend-box" style="background-color: var(--heatmap-5);"></div>
                <span>More</span>
            </div>
        </div>
    </div>

    <!-- Trips Section -->
    <div id="tripsSection" class="level-1-container">
        <div class="trip-header"><h2 id="tripsTitle">Trips</h2><button class="app-btn" onclick="triggerImportDialog()" title="Import trip"><app-icon name="upload"></app-icon></button></div>
        <div id="content">
            <div class="loading">Loading trips...</div>
        </div>
    </div>

    <script>
        // Initialize header and theme
        document.getElementById('headerContainer').innerHTML = createHeaderBar('trips');
        initializeTheme();
        
        // Track if heatmap has been loaded
        let heatmapLoaded = false;

        // Trips functions
        async function loadTrips() {
            try {
                // Fetch all trips (to populate year filter with all available years)
                const response = await fetch('/api/trips');
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status + ': ' + response.statusText);
                }
                const result = await response.json();
                if (result.status !== 'ok') {
                    throw new Error(result.error || 'Failed to load trips');
                }

                // Store all trips for filtering
                window.allTrips = result.data;

                // Populate year filter dropdown with all available years
                populateYearFilter(result.data);

                // Display with default filter
                filterTrips();
            } catch (error) {
                document.getElementById('content').innerHTML =
                    '<div class="error">Failed to load trips: ' + error.message + '</div>';
            }
        }

        function populateYearFilter(trips) {
            if (!trips || trips.length === 0) return;

            const yearSet = new Set();
            trips.forEach(trip => {
                if (trip.start_date) {
                    const year = new Date(trip.start_date).getFullYear();
                    yearSet.add(year);
                }
            });

            const years = Array.from(yearSet).sort((a, b) => b - a);
            const yearFilter = document.getElementById('yearFilter');

            // Clear existing options except the first one
            while (yearFilter.options.length > 1) {
                yearFilter.remove(1);
            }

            // Add year options
            years.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearFilter.appendChild(option);
            });
        }

        function filterTrips() {
            let filteredTrips = window.allTrips || [];

            const endDate = getHeatmapEndDate();
            const startDate = new Date(endDate);
            startDate.setDate(startDate.getDate() - 364);

            const startDateStr = startDate.toISOString().split('T')[0];
            const endDateStr = endDate.toISOString().split('T')[0];

            filteredTrips = filteredTrips.filter(trip => {
                const tripStartDate = trip.start_date.split('T')[0];
                const tripEndDate = trip.end_date.split('T')[0];
                return tripEndDate >= startDateStr && tripStartDate <= endDateStr;
            });

            display_trips(filteredTrips);
        }

        function display_trips(trips) {
            document.getElementById('tripsTitle').textContent = `Trips (${trips.length})`;

            const content = document.getElementById('content');

            if (!trips || trips.length === 0) {
                content.innerHTML = '<div class="no-trips">No trips found in the last 12 months</div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'trips-grid';

            trips.forEach(trip => {
                const card = document.createElement('trip-card');
                card.setAttribute('data-id', trip.id);
                card.setAttribute('data-description', trip.description || '');
                card.setAttribute('data-start-date', trip.start_date);
                card.setAttribute('data-end-date', trip.end_date);
                card.setAttribute('data-total-distance', trip.total_distance_nm);
                card.setAttribute('data-sailing-distance', trip.sailing_distance_nm);
                card.setAttribute('data-motoring-distance', trip.motoring_distance_nm);
                card.setAttribute('data-total-time', trip.total_time_ms);
                card.setAttribute('data-sailing-time', trip.sailing_time_ms);
                card.setAttribute('data-motoring-time', trip.motoring_time_ms);
                card.setAttribute('data-moored-time', trip.moored_time_ms || 0);
                card.setAttribute('data-uuid', trip.uuid || '');

                grid.appendChild(card);
            });

            content.innerHTML = '';
            content.appendChild(grid);
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'Unknown';
            try {
                const date = new Date(dateStr);
                return date.toLocaleDateString();
            } catch (e) {
                return dateStr;
            }
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return 'Unknown';
            try {
                const date = new Date(dateStr);
                return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return dateStr;
            }
        }

        function formatDuration(ms) {
            if (!ms) return '0h 0m';
            const totalMinutes = Math.floor(ms / (1000 * 60));
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            if (hours < 24)
                return hours + 'h ' + minutes + 'm';
            else
                return Math.floor(hours / 24) + 'd ' + (hours % 24) + 'h ' + minutes + 'm';
        }

        // Event delegation for trip-action custom events from Web Components
        document.addEventListener('trip-action', (event) => {
            const { action, trip_id, description } = event.detail;

            switch(action) {
                case 'edit':
                    openEditModal(event, trip_id, description);
                    break;
                case 'export':
                    exportTrip(event, trip_id);
                    break;
                case 'trim':
                    trimTrip(event, trip_id);
                    break;
                case 'delete':
                    deleteTrip(event, trip_id);
                    break;
            }
        });

        // Heatmap functions
        function getColorVariable(value, minDistance, maxDistance) {
            if (value === 0) return '--heatmap-empty';

            const ratio = (value - minDistance) / (maxDistance - minDistance);

            if (ratio < 0.2) return '--heatmap-1';
            if (ratio < 0.4) return '--heatmap-2';
            if (ratio < 0.6) return '--heatmap-3';
            if (ratio < 0.8) return '--heatmap-4';
            return '--heatmap-5';
        }

        // Navigate to trip detail page for a given date
        function navigateToTripForDate(dateStr) {
            if (!window.allTrips || window.allTrips.length === 0) {
                alert('No trips available');
                return;
            }

            // Find trip whose date range contains the clicked date
            // Compare date strings directly to avoid timezone issues
            const matchingTrip = window.allTrips.find(trip => {
                // Extract just the date part from timestamps (format: YYYY-MM-DDTHH:MM:SS)
                const startDateStr = trip.start_date.split('T')[0];
                const endDateStr = trip.end_date.split('T')[0];

                // Compare date strings directly (YYYY-MM-DD format)
                return dateStr >= startDateStr && dateStr <= endDateStr;
            });

            if (matchingTrip) {
                window.location.href = `trip.html?id=${matchingTrip.id}`;
            } else {
                alert(`No trip found for date ${dateStr}`);
            }
        }

        async function loadHeatmap() {
            const endDate = getHeatmapEndDate();
            const dateString = endDate.toISOString().split('T')[0];
            const errorContainer = document.getElementById('errorContainer');
            const loadingContainer = document.getElementById('loadingContainer');
            const heatmapContainer = document.getElementById('heatmapContainer');
            const statsContainer = document.getElementById('stats');
            const heatmap = document.getElementById('heatmap');
            const weekLabels = document.getElementById('weekLabels');

            errorContainer.innerHTML = '';
            loadingContainer.style.display = 'block';
            heatmapContainer.style.display = 'none';
            statsContainer.innerHTML = '';

            if (!dateString) {
                errorContainer.innerHTML = '<div class="error">Please select a date</div>';
                loadingContainer.style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`/api/heatmap?date=${dateString}`);
                if (!response.ok) {
                    throw new Error('Failed to load heatmap data');
                }

                const result = await response.json();
                if (result.error) {
                    throw new Error(result.error);
                }

                const data = result.data;

                // Calculate sailing/motoring totals
                const sailingMotoring = calculateSailingMotoringTotals();

                // Update stats
                statsContainer.innerHTML = `
                    <div class="card-stats">
                        <div class="card-stat">
                            <div class="card-stat-label">Total Distance</div>
                            <div class="card-stat-value">${data.total_distance.toFixed(2)} nm</div>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="card-stat">
                            <div class="card-stat-label">Max Daily Distance</div>
                            <div class="card-stat-value">${data.max_distance.toFixed(2)} nm</div>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="card-stat">
                            <div class="card-stat-label">Min Daily Distance</div>
                            <div class="card-stat-value">${data.min_distance.toFixed(2)} nm</div>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="card-stat">
                            <div class="card-stat-label">Sailing Distance</div>
                            <div class="card-stat-value">${sailingMotoring.sailing_nm.toFixed(2)} nm</div>
                            <div class="card-stat-details"><span class="sailing-percentage">${sailingMotoring.sailing_percent.toFixed(1)}%</span></div>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="card-stat">
                            <div class="card-stat-label">Motoring Distance</div>
                            <div class="card-stat-value">${sailingMotoring.motoring_nm.toFixed(2)} nm</div>
                            <div class="card-stat-details"><span class="motoring-percentage">${sailingMotoring.motoring_percent.toFixed(1)}%</span></div>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="card-stat">
                            <div class="card-stat-label">Active Days</div>
                            <div class="card-stat-value">${data.days.filter(d => d.distance_nm > 0).length}</div>
                        </div>
                    </div>
                `;

                // Build date map for quick lookup
                const dateMap = {};
                data.days.forEach(day => {
                    dateMap[day.date] = day.distance_nm;
                });

                // Generate heatmap cells
                heatmap.innerHTML = '';
                weekLabels.innerHTML = '';

                const endDate = new Date(dateString);
                const startDate = new Date(endDate);
                startDate.setDate(startDate.getDate() - 364);

                const adjustedStartDate = new Date(startDate);
                const dayOfWeek = adjustedStartDate.getDay();
                const daysToMonday = (dayOfWeek === 0 ? 6 : dayOfWeek - 1);
                adjustedStartDate.setDate(adjustedStartDate.getDate() - daysToMonday);

                const adjustedEndDate = new Date(endDate);
                const dayOfWeekEnd = adjustedEndDate.getDay();
                const daysToSunday = (dayOfWeekEnd === 0 ? 0 : 7 - dayOfWeekEnd);
                adjustedEndDate.setDate(adjustedEndDate.getDate() + daysToSunday);

                const weeks = [];
                let currentMonday = new Date(adjustedStartDate);

                while (currentMonday <= adjustedEndDate) {
                    const weekDays = [];
                    for (let i = 0; i < 7; i++) {
                        const dayDate = new Date(currentMonday);
                        dayDate.setDate(dayDate.getDate() + i);
                        weekDays.push(dayDate);
                    }
                    weeks.push(weekDays);
                    currentMonday.setDate(currentMonday.getDate() + 7);
                }

                let lastMonth = null;
                const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

                for (let weekIdx = 0; weekIdx < weeks.length; weekIdx++) {
                    const week = weeks[weekIdx];

                    const weekLabelDiv = document.createElement('div');
                    weekLabelDiv.className = 'week-label';
                    const weekLabelDate = new Date(week[0]);
                    const currentMonth = weekLabelDate.getMonth();
                    const monthLabel = monthNames[currentMonth];

                    if (lastMonth !== currentMonth) {
                        weekLabelDiv.textContent = monthLabel;
                        weekLabelDiv.style.fontWeight = 'bold';
                        lastMonth = currentMonth;
                    } else {
                        weekLabelDiv.textContent = '';
                        weekLabelDiv.style.opacity = '0.3';
                    }
                    weekLabels.appendChild(weekLabelDiv);

                    for (let dayIdx = 0; dayIdx < 7; dayIdx++) {
                        const dayDate = week[dayIdx];
                        const dateStr = dayDate.toISOString().split('T')[0];
                        const distance = dateMap[dateStr] || 0;

                        const cell = document.createElement('div');
                        cell.className = distance === 0 ? 'heatmap-cell empty' : 'heatmap-cell';

                        const colorVar = getColorVariable(distance, data.min_distance, data.max_distance);
                        cell.style.setProperty('--cell-color', `var(${colorVar})`);
                        cell.style.gridColumn = (weekIdx + 1).toString();
                        cell.style.gridRow = (dayIdx + 1).toString();

                        const dayName = dayDate.toLocaleDateString('en-US', { weekday: 'short' });
                        cell.title = `${dateStr} (${dayName})\n${distance.toFixed(2)} nm`;

                        // Add click handler to navigate to trip details if cell has activity
                        if (distance > 0) {
                            cell.style.cursor = 'pointer';
                            cell.addEventListener('click', () => {
                                navigateToTripForDate(dateStr);
                            });
                        }

                        cell.addEventListener('mouseenter', (e) => {
                            const tooltip = document.createElement('div');
                            tooltip.className = 'tooltip';
                            tooltip.textContent = cell.title.replace(/\n/, ' - ');
                            tooltip.style.left = e.pageX + 'px';
                            tooltip.style.top = (e.pageY - 30) + 'px';
                            document.body.appendChild(tooltip);

                            cell._tooltip = tooltip;
                        });

                        cell.addEventListener('mouseleave', () => {
                            if (cell._tooltip) {
                                cell._tooltip.remove();
                                delete cell._tooltip;
                            }
                        });

                        heatmap.appendChild(cell);
                    }
                }

                loadingContainer.style.display = 'none';
                heatmapContainer.style.display = 'block';
                heatmapLoaded = true;

            } catch (error) {
                errorContainer.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                loadingContainer.style.display = 'none';
            }
        }

        function getHeatmapEndDate() {
            const filterValue = document.getElementById('yearFilter').value;
            const today = new Date();

            if (filterValue === '12months') {
                return today;
            } else {
                const selectedYear = parseInt(filterValue);
                return new Date(Date.UTC(selectedYear, 11, 31)); // Dec 31 of selected year in UTC
            }
        }

        // Calculate sailing and motoring totals from trips within the heatmap date range
        function calculateSailingMotoringTotals() {
            if (!window.allTrips || window.allTrips.length === 0) {
                return {
                    sailing_nm: 0,
                    motoring_nm: 0,
                    total_nm: 0,
                    sailing_percent: 0,
                    motoring_percent: 0
                };
            }

            const endDate = getHeatmapEndDate();
            const startDate = new Date(endDate);
            startDate.setDate(startDate.getDate() - 364); // 365 days (including end date)

            // Extract date strings for comparison (YYYY-MM-DD format)
            const startDateStr = startDate.toISOString().split('T')[0];
            const endDateStr = endDate.toISOString().split('T')[0];

            // Filter trips that overlap with the heatmap period
            let totalSailing = 0;
            let totalMotoring = 0;

            window.allTrips.forEach(trip => {
                // Extract date parts for comparison
                const tripStartDate = trip.start_date.split('T')[0];
                const tripEndDate = trip.end_date.split('T')[0];

                // Check if trip overlaps with heatmap period
                if (tripEndDate >= startDateStr && tripStartDate <= endDateStr) {
                    totalSailing += trip.sailing_distance_nm || 0;
                    totalMotoring += trip.motoring_distance_nm || 0;
                }
            });

            const total = totalSailing + totalMotoring;
            const sailingPercent = total > 0 ? (totalSailing / total) * 100 : 0;
            const motoringPercent = total > 0 ? (totalMotoring / total) * 100 : 0;

            return {
                sailing_nm: totalSailing,
                motoring_nm: totalMotoring,
                total_nm: total,
                sailing_percent: sailingPercent,
                motoring_percent: motoringPercent
            };
        }

        // Handle filter changes - update both heatmap and trips
        function onFilterChange() {
            filterTrips();
            loadHeatmap();
        }

        // Register Service Worker for offline support and graceful degradation
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {
                // Service Worker registration failed (non-critical)
            });
        }

        // Load trips and heatmap when page loads
        loadTrips();
        loadHeatmap();

        // Load tracking status when page loads
        async function initializeTracking() {
            try {
                const response = await fetch('/api/tracking/status');
                if (!response.ok) {
                    throw new Error('Failed to load tracking status');
                }
                const result = await response.json();
                const toggle = document.getElementById('trackingToggle');
                if (result.data && result.data.enabled) {
                    toggle.classList.add('active');
                }
            } catch (error) {
                console.error('Error loading tracking status:', error);
            }
        }
        initializeTracking();

        // Toggle tracking
        async function toggleTracking() {
            const toggle = document.getElementById('trackingToggle');
            const newStatus = !toggle.classList.contains('active');

            try {
                const response = await fetch('/api/tracking/status', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ enabled: newStatus })
                });

                if (!response.ok) {
                    throw new Error('Failed to update tracking status');
                }

                const result = await response.json();
                if (result.status === 'ok' && result.data) {
                    if (result.data.enabled) {
                        toggle.classList.add('active');
                    } else {
                        toggle.classList.remove('active');
                    }
                }
            } catch (error) {
                console.error('Error toggling tracking:', error);
                alert('Failed to update tracking status. Check console for details.');
            }
        }

        // Theme handling - override toggleTheme to reload heatmap when theme changes

        document.addEventListener('DOMContentLoaded', () => {

        // Trip edit modal functions
        let currentEditingTripId = null;

        function openEditModal(event, tripId, currentDescription) {
            event.stopPropagation();
            currentEditingTripId = tripId;
            const modal = document.getElementById('editModal');
            const input = document.getElementById('editModalInput');
            input.value = currentDescription;
            modal.classList.add('active');
            input.focus();
        }

        function closeEditModal() {
            const modal = document.getElementById('editModal');
            modal.classList.remove('active');
            currentEditingTripId = null;
        }

        async function saveEditModal() {
            if (currentEditingTripId === null) return;

            const newDescription = document.getElementById('editModalInput').value.trim();

            try {
                const response = await fetch('/api/trip_description', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        id: parseInt(currentEditingTripId, 10),
                        description: newDescription
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to update trip description');
                }

                const result = await response.json();
                if (result.status === 'ok') {
                    // Update the trip in the in-memory list
                    const editId = parseInt(currentEditingTripId, 10);
                    if (window.allTrips) {
                        const trip = window.allTrips.find(t => t.id === editId);
                        if (trip) {
                            trip.description = newDescription;
                        }
                    }

                    closeEditModal();
                    // Re-render the trips with updated description
                    filterTrips();
                } else {
                    alert('Error: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error updating trip description:', error);
                alert('Failed to update trip description. Check console for details.');
            }
        }

        // Close modal when clicking outside the content
        document.addEventListener('click', function (event) {
            const modal = document.getElementById('editModal');
            if (event.target === modal) {
                closeEditModal();
            }
        });

        async function exportTrip(event, tripId) {
            event.stopPropagation();

            let originalText;
            try {
                // Show a loading indicator
                originalText = event.target.textContent;
                event.target.textContent = '⏳';
                event.target.disabled = true;

                // Call the export API
                const response = await fetch(`/api/export_trip?id=${tripId}`);

                if (!response.ok) {
                    throw new Error('Failed to export trip');
                }

                const result = await response.json();

                if (result.status === 'ok') {
                    // The file is now available at /exports/trip_<tripId>.json
                    // Download it by creating a temporary link
                    const downloadUrl = `/exports/trip_${tripId}.json`;
                    const link = document.createElement('a');
                    link.href = downloadUrl;
                    link.download = `trip_${tripId}.json`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } else {
                    alert('Error: ' + (result.message || 'Export failed'));
                }
            } catch (error) {
                console.error('Export error:', error);
                alert('Export failed: ' + error.message);
            } finally {
                event.target.textContent = originalText;
                event.target.disabled = false;
            }
        }

        function trimTrip(event, tripId) {
            event.stopPropagation();

            // Find the trip description from the page
            const tripCard = event.target.closest('.trip-card');
            const tripTitle = tripCard ? tripCard.querySelector('.trip-title').textContent : 'Trip ' + tripId;

            showConfirm({
                icon: 'scissors',
                title: 'Trim Trip?',
                message: `"${tripTitle}"\n\nThis will remove idle periods before the boat starts moving and after it moors. Safety buffers of 1 hour are applied before and after.\n\nThis action cannot be undone.`,
                confirmLabel: 'Trim',
                onConfirm: () => trimTrip_Confirmed(tripId)
            });
        }

        function trimTrip_Confirmed(tripId) {
            fetch(`/api/trim_trip?id=${tripId}`, {
                method: 'POST'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        alert('Trip trimmed successfully. Data outside the movement period has been removed.');
                        location.reload();
                    } else {
                        alert('Error trimming trip: ' + (data.message || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error trimming trip:', error);
                    alert('Failed to trim trip: ' + error.message);
                });
        }

        function deleteTrip(event, tripId) {
            event.stopPropagation();

            // Find the trip description from the page
            const tripCard = event.target.closest('.trip-card');
            const tripTitle = tripCard ? tripCard.querySelector('.trip-title').textContent : 'Trip ' + tripId;

            showConfirm({
                icon: 'trash',
                title: 'Delete Trip?',
                message: `"${tripTitle}"\n\nThis will also delete all associated environmental and vessel status data.\n\nThis action cannot be undone.`,
                confirmLabel: 'Delete',
                onConfirm: () => deleteTrip_Confirmed(tripId)
            });
        }

        function deleteTrip_Confirmed(tripId) {
            fetch(`/api/delete_trip?id=${tripId}`, {
                method: 'DELETE'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        alert('Trip deleted successfully.');
                        location.reload();
                    } else {
                        alert('Error deleting trip: ' + (data.message || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error deleting trip:', error);
                    alert('Failed to delete trip: ' + error.message);
                });
        }

        // Allow Enter key to save
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' && event.ctrlKey) {
                const modal = document.getElementById('editModal');
                if (modal.classList.contains('active')) {
                    saveEditModal();
                }
            }
        });

        // Trip import functionality
        function triggerImportDialog() {
            document.getElementById('importFileInput').click();
        }

        async function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Validate file type
            if (!file.name.endsWith('.json')) {
                alert('Please select a valid JSON file');
                return;
            }

            // Validate file size (100 MiB max)
            const maxImportSizeBytes = 100 * 1024 * 1024; // 100 MiB
            if (file.size > maxImportSizeBytes) {
                alert('Selected file is too large. Maximum supported size is 100 MiB. Your file is ' + (file.size / (1024 * 1024)).toFixed(2) + ' MiB.');
                event.target.value = '';
                return;
            }

            try {
                const formData = new FormData();
                formData.append('file', file);

                const response = await fetch('/api/import_trip', {
                    method: 'POST',
                    body: formData
                    // Note: Do NOT set Content-Type header, FormData will set it automatically with correct boundary
                });

                const result = await response.json();

                if (result.status === 'ok') {
                    alert('Trip imported successfully! ID: ' + result.data.match(/\d+/)[0]);
                    // Reload trips to show the newly imported trip
                    loadTrips();
                    loadHeatmap();
                } else {
                    alert('Failed to import trip: ' + (result.error || 'Unknown error'));
                    console.error('Import error details:', result.error);
                }
            } catch (error) {
                alert('Error importing trip: ' + error.message);
                console.error('Import error:', error);
            }

            // Reset file input
            event.target.value = '';
        }
