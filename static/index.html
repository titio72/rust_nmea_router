<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMEA Router Dashboard</title>
    <style>
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: white;
            --bg-tertiary: #f8f9fa;
            --text-primary: #333;
            --text-secondary: #666;
            --text-bold: #2c3e50;
            --border-color: #ddd;
            --card-shadow: rgba(0,0,0,0.1);
            --sailing-color: #27ae60;
            --motoring-color: #e74c3c;
            --empty-color: #ecf0f1;
            --heatmap-empty: #ecf0f1;
            --heatmap-1: #a9dfbf;
            --heatmap-2: #52be80;
            --heatmap-3: #27ae60;
            --heatmap-4: #1e8449;
            --heatmap-5: #0b5345;
        }
        body.dark-theme {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #3a3a3a;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-bold: #ffffff;
            --border-color: #444;
            --card-shadow: rgba(0,0,0,0.3);
            --sailing-color: #4a9a74;
            --motoring-color: #c0392b;
            --empty-color: #404040;
            --heatmap-empty: #2a2a2a;
            --heatmap-1: #3a5a3a;
            --heatmap-2: #4a7a4a;
            --heatmap-3: #6a9a6a;
            --heatmap-4: #7aab7a;
            --heatmap-5: #5aff5a;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-primary);
            transition: background-color 0.3s ease;
            color: var(--text-primary);
        }
        .header-bar {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .theme-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        .theme-toggle:hover {
            opacity: 0.8;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 10px var(--card-shadow);
            transition: background-color 0.3s ease;
        }
        h1 {
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 30px;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }
        .nav-tab {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-secondary);
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        .nav-tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--sailing-color);
        }
        .nav-tab:hover {
            color: var(--text-primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
        }
        .error {
            color: #e74c3c;
            background: #fadbd8;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            border-left: 4px solid #e74c3c;
        }
        .trips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .trip-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px var(--card-shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .trip-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px var(--card-shadow);
        }
        .trip-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-bold);
            margin-bottom: 15px;
        }
        .trip-dates {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 15px;
        }
        .trip-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-bold);
        }
        .sailing-percentage {
            color: var(--sailing-color);
            font-weight: bold;
        }
        .motoring-percentage {
            color: var(--motoring-color);
            font-weight: bold;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: var(--empty-color);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, var(--sailing-color) 0%, var(--sailing-color) var(--sailing-percent), var(--motoring-color) var(--sailing-percent), var(--motoring-color) 100%);
            transition: width 0.3s ease;
        }
        .no-trips {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
            font-style: italic;
        }
        .trips-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .trips-filter label {
            color: var(--text-primary);
            font-weight: 500;
        }
        .trips-filter select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .trips-filter select:hover {
            border-color: var(--sailing-color);
        }
        .controls {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .controls label {
            color: var(--text-primary);
            font-weight: 500;
        }
        input[type="date"] {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            transition: background-color 0.3s ease;
        }
        button {
            background-color: var(--sailing-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #229954;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat-box {
            background: var(--bg-tertiary);
            padding: 15px 25px;
            border-radius: 6px;
            text-align: center;
            min-width: 150px;
            transition: background-color 0.3s ease;
        }
        .day-labels {
            display: grid;
            grid-template-rows: repeat(7, 17px);
            gap: 4px;
            margin-right: 8px;
            padding-top: 26px;
        }
        .day-label {
            height: 17px;
            line-height: 17px;
            text-align: right;
        }
        .heatmap-wrapper {
            display: flex;
            overflow-x: auto;
            width: 100%;
        }
        .heatmap-inner {
            display: flex;
            flex-direction: column;
            margin: 0 auto;
        }
        .legend {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .legend-box {
            width: 14px;
            height: 14px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
        }
        .heatmap {
            display: grid;
            grid-template-columns: repeat(54, 17px);
            grid-template-rows: repeat(7, 17px);
            gap: 4px;
            margin-bottom: 8px;
        }
        .heatmap-cell {
            border: 1px solid var(--border-color);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: var(--cell-color, var(--heatmap-empty));
        }
        .heatmap-cell:hover {
            box-shadow: 0 0 8px rgba(39, 174, 96, 0.5);
            transform: scale(1.2);
            z-index: 100;
        }
        .heatmap-cell.empty {
            background-color: var(--heatmap-empty);
        }
        .week-labels {
            display: grid;
            grid-template-columns: repeat(54, 17px);
            gap: 4px;
            margin-top: 8px;
        }
        .week-label {
            height: 20px;
            line-height: 20px;
            font-size: 11px;
            text-align: center;
            color: var(--text-secondary);
        }
        .tooltip {
            position: fixed;
            background: var(--text-bold);
            color: var(--bg-primary);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            box-shadow: 0 2px 8px var(--card-shadow);
            z-index: 1000;
            white-space: nowrap;
        }
        @media (max-width: 768px) {
            .trips-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <h2 style="margin: 0; color: var(--text-primary);">NMEA Router</h2>
        <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
    </div>
    <div class="container">
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('trips')">📋 Trips</button>
            <button class="nav-tab" onclick="switchTab('heatmap')">📊 Heatmap</button>
        </div>
        
        <div id="trips-tab" class="tab-content active">
            <div class="trips-filter">
                <label for="yearFilter">Filter:</label>
                <select id="yearFilter" onchange="filterTrips()">
                    <option value="12months">Last 12 Months</option>
                </select>
            </div>
            <div id="content">
                <div class="loading">Loading trips...</div>
            </div>
        </div>
        
        <div id="heatmap-tab" class="tab-content">
            <div class="controls">
                <label for="dateInput">End Date:</label>
                <input type="date" id="dateInput">
                <button onclick="loadHeatmap()">Load Heatmap</button>
            </div>
            <div id="errorContainer"></div>
            <div class="stats" id="stats"></div>
            <div id="loadingContainer" style="display: none;" class="loading">
                Loading heatmap data...
            </div>
            <div id="heatmapContainer" style="display: none;">
                <div class="heatmap-wrapper">
                    <div class="day-labels">
                        <div class="day-label">Mon</div>
                        <div class="day-label">Tue</div>
                        <div class="day-label">Wed</div>
                        <div class="day-label">Thu</div>
                        <div class="day-label">Fri</div>
                        <div class="day-label">Sat</div>
                        <div class="day-label">Sun</div>
                    </div>
                    <div class="heatmap-inner">
                        <div class="heatmap" id="heatmap"></div>
                        <div class="week-labels" id="weekLabels"></div>
                    </div>
                </div>
                <div class="legend">
                    <span>Less</span>
                    <div class="legend-box" style="background-color: var(--heatmap-empty);"></div>
                    <div class="legend-box" style="background-color: var(--heatmap-1);"></div>
                    <div class="legend-box" style="background-color: var(--heatmap-2);"></div>
                    <div class="legend-box" style="background-color: var(--heatmap-3);"></div>
                    <div class="legend-box" style="background-color: var(--heatmap-4);"></div>
                    <div class="legend-box" style="background-color: var(--heatmap-5);"></div>
                    <span>More</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Track if heatmap has been loaded
        let heatmapLoaded = false;

        // Tab switching
        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.tab-content');
            const navTabs = document.querySelectorAll('.nav-tab');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            navTabs.forEach(tab => tab.classList.remove('active'));
            
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
            
            if (tabName === 'heatmap') {
                const dateInput = document.getElementById('dateInput');
                if (!dateInput.value) {
                    const today = new Date();
                    dateInput.value = today.toISOString().split('T')[0];
                    loadHeatmap();
                }
            }
        }

        // Trips functions
        async function loadTrips() {
            try {
                const response = await fetch('/api/trips');
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status + ': ' + response.statusText);
                }
                const result = await response.json();
                if (result.status !== 'ok') {
                    throw new Error(result.error || 'Failed to load trips');
                }

                // Store all trips for filtering
                window.allTrips = result.data;
                
                // Populate year filter dropdown
                populateYearFilter(result.data);
                
                // Display with default filter
                filterTrips();
            } catch (error) {
                document.getElementById('content').innerHTML =
                    '<div class="error">Failed to load trips: ' + error.message + '</div>';
            }
        }

        function populateYearFilter(trips) {
            if (!trips || trips.length === 0) return;
            
            const yearSet = new Set();
            trips.forEach(trip => {
                if (trip.start_date) {
                    const year = new Date(trip.start_date).getFullYear();
                    yearSet.add(year);
                }
            });
            
            const years = Array.from(yearSet).sort((a, b) => b - a);
            const yearFilter = document.getElementById('yearFilter');
            
            // Clear existing options except the first one
            while (yearFilter.options.length > 1) {
                yearFilter.remove(1);
            }
            
            // Add year options
            years.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearFilter.appendChild(option);
            });
        }

        function filterTrips() {
            const filterValue = document.getElementById('yearFilter').value;
            let filteredTrips = window.allTrips || [];
            
            if (filterValue !== '12months') {
                const selectedYear = parseInt(filterValue);
                filteredTrips = filteredTrips.filter(trip => {
                    if (trip.start_date) {
                        const year = new Date(trip.start_date).getFullYear();
                        return year === selectedYear;
                    }
                    return false;
                });
            }
            
            displayTrips(filteredTrips);
        }

        function displayTrips(trips) {
            const content = document.getElementById('content');

            if (!trips || trips.length === 0) {
                content.innerHTML = '<div class="no-trips">No trips found in the last 12 months</div>';
                return;
            }

            let html = '<div class="trips-grid">';

            trips.forEach(trip => {
                const totalDistance = trip.total_distance_nm;
                const sailingDistance = trip.sailing_distance_nm;
                const motoringDistance = trip.motoring_distance_nm;
                const sailingPercent = totalDistance > 0 ? (sailingDistance / totalDistance * 100) : 0;

                const totalTime = trip.total_time_ms;
                const sailingTime = trip.sailing_time_ms;
                const motoringTime = trip.motoring_time_ms;
                const sailingTimePercent = totalTime > 0 ? (sailingTime / totalTime * 100) : 0;

                html += '<a href="trip.html?id=' + trip.id + '" class="trip-card">' +
                    '<div class="trip-title">' + (trip.description || 'Trip ' + trip.id) + '</div>' +
                    '<div class="trip-dates">' + formatDate(trip.start_date) + ' - ' + formatDate(trip.end_date) + '</div>' +
                    '<div class="trip-stats">' +
                        '<div class="stat-item">' +
                            '<div class="stat-label">Distance</div>' +
                            '<div class="stat-value">' + totalDistance.toFixed(1) + ' NM</div>' +
                            '<div class="progress-bar">' +
                                '<div class="progress-fill" style="--sailing-percent: ' + sailingPercent + '%"></div>' +
                            '</div>' +
                            '<div style="font-size: 11px; margin-top: 5px;">' +
                                '<span class="sailing-percentage">' + sailingPercent.toFixed(1) + '% sailing</span> | ' +
                                '<span class="motoring-percentage">' + (100 - sailingPercent).toFixed(1) + '% motoring</span>' +
                            '</div>' +
                        '</div>' +
                        '<div class="stat-item">' +
                            '<div class="stat-label">Time</div>' +
                            '<div class="stat-value">' + formatDuration(totalTime) + '</div>' +
                            '<div class="progress-bar">' +
                                '<div class="progress-fill" style="--sailing-percent: ' + sailingTimePercent + '%"></div>' +
                            '</div>' +
                            '<div style="font-size: 11px; margin-top: 5px;">' +
                                '<span class="sailing-percentage">' + sailingTimePercent.toFixed(1) + '% sailing</span> | ' +
                                '<span class="motoring-percentage">' + (100 - sailingTimePercent).toFixed(1) + '% motoring</span>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</a>';
            });

            html += '</div>';
            content.innerHTML = html;
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'Unknown';
            try {
                const date = new Date(dateStr);
                return date.toLocaleDateString();
            } catch (e) {
                return dateStr;
            }
        }

        function formatDuration(ms) {
            if (!ms) return '0h 0m';
            const totalMinutes = Math.floor(ms / (1000 * 60));
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            return hours + 'h ' + minutes + 'm';
        }

        // Heatmap functions
        function getColorVariable(value, minDistance, maxDistance) {
            if (value === 0) return '--heatmap-empty';
            
            const ratio = (value - minDistance) / (maxDistance - minDistance);
            
            if (ratio < 0.2) return '--heatmap-1';
            if (ratio < 0.4) return '--heatmap-2';
            if (ratio < 0.6) return '--heatmap-3';
            if (ratio < 0.8) return '--heatmap-4';
            return '--heatmap-5';
        }

        async function loadHeatmap() {
            const dateInput = document.getElementById('dateInput').value;
            const errorContainer = document.getElementById('errorContainer');
            const loadingContainer = document.getElementById('loadingContainer');
            const heatmapContainer = document.getElementById('heatmapContainer');
            const statsContainer = document.getElementById('stats');
            const heatmap = document.getElementById('heatmap');
            const weekLabels = document.getElementById('weekLabels');

            errorContainer.innerHTML = '';
            loadingContainer.style.display = 'block';
            heatmapContainer.style.display = 'none';
            statsContainer.innerHTML = '';

            if (!dateInput) {
                errorContainer.innerHTML = '<div class="error">Please select a date</div>';
                loadingContainer.style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`/api/heatmap?date=${dateInput}`);
                if (!response.ok) {
                    throw new Error('Failed to load heatmap data');
                }

                const result = await response.json();
                if (result.error) {
                    throw new Error(result.error);
                }

                const data = result.data;
                
                // Update stats
                statsContainer.innerHTML = `
                    <div class="stat-box">
                        <div class="stat-label">Total Distance</div>
                        <div class="stat-value">${data.total_distance.toFixed(2)} nm</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Max Daily Distance</div>
                        <div class="stat-value">${data.max_distance.toFixed(2)} nm</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Min Daily Distance</div>
                        <div class="stat-value">${data.min_distance.toFixed(2)} nm</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Active Days</div>
                        <div class="stat-value">${data.days.filter(d => d.distance_nm > 0).length}</div>
                    </div>
                `;

                // Build date map for quick lookup
                const dateMap = {};
                data.days.forEach(day => {
                    dateMap[day.date] = day.distance_nm;
                });

                // Generate heatmap cells
                heatmap.innerHTML = '';
                weekLabels.innerHTML = '';
                
                const endDate = new Date(dateInput);
                const startDate = new Date(endDate);
                startDate.setDate(startDate.getDate() - 364);

                const adjustedStartDate = new Date(startDate);
                const dayOfWeek = adjustedStartDate.getDay();
                const daysToMonday = (dayOfWeek === 0 ? 6 : dayOfWeek - 1);
                adjustedStartDate.setDate(adjustedStartDate.getDate() - daysToMonday);

                const adjustedEndDate = new Date(endDate);
                const dayOfWeekEnd = adjustedEndDate.getDay();
                const daysToSunday = (dayOfWeekEnd === 0 ? 0 : 7 - dayOfWeekEnd);
                adjustedEndDate.setDate(adjustedEndDate.getDate() + daysToSunday);

                const weeks = [];
                let currentMonday = new Date(adjustedStartDate);
                
                while (currentMonday <= adjustedEndDate) {
                    const weekDays = [];
                    for (let i = 0; i < 7; i++) {
                        const dayDate = new Date(currentMonday);
                        dayDate.setDate(dayDate.getDate() + i);
                        weekDays.push(dayDate);
                    }
                    weeks.push(weekDays);
                    currentMonday.setDate(currentMonday.getDate() + 7);
                }

                let lastMonth = null;
                const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                
                for (let weekIdx = 0; weekIdx < weeks.length; weekIdx++) {
                    const week = weeks[weekIdx];
                    
                    const weekLabelDiv = document.createElement('div');
                    weekLabelDiv.className = 'week-label';
                    const weekLabelDate = new Date(week[0]);
                    const currentMonth = weekLabelDate.getMonth();
                    const monthLabel = monthNames[currentMonth];
                    
                    if (lastMonth !== currentMonth) {
                        weekLabelDiv.textContent = monthLabel;
                        weekLabelDiv.style.fontWeight = 'bold';
                        lastMonth = currentMonth;
                    } else {
                        weekLabelDiv.textContent = '';
                        weekLabelDiv.style.opacity = '0.3';
                    }
                    weekLabels.appendChild(weekLabelDiv);
                    
                    for (let dayIdx = 0; dayIdx < 7; dayIdx++) {
                        const dayDate = week[dayIdx];
                        const dateStr = dayDate.toISOString().split('T')[0];
                        const distance = dateMap[dateStr] || 0;

                        const cell = document.createElement('div');
                        cell.className = distance === 0 ? 'heatmap-cell empty' : 'heatmap-cell';
                        
                        const colorVar = getColorVariable(distance, data.min_distance, data.max_distance);
                        cell.style.setProperty('--cell-color', `var(${colorVar})`);
                        cell.style.gridColumn = (weekIdx + 1).toString();
                        cell.style.gridRow = (dayIdx + 1).toString();
                        
                        const dayName = dayDate.toLocaleDateString('en-US', { weekday: 'short' });
                        cell.title = `${dateStr} (${dayName})\n${distance.toFixed(2)} nm`;
                        
                        cell.addEventListener('mouseenter', (e) => {
                            const tooltip = document.createElement('div');
                            tooltip.className = 'tooltip';
                            tooltip.textContent = cell.title.replace(/\n/, ' - ');
                            tooltip.style.left = e.pageX + 'px';
                            tooltip.style.top = (e.pageY - 30) + 'px';
                            document.body.appendChild(tooltip);
                            
                            cell._tooltip = tooltip;
                        });
                        
                        cell.addEventListener('mouseleave', () => {
                            if (cell._tooltip) {
                                cell._tooltip.remove();
                                delete cell._tooltip;
                            }
                        });

                        heatmap.appendChild(cell);
                    }
                }

                loadingContainer.style.display = 'none';
                heatmapContainer.style.display = 'block';
                heatmapLoaded = true;

            } catch (error) {
                errorContainer.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                loadingContainer.style.display = 'none';
            }
        }

        // Load trips when page loads
        loadTrips();

        // Theme handling
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
            document.getElementById('themeBtn').textContent = '☀️ Light';
        }

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-theme');
            const themeBtn = document.getElementById('themeBtn');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeBtn.textContent = isDark ? '☀️ Light' : '🌙 Dark';
            
            // Reload heatmap with new colors if it has been loaded
            if (heatmapLoaded) {
                loadHeatmap();
            }
        }
    </script>
</body>
</html>
