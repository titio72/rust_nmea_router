<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Details - NMEA Router</title>
    <link rel="icon" type="image/png" href="/images/nmeasail.png">
    <link rel="stylesheet" href="/shared.css">
    <link rel="stylesheet" href="/libs/leaflet.min.css" />
    <link rel="stylesheet" href="/libs/leaflet.fullscreen.css"/>
    <script src="/js/shared-theme.js?v=3"></script>
    <script src="/libs/chart.min.js"></script>
    <script src="/libs/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="/libs/leaflet.min.js"></script>
    <script src="/libs/leaflet.fullscreen.js"></script>
    <script src="/js/map-lat-lon-panel.js"></script>
    <style>
        #tripDetails {
            width: 100%;
            padding: 0;
        }
        .analyticsTitle {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 15px;
            grid-column: 1 / -1;
        }
        .analyticsGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            grid-column: 1 / -1;
        }
        .analyticsCard {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            border-left: 3px solid var(--link-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .infoAndMapContainer {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        @media (max-width: 900px) {
            .infoAndMapContainer {
                grid-template-columns: 1fr;
            }
        }
        #map {
            flex: 1;
            min-height: 300px;
        }
        .map-card {
            display: flex;
            flex-direction: column;
        }
        .mapLegend {
            margin-top: 15px;
            padding: 15px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        .legendTitle {
            font-weight: bold;
            color: var(--text-bold);
            font-size: 14px;
            flex-basis: 100%;
            margin-bottom: 0;
        }
        .legendItem {
            display: flex;
            align-items: center;
            margin-bottom: 0;
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .legendColor {
            width: 16px;
            height: 16px;
            border-radius: 2px;
            margin-right: 10px;
            border: 1px solid var(--border-color);
        }
        .legendColorGradient {
            width: 16px;
            height: 16px;
            margin-right: 10px;
            background: linear-gradient(to right, #ff0000, #ffff00, #0000ff);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }
        .chartsContainer {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }
        @media (max-width: 900px) {
            .chartsContainer {
                grid-template-columns: 1fr;
            }
        }

        .chartWrapper {
            min-height: 500px;
            height: 100%;
        }

        .chartToolbar {
            position: absolute;
            top: 5px;
            right: 5px;
        }

        .chartToggleBtn {
            padding: 6px 12px;
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s ease;
        }
        .chartToggleBtn:hover {
            background-color: var(--bg-hover);
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
        }
        .error {
            color: #e74c3c;
            text-align: center;
            padding: 20px;
        }
        .fastestSegmentCard {
            cursor: pointer;
        }
        .fastestSegmentCard:hover {
            background-color: var(--bg-secondary);
            box-shadow: 0 0 8px rgba(93, 186, 255, 0.3);
        }
        .analyticsCardTitle {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-tertiary);
            margin-bottom: 6px;
            text-align: left;
        }
        .analyticsValue {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-bold);
            margin-bottom: 4px;
            text-align: left;
        }
        .analyticsDetail {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
            line-height: 1.3;
        }
        .legNavigator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .tripDescription {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-primary);
            flex: 1;
        }
        .navButtons {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .legDisplay {
            font-weight: bold;
            font-size: 16px;
            color: var(--text-primary);
            min-width: 180px;
            text-align: center;
            padding: 10px 20px;
            background: var(--bg-secondary);
        }
    </style>
</head>
<body>
    <div id="headerContainer"></div>
    <div id="tripContainer" class="level-1-container">
        <div id="tripDetails">
            <div class="infoAndMapContainer">
                <div class="app-card"> <!-- trip info, stats, and legs navigation -->
                    <div id="legSelectorContainer">
                        <div class="legNavigator">
                            <div id="tripDescriptionLabel" class="tripDescription"></div>
                            <div class="navButtons">

                                <div id="legDisplay" class="legDisplay"></div>
                                <button class="app-btn" onclick="nextLeg()" title="Next">&gt;&gt;</button>
                                <button class="app-btn" data-ro-hidden onclick="recalculateLegs(event)" title="Recalculate Legs">&#x21BA;</button>
                                <button class="app-btn" data-ro-hidden onclick="goToFixEngineStatus()" title="Fix Engine Status"><app-icon name="wrench"></app-icon></button>
                            </div>

                    </div>
                    <div class="card-stats">

                            <div class="card-stat-label">Start Date</div>
                            <div id="startDateValue" class="card-stat-value"></div>

                            <div id="endDateValue" class="card-stat-value"></div>

                            <div class="card-stat-label">Duration</div>

                    </div>

                        <div class="card-stat" id="navigationTimeStat">
                            <div class="card-stat-label">Navigation Time</div>

                        </div>
                        <div class="stat-divider"></div>
                        <div class="card-stat" id="sailingTimeStat">
                            <div class="card-stat-label">Sailing Time</div>
                            <div id="sailingTimeValue" class="card-stat-value"></div>
                            <div class="card-stat-detail"><span id="sailingTimePercentageValue" class="sailing-percentage"></span></div>

                            <div class="card-stat-label">Motoring Time</div>
                            <div id="motoringTimeValue" class="card-stat-value"></div>
                            <div class="card-stat-detail"><span id="motoringTimePercentageValue" class="motoring-percentage"></span></div>
                        </div>

                    <div class="card-stats">

                            <div id="upwindTimeValue" class="card-stat-value"></div>
                            <div class="card-stat-detail"><span id="upwindTimePercentageValue" class="sailing-percentage"></span></div>
                        </div>

                        </div>
                        <div class="stat-divider"></div>

                            <div class="card-stat-label">Running</div>

                            <div class="card-stat-detail"><span id="runningTimePercentageValue" class="sailing-percentage"></span></div>
                        </div>
                    </div>
                    <div class="card-stats">
                        <div class="card-stat" id="totalDistanceStat">
                            <div class="card-stat-label">Total Distance</div>
                            <div id="totalDistanceValue" class="card-stat-value"></div>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="card-stat" id="sailingDistanceStat">
                            <div class="card-stat-label">Sailing</div>
                            <div id="sailingDistanceValue" class="card-stat-value"></div>
                            <div class="card-stat-detail"><span id="sailingDistancePercentageValue" class="sailing-percentage"></span></div>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="card-stat" id="motoringDistanceStat">
                            <div class="card-stat-label">Motoring</div>
                            <div id="motoringDistanceValue" class="card-stat-value"></div>
                            <div class="card-stat-detail"><span id="motoringDistancePercentageValue" class="motoring-percentage"></span></div>
                        </div>
                    </div>
                    <div class="card-stats">
                        <div class="card-stat" id="upwindDistanceStat">
                            <div class="card-stat-label">Upwind</div>
                            <div id="upwindDistanceValue" class="card-stat-value"></div>
                            <div class="card-stat-detail"><span id="upwindDistancePercentageValue" class="sailing-percentage"></span></div>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="card-stat" id="reachingDistanceStat">
                            <div class="card-stat-label">Reaching</div>
                            <div id="reachingDistanceValue" class="card-stat-value"></div>
                            <div class="card-stat-detail"><span id="reachingDistancePercentageValue" class="sailing-percentage"></span></div>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="card-stat" id="runningDistanceStat">
                            <div class="card-stat-label">Running</div>
                            <div id="runningDistanceValue" class="card-stat-value"></div>
                            <div class="card-stat-detail"><span id="runningDistancePercentageValue" class="sailing-percentage"></span></div>
                        </div>
                    </div>
                    <voyage-bar id="voyageBar"></voyage-bar>
                    <div class="card-stat fullWidth" style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                        <div class="analyticsTitle" id="analyticsTitle">Performance Analytics</div>
                        <div class="analyticsGrid" id="analyticsGrid">
                        </div>
                    </div>
                </div>
                <div class="app-card map-card"> <!-- map and legend -->
                    <div id="map"></div>
                    <div id="mapLegend" class="mapLegend">
                        <div class="legendItem">
                            <div class="legendColor" style="background-color: #FFD700;"></div>

                        <div class="legendItem">

                        </div>

    <script>
        document.getElementById('headerContainer').innerHTML = createHeaderBar('trips');
        initializeTheme();

        // This page always displays timestamps in UTC (vessel data has no meaningful
        // "local" timezone), overriding the local-time formatters from shared-theme.js.
        // Every formatted timestamp is suffixed " UTC" so it's never mistaken for local time.
        function formatDate(dateStr) {
            if (!dateStr) return 'Unknown';
            try {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit', timeZone: 'UTC' }) + ' UTC';
            } catch (e) {
                return dateStr;
            }
        }

        function formatTime(dateStr) {
            if (!dateStr) return '';
            try {
                return new Date(dateStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' }) + ' UTC';
            } catch (e) {
                return dateStr;
            }
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            try {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', { timeZone: 'UTC' }) + ' ' +
                    date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' }) + ' UTC';
            } catch (e) {
                return dateStr;
            }
        }

        // Chart.js's date-fns time adapter always renders using the browser's local
        // timezone with no UTC option, so chart axis/tooltip dates are shifted by the
        // local UTC offset before being handed to Chart.js, making them display as UTC.
        function chartUtcDate(dateStr) {
            const d = new Date(dateStr);
            return new Date(d.getTime() + d.getTimezoneOffset() * 60000);
        }

        function showMapFallback(message) {
            const mapElement = document.getElementById('map');
            if (mapElement) {
                mapElement.innerHTML = `
                    <div style="
                        display: flex;
                        flex-direction: column;
                        justify-content: center;
                        align-items: center;
                        height: 100%;
                        color: var(--text-secondary);
                        text-align: center;
                        gap: 10px;
                    ">
                        <div style="font-size: 14px; color: var(--text-secondary);">🗺️</div>
                        <div>${message}</div>
                        <div style="font-size: 12px; color: var(--text-tertiary);">Trip data is still available in charts below</div>
                    </div>
                `;
            }
        }


        // Theme management - override toggleTheme to reload charts when theme changes
        function toggleTheme() {
            baseToggleTheme();

            // Recreate all charts with new theme
            if (currentTrip && selectedLeg !== undefined) {
                loadTripDetails(tripId, selectedLeg).catch(error => {
                    console.error('Failed to reload charts:', error);
                });
            }
        }

        function addChart(container, id, switchAngleBtnId, toggleFunction) {
            const appCard = document.createElement('div');
            appCard.className = 'app-card';

            const chartWrapper = document.createElement('div');
            chartWrapper.className = 'chartWrapper';
            const canvas = document.createElement('canvas');
            canvas.id = id;
            chartWrapper.appendChild(canvas);

            if (switchAngleBtnId && toggleFunction) {
                const toolbar = document.createElement('div');
                toolbar.className = 'chartToolbar';
                const button = document.createElement('button');
                button.id = switchAngleBtnId;
                button.className = 'chartToggleBtn';
                button.textContent = 'Switch to −180…180';
                button.onclick = toggleFunction;
                toolbar.appendChild(button);
                chartWrapper.appendChild(toolbar);
            }

            appCard.appendChild(chartWrapper);
            container.appendChild(appCard);
            return canvas.getContext('2d');
        }

        function initializeChartsLeg(isVisible) {
            const legChartsContainer = document.getElementById('chartsContainerLeg');
            legChartsContainer.innerHTML = ''; // Clear any existing charts
            if (!isVisible) return;
            addChart(legChartsContainer, 'speedChart');
            addChart(legChartsContainer, 'speedDistributionChart');
            addChart(legChartsContainer, 'headingChart', 'headingScaleBtn', toggleHeadingScale);
            addChart(legChartsContainer, 'windSpeedChart');
            addChart(legChartsContainer, 'twaDistributionChart');
            addChart(legChartsContainer, 'windStatisticsChart');
            addChart(legChartsContainer, 'rollAngleChart');
            addChart(legChartsContainer, 'heelDistributionChart');
        }

        function initializeChartsTrip(isVisible) {
            chartsContainer = document.getElementById('chartsContainerTrip');
            chartsContainer.innerHTML = ''; // Clear any existing charts
            if (!isVisible) return;
            addChart(chartsContainer, 'atmosphericPressureChart');
            addChart(chartsContainer, 'absoluteWindDirectionChart', 'absoluteWindDirectionScaleBtn', toggleAbsoluteWindDirectionScale);
            addChart(chartsContainer, 'cabinTemperatureChart');
            addChart(chartsContainer, 'humidityChart');
        }

        // A chart can't usefully render more distinct data points than it has pixels of
        // width — anything beyond that is fetched, parsed and thrown away by Chart.js's
        // own decimation. The canvas is already in the DOM (and CSS-forced to
        // width:100% of its container, see shared.css) by the time chart data is
        // fetched, so its rendered width is a known quantity we can ask the server for
        // directly instead of guessing a fixed point count.
        function getChartMaxPoints(canvasId, fallback) {
            const el = document.getElementById(canvasId);
            const width = el ? Math.round(el.clientWidth) : 0;
            return width > 0 ? width : fallback;
        }

        function getChartColors() {
            const isDark = document.body.classList.contains('dark-theme');
            return {
                text: isDark ? '#e0e0e0' : '#333',
                grid: isDark ? '#444' : '#e0e0e0',
                background: isDark ? '#2d2d2d' : 'white'
            };
        }

        function getTimeXScale(colors) {
            return {
                type: 'time',
                time: {
                    displayFormats: {
                        millisecond: 'HH:mm',
                        second: 'HH:mm',
                        minute: 'HH:mm',
                        hour: 'HH:mm',
                        day: 'MM/dd HH:mm'
                    }
                },
                ticks: {
                    color: colors.text,
                    maxRotation: 45,
                    minRotation: 45
                },
                grid: { color: colors.grid },
                title: {
                    display: true,
                    text: 'Time (UTC)',
                    color: colors.text
                }
            };
        }

        // Build navigation/mooring bands from currentLegs for chart background shading
        function build_leg_bands(tripStart, tripEnd) {
            if (!currentLegs || currentLegs.length === 0) return [];
            const bands = [];
            const tripStartMs = new Date(tripStart).getTime();
            const tripEndMs = new Date(tripEnd).getTime();
            const sortedLegs = [...currentLegs].sort((a, b) =>
                new Date(a.start_timestamp) - new Date(b.start_timestamp));

            // Mooring gap before first leg
            const firstLegStart = new Date(sortedLegs[0].start_timestamp).getTime();
            if (firstLegStart > tripStartMs) {
                bands.push({ start: chartUtcDate(tripStart), end: chartUtcDate(sortedLegs[0].start_timestamp), type: 'moored' });
            }

            for (let i = 0; i < sortedLegs.length; i++) {
                bands.push({ start: chartUtcDate(sortedLegs[i].start_timestamp), end: chartUtcDate(sortedLegs[i].end_timestamp), type: 'nav' });
                if (i + 1 < sortedLegs.length) {
                    bands.push({ start: chartUtcDate(sortedLegs[i].end_timestamp), end: chartUtcDate(sortedLegs[i + 1].start_timestamp), type: 'moored' });
                }
            }

            // Mooring gap after last leg
            const lastLegEnd = new Date(sortedLegs[sortedLegs.length - 1].end_timestamp).getTime();
            if (lastLegEnd < tripEndMs) {
                bands.push({ start: chartUtcDate(sortedLegs[sortedLegs.length - 1].end_timestamp), end: chartUtcDate(tripEnd), type: 'moored' });
            }

            return bands;
        }

        // Chart.js inline plugin: draws shaded leg bands on time-axis charts
        const legBandPlugin = {
            id: 'legBands',
            beforeDraw(chart, args, options) {
                if (!options || !options.bands || options.bands.length === 0) return;
                const { ctx, chartArea, scales } = chart;
                const xScale = scales.x;
                if (!xScale || !chartArea) return;
                ctx.save();
                for (const band of options.bands) {
                    const x1 = Math.max(xScale.getPixelForValue(band.start), chartArea.left);
                    const x2 = Math.min(xScale.getPixelForValue(band.end), chartArea.right);
                    if (x2 <= x1) continue;
                    ctx.fillStyle = band.type === 'nav'
                        ? 'rgba(52, 152, 219, 0.09)'   // blue tint = navigation leg
                        : 'rgba(210, 140, 30, 0.14)';   // amber tint = moored
                    ctx.fillRect(x1, chartArea.top, x2 - x1, chartArea.height);
                }
                ctx.restore();
            }
        };

        // Initialize theme on page load
        initializeTheme();

        // Get trip ID and optional leg number from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const tripId = urlParams.get('id');
        const urlLegParam = urlParams.get('leg');
        const requestedLeg = urlLegParam !== null ? parseInt(urlLegParam, 10) : null;

        // Global variables to store trip data and legs
        let currentTrip = null;
        let currentLegs = [];
        let selectedLeg = null; // null means entire trip
        let allCharts = {};
        let currentMap = null; // Global reference to the map
        let currentAnalyticsData = null; // Global reference to analytics data
        let currentTrackData = null; // Global reference to track data for segment markers
        let currentIsFullTrip = false;
        let currentNavStartTs = null; // Nav window start for the currently displayed leg
        let currentNavEndTs = null;   // Nav window end for the currently displayed leg
        let fullTrackData = null; // Global reference to full trip track data (loaded once)
        let segmentMarkers = []; // Array to store segment start/end markers
        let headingScaleNormalized = false; // Toggle for heading chart scale (0-360 vs -180 to 180)
        let absoluteWindDirectionNormalized = false; // Toggle for absolute wind direction chart scale (0-360 vs -180 to 180)
        let currentAbsoluteWindData = null; // Metric data for absolute wind direction (for scale toggling)
        let currentWindSpeedData = null; // Metric data for wind speed (for chart toggling)

        // --- Perf instrumentation: time from the first server call to charts/map fully populated. ---
        // perfStart is reset in loadTripAndLegs (the actual first fetch of a page load / recalc reload).
        // Leg-selector switches call loadTripDetails directly without going through loadTripAndLegs
        // again, so their marks land on the same timeline as whatever load most recently reset it.
        let perfStart = null;
        let perfMarks = [];
        function markTime(label, meta) {
            if (perfStart === null) return;
            const now = performance.now();
            const elapsed = now - perfStart;
            const prevElapsed = perfMarks.length ? perfMarks[perfMarks.length - 1].elapsed : 0;
            perfMarks.push({ label, elapsed, delta: elapsed - prevElapsed, meta: meta || {} });
            console.log(
                '[timing] ' + label + ': +' + elapsed.toFixed(1) + 'ms (Δ' + (elapsed - prevElapsed).toFixed(1) + 'ms) ' +
                JSON.stringify(meta || {})
            );
        }
        function summarizePerf(finalLabel, meta) {
            markTime(finalLabel, meta);
            console.table(perfMarks.map(m => ({
                label: m.label,
                elapsed_ms: m.elapsed.toFixed(1),
                delta_ms: m.delta.toFixed(1),
                ...m.meta
            })));
        }

        if (!tripId) {
            //document.getElementById('tripDetails').innerHTML =
            //    '<div class="error">No trip ID specified</div>';
        } else {
            loadTripAndLegs(tripId);
        }

        async function loadTripAndLegs(tripId) {
            perfStart = performance.now();
            perfMarks = [];
            markTime('fetch_start');
            try {
                const legsPromise = fetch('/api/trip_legs?id=' + tripId);

                // Load trip summary and full track in parallel; use max_points=1800 for
                // the full-trip view — the map polyline does not need 1-second resolution
                const [tripResponse, legsResponse, trackResponse] = await Promise.all([
                    fetch('/api/trip?id=' + tripId),
                    legsPromise,
//                    fetch('/api/track?trip_id=' + tripId + '&max_points=1800', { priority: 'high' })
                    fetch('/api/track?trip_id=' + tripId, { priority: 'high' })
                ]);

                if (!tripResponse.ok) {
                    throw new Error('HTTP ' + tripResponse.status + ': ' + tripResponse.statusText);
                }
                const tripResult = await tripResponse.json();
                if (tripResult.status !== 'ok' || !tripResult.data) {
                    throw new Error(tripResult.error || 'Trip not found');
                }
                currentTrip = tripResult.data;

                if (legsResponse !== null) {
                    if (!legsResponse.ok) {
                        throw new Error('HTTP ' + legsResponse.status + ': ' + legsResponse.statusText);
                    }
                    const legsResult = await legsResponse.json();
                    if (legsResult.status === 'ok' && legsResult.data.legs) {
                        currentLegs = legsResult.data.legs;
                        sessionStorage.setItem('trip_legs_' + tripId, JSON.stringify(currentLegs));
                    }
                }

                if (!trackResponse.ok) {
                    throw new Error('HTTP ' + trackResponse.status + ': ' + trackResponse.statusText);
                }
                const trackResult = await trackResponse.json();
                if (trackResult.status === 'ok' && trackResult.data) {
                    fullTrackData = trackResult.data;
                }
                markTime('initial_fetches_resolved', {
                    track_points: fullTrackData ? fullTrackData.length : 0,
                    legs: currentLegs.length
                });

                // Determine initial leg from URL parameter (validate against loaded legs)
                let initialLeg = null;
                let initialLegNumber = null;
                if (requestedLeg !== null && !isNaN(requestedLeg)) {
                    const leg = currentLegs.find(l => l.leg_number === requestedLeg);
                    if (leg) {
                        initialLeg = leg;
                        initialLegNumber = requestedLeg;
                    }
                }

                // Display leg selector and initial trip/leg view immediately
                updateLegSelector(initialLegNumber);
                await loadTripDetails(tripId, initialLeg);
            } catch (error) {
                //document.getElementById('tripDetails').innerHTML =
                //    '<div class="error">Failed to load trip: ' + error.message + '</div>';
            }
        }

        async function recalculateLegs(event) {
            const btn = event.currentTarget;
            btn.disabled = true;
            const original = btn.textContent;
            btn.textContent = 'Recalculating…';
            try {
                const resp = await fetch('/api/invalidate_trip_legs?id=' + tripId, {
                    method: 'POST', credentials: 'same-origin'
                });
                const result = await resp.json();
                if (result.status !== 'ok') throw new Error(result.error || 'Failed');
                currentLegs = [];
                await loadTripAndLegs(tripId);
            } catch (err) {
                alert('Failed to recalculate legs: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = original;
            }
        }

        function goToFixEngineStatus() {
            let url = '/fix-engine-status.html?id=' + tripId;
            if (selectedLeg !== null) {
                url += '&leg=' + selectedLeg;
            }
            window.location.href = url;
        }

        function updateLegSelector(initialLegNumber) {
            if (currentLegs.length === 0) {
                // No legs, don't show selector
                return;
            }

            window.legNavigation = [null, ...currentLegs];

            // Set initial index from URL parameter if valid
            if (initialLegNumber !== null && initialLegNumber !== undefined) {
                const idx = window.legNavigation.findIndex(l => l !== null && l.leg_number === initialLegNumber);
                window.currentLegIndex = idx > 0 ? idx : 0;
            } else {
                window.currentLegIndex = 0;
            }

            const description = currentTrip.description || 'Trip ' + currentTrip.id;
            document.getElementById('tripDescriptionLabel').textContent = description;

            const displayIdx = window.currentLegIndex;
            if (displayIdx === 0) {
                document.getElementById('legDisplay').textContent = 'Trip (' + currentLegs.length + ' legs)';
            } else {
                const leg = window.legNavigation[displayIdx];
                document.getElementById('legDisplay').textContent = 'Leg ' + leg.leg_number + ' of ' + currentLegs.length;
            }
        }

        function previousLeg() {
            window.currentLegIndex = (window.currentLegIndex - 1 + window.legNavigation.length) % window.legNavigation.length;
            updateLegDisplay();
        }

        function nextLeg() {
            window.currentLegIndex = (window.currentLegIndex + 1) % window.legNavigation.length;
            updateLegDisplay();
        }

        function updateLegDisplay() {
            const leg = window.legNavigation[window.currentLegIndex];
            const displayEl = document.getElementById('legDisplay');

            if (leg === null) {
                displayEl.textContent = 'Trip (' + currentLegs.length + ' legs)';
                selectLeg(null);
            } else {
                const totalLegs = currentLegs.length;
                displayEl.textContent = 'Leg ' + leg.leg_number + ' of ' + totalLegs;
                selectLeg(leg.leg_number);
            }
        }

        async function selectLeg(legNumber) {
            selectedLeg = legNumber;

            if (legNumber === null) {
                await loadTripDetails(tripId, null);
            } else {
                const leg = currentLegs.find(l => l.leg_number === legNumber);
                if (leg) {
                    await loadTripDetails(tripId, leg);
                }
            }
        }

        async function loadTripDetails(tripId, selectedLeg) {
            try {
                // Prepare trip data and time range
                let tripData;
                let startTime, endTime;
                let isFullTrip = selectedLeg === null;

                if (isFullTrip) {
                    // Entire trip
                    tripData = {
                        ...currentTrip,
                        total_time_ms: (currentTrip.sailing_time_ms || 0) + (currentTrip.motoring_time_ms || 0)
                    };
                    startTime = currentTrip.start_date;
                    endTime = currentTrip.end_date;
                } else {
                    // Single leg
                    tripData = {
                        id: currentTrip.id,
                        description: (currentTrip.description || 'Trip ' + currentTrip.id) + ' - Leg ' + selectedLeg.leg_number,
                        start_date: selectedLeg.start_timestamp,
                        end_date: selectedLeg.end_timestamp,
                        total_distance_nm: selectedLeg.total_distance_nm,
                        sailing_distance_nm: selectedLeg.sailing_distance_nm,
                        motoring_distance_nm: selectedLeg.motoring_distance_nm,
                        sailing_time_ms: selectedLeg.sailing_time_ms,
                        motoring_time_ms: selectedLeg.motoring_time_ms,
                        upwind_distance_nm: selectedLeg.upwind_distance_nm,
                        reaching_distance_nm: selectedLeg.reaching_distance_nm,
                        running_distance_nm: selectedLeg.running_distance_nm,
                        upwind_time_ms: selectedLeg.upwind_time_ms,
                        reaching_time_ms: selectedLeg.reaching_time_ms,
                        running_time_ms: selectedLeg.running_time_ms,
                        total_time_ms: selectedLeg.sailing_time_ms + selectedLeg.motoring_time_ms,
                        nav_start_timestamp: selectedLeg.nav_start_timestamp || null,
                        nav_end_timestamp: selectedLeg.nav_end_timestamp || null
                    };
                    startTime = selectedLeg.start_timestamp;
                    endTime = selectedLeg.end_timestamp;
                }

                // Use fullTrackData directly (no fetch needed)
                let trackData = fullTrackData;

                // Filter track data to the selected leg if needed
                if (!isFullTrip) {
                    const legStartMs = new Date(startTime).getTime();
                    const legEndMs = new Date(endTime).getTime();
                    trackData = fullTrackData.filter(pt => {
                        const ptMs = new Date(pt.timestamp).getTime();
                        return ptMs >= legStartMs && ptMs <= legEndMs;
                    });
                }

                // Render basic UI with map and trip info
                markTime('before_map_render', { track_points: trackData.length });
                displayTripInfoAndMap(tripData, trackData, isFullTrip);
                markTime('map_render_done', { track_points: trackData.length });

                // Destroy existing charts
                Object.values(allCharts).forEach(chart => {
                    if (chart && typeof chart.destroy === 'function') {
                        chart.destroy();
                    }
                });
                allCharts = {};

                try {
                    currentAnalyticsData = buildAnalyticsFromLegs(currentTrip, currentLegs, selectedLeg);
                    renderAnalyticsCards(currentAnalyticsData);
                } catch (error) {
                    console.error('Failed to render analytics cards:', error);
                }
                markTime('analytics_rendered_client_side');

                // reset charts
                initializeChartsLeg(!isFullTrip);
                initializeChartsTrip(true);

                // Render time series charts only for non-full-trip views
                if (!isFullTrip) {
                    await renderLegCharts(trackData, startTime, endTime).catch(error => {
                        console.error('Failed to load leg charts:', error);
                    });
                }

                // Fetch secondary charts in parallel
                await renderTripCharts(tripData, trackData, startTime, endTime, isFullTrip).catch(error => {
                    console.error('Failed to load trip charts:', error);
                });

                summarizePerf('ALL_CHARTS_AND_MAP_POPULATED', { track_points: trackData.length });
            } catch (error) {
                console.error('Failed to load trip details:', error);
            }
        }

        function displayTripInfoAndMap(trip, trackData, isFullTrip) {
            // Calculate percentages
            const totalDistance = trip.total_distance_nm;
            const sailingDistance = trip.sailing_distance_nm;
            const motoringDistance = trip.motoring_distance_nm;
            const sailingPercent = totalDistance > 0 ? (sailingDistance / totalDistance * 100) : 0;

            const totalTime = trip.total_time_ms;
            const sailingTime = trip.sailing_time_ms;
            const motoringTime = trip.motoring_time_ms;
            const sailingTimePercent = totalTime > 0 ? (sailingTime / totalTime * 100) : 0;

            document.getElementById('startDateValue').textContent = formatDate(trip.start_date);
            document.getElementById('startTimeValue').textContent = formatTime(trip.start_date);
            document.getElementById('endDateValue').textContent = formatDate(trip.end_date);
            document.getElementById('endTimeValue').textContent = formatTime(trip.end_date);
            document.getElementById('durationValue').textContent = formatDurationLong(trip.start_date, trip.end_date);
            document.getElementById('navigationTimeValue').textContent = formatDuration(totalTime);
            document.getElementById('sailingTimeValue').textContent = formatDuration(sailingTime);
            document.getElementById('sailingTimePercentageValue').textContent = sailingTimePercent.toFixed(1) + '%';
            document.getElementById('motoringTimeValue').textContent = formatDuration(motoringTime);
            document.getElementById('motoringTimePercentageValue').textContent = (100 - sailingTimePercent).toFixed(1) + '%';
            document.getElementById('totalDistanceValue').textContent = totalDistance.toFixed(1) + ' NM';
            document.getElementById('sailingDistanceValue').textContent = sailingDistance.toFixed(1) + ' NM';
            document.getElementById('sailingDistancePercentageValue').textContent = sailingPercent.toFixed(1) + '%';
            document.getElementById('motoringDistanceValue').textContent = motoringDistance.toFixed(1) + ' NM';
            document.getElementById('motoringDistancePercentageValue').textContent = (100 - sailingPercent).toFixed(1) + '%';
            const upwindTime = trip.upwind_time_ms || 0;
            const reachingTime = trip.reaching_time_ms || 0;
            const runningTime = trip.running_time_ms || 0;
            const upwindDistance = trip.upwind_distance_nm || 0;
            const reachingDistance = trip.reaching_distance_nm || 0;
            const runningDistance = trip.running_distance_nm || 0;
            // Point-of-sail is a subdivision of sailing, so percentages are relative to
            // sailing time/distance, not total trip time/distance.
            const upwindTimePercent = sailingTime > 0 ? (upwindTime / sailingTime * 100) : 0;
            const reachingTimePercent = sailingTime > 0 ? (reachingTime / sailingTime * 100) : 0;
            const runningTimePercent = sailingTime > 0 ? (runningTime / sailingTime * 100) : 0;
            const upwindDistancePercent = sailingDistance > 0 ? (upwindDistance / sailingDistance * 100) : 0;
            const reachingDistancePercent = sailingDistance > 0 ? (reachingDistance / sailingDistance * 100) : 0;
            const runningDistancePercent = sailingDistance > 0 ? (runningDistance / sailingDistance * 100) : 0;

            document.getElementById('upwindTimeValue').textContent = formatDuration(upwindTime);
            document.getElementById('upwindTimePercentageValue').textContent = upwindTimePercent.toFixed(1) + '%';
            document.getElementById('reachingTimeValue').textContent = formatDuration(reachingTime);
            document.getElementById('reachingTimePercentageValue').textContent = reachingTimePercent.toFixed(1) + '%';
            document.getElementById('runningTimeValue').textContent = formatDuration(runningTime);
            document.getElementById('runningTimePercentageValue').textContent = runningTimePercent.toFixed(1) + '%';
            document.getElementById('upwindDistanceValue').textContent = upwindDistance.toFixed(1) + ' NM';
            document.getElementById('upwindDistancePercentageValue').textContent = upwindDistancePercent.toFixed(1) + '%';
            document.getElementById('reachingDistanceValue').textContent = reachingDistance.toFixed(1) + ' NM';
            document.getElementById('reachingDistancePercentageValue').textContent = reachingDistancePercent.toFixed(1) + '%';
            document.getElementById('runningDistanceValue').textContent = runningDistance.toFixed(1) + ' NM';
            document.getElementById('runningDistancePercentageValue').textContent = runningDistancePercent.toFixed(1) + '%';
            const voyageBarEl = document.getElementById('voyageBar');
            voyageBarEl.setAttribute('sailing-distance', sailingDistance.toFixed(1));
            voyageBarEl.setAttribute('motoring-distance', motoringDistance.toFixed(1));
            voyageBarEl.setAttribute('total-distance', totalDistance.toFixed(1));

            // Save state globally (used by late-loading Google Maps recovery and segment markers)
            currentTrackData = trackData;
            currentIsFullTrip = isFullTrip;
            currentNavStartTs = isFullTrip ? null : (trip.nav_start_timestamp || null);
            currentNavEndTs   = isFullTrip ? null : (trip.nav_end_timestamp   || null);

            // Initialize the map
            initializeMap(trackData, isFullTrip, currentNavStartTs, currentNavEndTs);
        }

        function averageSpeed(distanceNm, timeMs) {
            if (!timeMs || timeMs <= 0) return null;
            return distanceNm / (timeMs / 3600000);
        }

        // Builds the same shape /api/track_analytics used to return, from data already loaded via
        // /api/trip and /api/trip_legs — no network request needed. selectedLeg is the TripLeg object
        // for a single-leg view, or null for the full-trip view (best-of across all legs).
        function buildAnalyticsFromLegs(trip, legs, selectedLeg) {
            if (selectedLeg) {
                const sailingMs = selectedLeg.sailing_time_ms || 0;
                const motoringMs = selectedLeg.motoring_time_ms || 0;
                return {
                    max_speed_kn: selectedLeg.max_speed_kn ?? null,
                    max_speed_timestamp: selectedLeg.max_speed_timestamp ?? null,
                    fastest_1nm: selectedLeg.fastest_1nm ?? null,
                    fastest_5nm: selectedLeg.fastest_5nm ?? null,
                    fastest_10nm: selectedLeg.fastest_10nm ?? null,
                    fastest_25nm: selectedLeg.fastest_25nm ?? null,
                    average_speed_kn: averageSpeed(
                        (selectedLeg.sailing_distance_nm || 0) + (selectedLeg.motoring_distance_nm || 0),
                        sailingMs + motoringMs
                    ),
                    average_speed_sailing_kn: averageSpeed(selectedLeg.sailing_distance_nm || 0, sailingMs),
                    average_speed_motoring_kn: averageSpeed(selectedLeg.motoring_distance_nm || 0, motoringMs)
                };
            }

            let maxSpeedKn = null;
            let maxSpeedTimestamp = null;
            const best = { fastest_1nm: null, fastest_5nm: null, fastest_10nm: null, fastest_25nm: null };
            for (const leg of legs) {
                if (leg.max_speed_kn !== null && leg.max_speed_kn !== undefined &&
                    (maxSpeedKn === null || leg.max_speed_kn > maxSpeedKn)) {
                    maxSpeedKn = leg.max_speed_kn;
                    maxSpeedTimestamp = leg.max_speed_timestamp;
                }
                for (const key of ['fastest_1nm', 'fastest_5nm', 'fastest_10nm', 'fastest_25nm']) {
                    const candidate = leg[key];
                    if (candidate && (!best[key] || candidate.average_speed_kn > best[key].average_speed_kn)) {
                        best[key] = candidate;
                    }
                }
            }

            const sailingMs = trip.sailing_time_ms || 0;
            const motoringMs = trip.motoring_time_ms || 0;
            return {
                max_speed_kn: maxSpeedKn,
                max_speed_timestamp: maxSpeedTimestamp,
                fastest_1nm: best.fastest_1nm,
                fastest_5nm: best.fastest_5nm,
                fastest_10nm: best.fastest_10nm,
                fastest_25nm: best.fastest_25nm,
                average_speed_kn: averageSpeed(
                    (trip.sailing_distance_nm || 0) + (trip.motoring_distance_nm || 0),
                    sailingMs + motoringMs
                ),
                average_speed_sailing_kn: averageSpeed(trip.sailing_distance_nm || 0, sailingMs),
                average_speed_motoring_kn: averageSpeed(trip.motoring_distance_nm || 0, motoringMs)
            };
        }

        async function renderTripCharts(trip, trackData, startTime, endTime, isFullTrip) {
            markTime('trip_charts_start');
            try {
                const formattedStart = encodeURIComponent(startTime.split('.')[0].replace('T', ' '));
                const formattedEnd = encodeURIComponent(endTime.split('.')[0].replace('T', ' '));
                const tripChartMaxPoints = getChartMaxPoints('atmosphericPressureChart', 1000);

                // Fetch all trip-level environmental metrics in a single batch request
                const batchQuery = '/api/metrics/batch?metrics=1,2,4,5,6&start=' + formattedStart + '&end=' + formattedEnd + '&max_points=' + tripChartMaxPoints;
                const batchResponse = await fetch(batchQuery);

                let pressureData = null;
                let absoluteWindData = null;
                let windSpeedData = null;
                let cabinTempData = null;
                let humidityData = null;

                if (batchResponse.ok) {
                    const result = await batchResponse.json();
                    if (result.status === 'ok' && result.data && result.data.metrics) {
                        pressureData = result.data.metrics['1'] || null;
                        cabinTempData = result.data.metrics['2'] || null;
                        humidityData = result.data.metrics['4'] || null;
                        windSpeedData = result.data.metrics['5'] || null;
                        absoluteWindData = result.data.metrics['6'] || null;
                    }
                }
                markTime('trip_charts_fetch_resolved', {
                    pressure_points: pressureData ? pressureData.length : 0,
                    wind_speed_points: windSpeedData ? windSpeedData.length : 0,
                    abs_wind_points: absoluteWindData ? absoluteWindData.length : 0,
                    cabin_temp_points: cabinTempData ? cabinTempData.length : 0,
                    humidity_points: humidityData ? humidityData.length : 0
                });

                // Compute leg bands for full-trip view
                const legBands = isFullTrip ? build_leg_bands(startTime, endTime) : [];

                // Create secondary charts
                allCharts.atmosphericPressure = createAtmosphericPressureChart(pressureData, legBands);
                allCharts.absoluteWindDirection = createAbsoluteWindDirectionChartFromMetric(absoluteWindData, windSpeedData, absoluteWindDirectionNormalized, legBands);
                allCharts.cabinTemperature = createCabinTemperatureChart(cabinTempData, legBands);
                allCharts.humidity = createHumidityChart(humidityData, legBands);
                markTime('trip_charts_rendered');

                // Save absolute wind data globally for scale toggling
                currentAbsoluteWindData = absoluteWindData;
                // Save wind speed data globally for chart toggling
                currentWindSpeedData = windSpeedData;

            } catch (error) {
                console.error('Failed to fetch secondary charts:', error);
            }
        }

        function handleSegmentClick(event, segmentType) {
            event.stopPropagation();

            if (!currentMap || !currentAnalyticsData || !currentTrackData) {
                console.error('Map, analytics data, or track data not initialized');
                return;
            }

            // Get the segment data based on type
            let segment = null;
            if (segmentType === '1nm') {
                segment = currentAnalyticsData.fastest_1nm;
            } else if (segmentType === '5nm') {
                segment = currentAnalyticsData.fastest_5nm;
            } else if (segmentType === '10nm') {
                segment = currentAnalyticsData.fastest_10nm;
            } else if (segmentType === '25nm') {
                segment = currentAnalyticsData.fastest_25nm;
            }

            if (!segment) {
                console.error('Segment data not found');
                return;
            }

            // Find start and end points in currentTrackData based on timestamps
            const startTime = new Date(segment.start_timestamp).getTime();
            const endTime = new Date(segment.end_timestamp).getTime();

            let startPoint = null;
            let endPoint = null;
            let startDelta = Infinity;
            let endDelta = Infinity;

            for (let point of currentTrackData) {
                const pointTime = new Date(point.timestamp).getTime();
                const dStart = Math.abs(pointTime - startTime);
                const dEnd = Math.abs(pointTime - endTime);
                if (dStart < startDelta) {
                    startDelta = dStart;
                    startPoint = point;
                }
                if (dEnd < endDelta) {
                    endDelta = dEnd;
                    endPoint = point;
                }
            }

            if (startPoint && endPoint) {
                displaySegmentMarkers(startPoint, endPoint, segmentType);
            }
        }

        function displaySegmentMarkers(startPoint, endPoint, segmentType) {
            // Reset previous markers
            resetSegmentMarkers();

            if (!currentMap || !currentTrackData) {
                return;
            }

            // Find all points between startPoint and endPoint timestamps
            const startTime = new Date(startPoint.timestamp).getTime();
            const endTime = new Date(endPoint.timestamp).getTime();

            const segmentPoints = currentTrackData.filter(point => {
                const pointTime = new Date(point.timestamp).getTime();
                return pointTime >= startTime && pointTime <= endTime;
            });

            if (segmentPoints.length > 0) {
                const latlngs = segmentPoints
                    .filter(point => point.latitude !== null && point.longitude !== null)
                    .map(point => [point.latitude, point.longitude]);

                const segmentLine = L.polyline(latlngs, {
                    color: '#FF8800',
                    weight: 6,
                    opacity: 1.0
                }).addTo(currentMap);

                segmentMarkers.push(segmentLine);

                let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
                latlngs.forEach(([lat, lng]) => {
                    minLat = Math.min(minLat, lat);
                    maxLat = Math.max(maxLat, lat);
                    minLng = Math.min(minLng, lng);
                    maxLng = Math.max(maxLng, lng);
                });

                const latPadding = (maxLat - minLat) * 0.3 || 0.01;
                const lngPadding = (maxLng - minLng) * 0.3 || 0.01;

                currentMap.fitBounds([
                    [minLat - latPadding, minLng - lngPadding],
                    [maxLat + latPadding, maxLng + lngPadding]
                ]);
            }
        }

        function resetSegmentMarkers() {
            // Remove all segment markers/polylines from map
            for (let marker of segmentMarkers) {
                marker.remove();
            }
            segmentMarkers = [];

            // Remove highlight from segment cards
            const cards = document.querySelectorAll('.fastestSegmentCard');
            cards.forEach(card => {
                card.style.backgroundColor = '';
                card.style.borderColor = '';
            });
        }

        function smoothSeries(values, windowSize) {
            const half = Math.floor(windowSize / 2);
            return values.map((_, i) => {
                let sum = 0, count = 0;
                for (let j = Math.max(0, i - half); j <= Math.min(values.length - 1, i + half); j++) {
                    if (values[j] != null) {
                        sum += values[j];
                        count++;
                    }
                }
                return count > 0 ? sum / count : null;
            });
        }

            const ctx = document.getElementById('windStatisticsChart').getContext('2d');

            const data = windStatsData.wind_distances;
            const maxSpeeds = windStatsData.max_wind_speeds;

            // Create color scale based on max wind speeds - shades of green
            const maxMaxSpeed = Math.max(...maxSpeeds);
            const chartColors = maxSpeeds.map(speed => {
                if (maxMaxSpeed === 0) return '#e0e0e0';
                // Create a color gradient from light green (low wind) to dark green (high wind)
                const intensity = speed / maxMaxSpeed;
                const green = Math.round(255 * intensity);
                const red = Math.round(100 * (1 - intensity));
                const blue = Math.round(100 * (1 - intensity));
                return `rgb(${red}, ${green}, ${blue})`;
            });

            return new Chart(ctx, {
                type: 'polarArea',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Wind Distance (NM)',
                        data: data,
                        backgroundColor: chartColors,

        function createHeelDistributionChart(rollData) {
            const ctx = document.getElementById('heelDistributionChart').getContext('2d');
            const colors = getChartColors();

            if (!rollData || rollData.length === 0) {
                return new Chart(ctx, {
                    type: 'bar',
                    data: { datasets: [] },
                    options: {
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: 'Heel Distribution (No Data Available)', color: colors.text }
                        }
                    }
                });
            }

            // Bucket time by signed roll angle in centered 5° ranges (..., -7.5…-2.5, -2.5…2.5, 2.5…7.5, ...)
            const BUCKET_DEG = 5;
            const MAX_ANGLE = 60;
            const HALF_BUCKET = BUCKET_DEG / 2;
            const bucketRanges = [];
            for (let center = -MAX_ANGLE; center <= MAX_ANGLE; center += BUCKET_DEG) {
                bucketRanges.push({
                    center,
                    lo: center - HALF_BUCKET,
                    hi: center + HALF_BUCKET
                });
            }
            const format_angle = value => Number.isInteger(value) ? value.toString() : value.toFixed(1);
            const labels = bucketRanges.map(range => format_angle(range.center) + '\u00b0');
            const timeHours = new Array(bucketRanges.length).fill(0);

            for (let i = 0; i < rollData.length; i++) {
                const val = rollData[i].avg_value;
                if (val === null || val === undefined) continue;
                const clampedVal = Math.max(-MAX_ANGLE, Math.min(MAX_ANGLE, val));
                let bucketIdx = 0;
                let minDistance = Number.POSITIVE_INFINITY;
                let minCenterAbs = Number.POSITIVE_INFINITY;
                for (let b = 0; b < bucketRanges.length; b++) {
                    const center = bucketRanges[b].center;
                    const distance = Math.abs(clampedVal - center);
                    const centerAbs = Math.abs(center);
                    if (distance < minDistance || (Math.abs(distance - minDistance) < 1e-9 && centerAbs < minCenterAbs)) {
                        minDistance = distance;
                        minCenterAbs = centerAbs;
                        bucketIdx = b;
                    }
                }
                // Estimate duration from timestamp gap to next point; fall back to 30 s
                let durationSec = 30;
                if (i + 1 < rollData.length) {
                    const t1 = new Date(rollData[i].timestamp).getTime();
                    const t2 = new Date(rollData[i + 1].timestamp).getTime();
                    durationSec = Math.max(1, (t2 - t1) / 1000);
                }
                timeHours[bucketIdx] += durationSec / 3600;
            }

            const barColors = bucketRanges.map(range => {
                if (range.center < 0) return 'rgba(52, 152, 219, 0.7)';
                if (range.center > 0) return 'rgba(231, 76, 60, 0.7)';
                return 'rgba(149, 165, 166, 0.7)';
            });

            const borderColors = bucketRanges.map(range => {
                if (range.center < 0) return '#3498db';
                if (range.center > 0) return '#e74c3c';
                return '#95a5a6';
            });

            return new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Time (hours)',
                        data: timeHours,
                        backgroundColor: barColors,
                        borderColor: borderColors,
                        borderWidth: 1
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            ticks: { color: colors.text },
                            grid: { color: colors.grid }
                        },
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: 'Time (hours)', color: colors.text },
                            ticks: { color: colors.text },
                            grid: { color: colors.grid }
                        }
                    },
                    plugins: {
                        legend: { display: false, labels: { color: colors.text } },
                        title: { display: true, text: 'Heel Distribution (Port / Starboard)', color: colors.text },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const range = bucketRanges[context.dataIndex];
                                    const side = range.center < 0 ? 'Port' : (range.center > 0 ? 'Starboard' : 'Upright');
                                    return side + ' (' + format_angle(range.center) + '° bucket): ' + context.parsed.y.toFixed(2) + ' hours';
                                }
                            }
                        }
                    }
                }
            });
        }

        function addHourlyMarkers(map, trackPoints) {
            if (trackPoints.length === 0) return;

            const firstTime = new Date(trackPoints[0].timestamp).getTime();
            const lastTime = new Date(trackPoints[trackPoints.length - 1].timestamp).getTime();

            // Find the first full-hour boundary after the start
            const firstHour = Math.ceil(firstTime / 3600000) * 3600000;

            for (let hourMs = firstHour; hourMs < lastTime; hourMs += 3600000) {
                // Find the track point closest in time to this hour boundary
                let closest = null;
                let closestDelta = Infinity;
                for (const point of trackPoints) {
                    const delta = Math.abs(new Date(point.timestamp).getTime() - hourMs);
                    if (delta < closestDelta) {
                        closestDelta = delta;
                        closest = point;
                    }
                }
                if (!closest) continue;

                // "Z" (Zulu time) is the compact maritime notation for UTC — used here
                // instead of " UTC" because the badge is only 48px wide.
                const hourLabel = new Date(hourMs).toISOString().slice(11, 16) + 'Z';

                const svg = [
                    '<svg xmlns="http://www.w3.org/2000/svg" width="50" height="32">',
                    '<rect x="1" y="1" width="48" height="16" rx="3" fill="white" fill-opacity="0.9" stroke="#555" stroke-width="1"/>',
                    '<text x="25" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#222">' + hourLabel + '</text>',
                    '<line x1="25" y1="17" x2="25" y2="26" stroke="#555" stroke-width="1.5"/>',
                    '<circle cx="25" cy="28" r="4" fill="white" fill-opacity="0.9" stroke="#555" stroke-width="1.5"/>',
                    '</svg>'
                ].join('');

                L.marker([closest.latitude, closest.longitude], {
                    icon: L.icon({
                        iconUrl: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
                        iconSize: [50, 32],
                        iconAnchor: [25, 28]
                    }),
                    title: hourLabel,
                    zIndexOffset: 500
                }).addTo(map);
            }
        }

        // Wind arrows: originate at track points, pointing toward the direction
        // the wind is blowing. Length scales with wind speed; color follows the
        // same blue-green-yellow-red wind intensity scale used in plan.html.
        // Density (spacing between arrows) is fixed in screen pixels, so it is
        // re-sampled on zoom to keep ~20-30px between arrows at any zoom level.
        const WIND_ARROW_MIN_SPACING_PX = 25;
        const WIND_ARROW_MIN_LEN_PX = 14;
        const WIND_ARROW_MAX_LEN_PX = 46;
        const WIND_ARROW_SPEED_SCALE_PX_PER_KN = 2.5;
        const WIND_ARROW_HEAD_PX = 8;

        function interpolateColorStops(speed, stops) {
            const kn = Math.max(speed || 0, 0);
            if (kn <= stops[0][0]) return `rgb(${stops[0][1].join(',')})`;
            if (kn >= stops[stops.length - 1][0]) return `rgb(${stops[stops.length - 1][1].join(',')})`;
            for (let i = 1; i < stops.length; i++) {
                if (kn <= stops[i][0]) {
                    const t = (kn - stops[i-1][0]) / (stops[i][0] - stops[i-1][0]);
                    const c = stops[i-1][1].map((a, j) => Math.round(a + t * (stops[i][1][j] - a)));
                    return `rgb(${c.join(',')})`;
                }
            }
        }

        function windColor(speed) {
            return interpolateColorStops(speed, [
                [0,  [170, 170, 170]],
                [4,  [30,  160, 255]],
                [7,  [0,   210, 180]],
                [10, [0,   190,  60]],
                [16, [220, 210,   0]],
                [22, [255, 140,   0]],
                [28, [220,  30,   0]],
            ]);
        }

        function windArrowIcon(bearingDeg, lenPx, color) {
            const R = WIND_ARROW_MAX_LEN_PX + WIND_ARROW_HEAD_PX + 2;
            const headW = WIND_ARROW_HEAD_PX * 0.7;
            const svg = [
                '<svg xmlns="http://www.w3.org/2000/svg" width="' + (2 * R) + '" height="' + (2 * R) +
                    '" viewBox="' + (-R) + ' ' + (-R) + ' ' + (2 * R) + ' ' + (2 * R) + '">',
                '<g transform="rotate(' + bearingDeg.toFixed(1) + ')">',
                '<line x1="0" y1="0" x2="0" y2="' + (-lenPx) + '" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round"/>',
                '<path d="M 0,' + (-lenPx - WIND_ARROW_HEAD_PX) + ' L ' + (-headW) + ',' + (-lenPx + 2) +
                    ' L ' + headW + ',' + (-lenPx + 2) + ' Z" fill="' + color + '"/>',
                '</g>',
                '</svg>'
            ].join('');

            return L.icon({
                iconUrl: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
                iconSize: [2 * R, 2 * R],
                iconAnchor: [R, R]
            });
        }

        function initWindArrows(map, trackPoints) {
            const validPoints = trackPoints.filter(p =>
                p.average_wind_speed_kn != null &&
                p.average_wind_angle_deg != null &&
                p.average_heading_deg != null
            );
            if (validPoints.length === 0) return;

            const layer = L.layerGroup().addTo(map);

            function redraw() {
                layer.clearLayers();
                let lastPixel = null;
                for (const pt of validPoints) {
                    const pixel = map.latLngToLayerPoint([pt.latitude, pt.longitude]);
                    if (lastPixel && pixel.distanceTo(lastPixel) < WIND_ARROW_MIN_SPACING_PX) continue;
                    lastPixel = pixel;

                    let bearing = (pt.average_heading_deg + pt.average_wind_angle_deg + 180) % 360;
                    if (bearing < 0) bearing += 360;

                    const len = Math.min(
                        WIND_ARROW_MAX_LEN_PX,
                        WIND_ARROW_MIN_LEN_PX + pt.average_wind_speed_kn * WIND_ARROW_SPEED_SCALE_PX_PER_KN
                    );

                    L.marker([pt.latitude, pt.longitude], {
                        icon: windArrowIcon(bearing, len, windColor(pt.average_wind_speed_kn)),
                        interactive: false,
                        zIndexOffset: -100
                    }).addTo(layer);
                }
            }

            redraw();
            map.on('zoomend', redraw);
        }

        function initializeMap(trackData, isFullTrip, navStartTs, navEndTs) {
            const navStartEl = document.getElementById('navStartLegendItem');
            const navEndEl   = document.getElementById('navEndLegendItem');
            if (navStartEl) navStartEl.style.display = 'none';
            if (navEndEl)   navEndEl.style.display   = 'none';

            // Destroy existing map before re-initialising (Leaflet throws on double-init)
            if (currentMap) {
                currentMap.remove();
                currentMap = null;
            }

            const validTrackPoints = trackData.filter(point =>
                point.latitude !== null && point.latitude !== undefined &&
                point.longitude !== null && point.longitude !== undefined
            );

            if (validTrackPoints.length === 0) {
                showMapFallback('No GPS track data available for this trip');
                return;
            }

            let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
            validTrackPoints.forEach(point => {
                minLat = Math.min(minLat, point.latitude);
                maxLat = Math.max(maxLat, point.latitude);
                minLng = Math.min(minLng, point.longitude);
                maxLng = Math.max(maxLng, point.longitude);
            });

            const latPadding = (maxLat - minLat) * 0.1 || 0.01;
            const lngPadding = (maxLng - minLng) * 0.1 || 0.01;

            const map = L.map(document.getElementById('map'), {
                renderer: L.svg({ padding: 0.5 })
            }).setView(
                [(minLat + maxLat) / 2, (minLng + maxLng) / 2], 12
            );
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            currentMap = map;

            L.control.fullscreen({ position: 'topleft' }).addTo(map);
            map.on('click', () => resetSegmentMarkers());

            addLatLonPanel(map, 'bottomleft');

            map.fitBounds([
                [minLat - latPadding, minLng - lngPadding],
                [maxLat + latPadding, maxLng + lngPadding]
            ]);

            const hoverPopup = L.popup({ closeButton: false, autoPan: false });
            markTime('map_before_colored_track', { points: validTrackPoints.length });
            createColoredTrack(map, validTrackPoints, hoverPopup, isFullTrip ? 4.0 : 1.0);
            markTime('map_after_colored_track', { points: validTrackPoints.length });

            if (!isFullTrip) {
                addHourlyMarkers(map, validTrackPoints);
                initWindArrows(map, validTrackPoints);
            }

            if (validTrackPoints.length > 0) {
                const flagIcon = (color) => L.divIcon({
                    html: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -50 20 50" width="14" height="35">' +
                          '<path d="M 0,0 C -2,-20 -10,-22 -10,-30 L -10,-50 L 10,-50 L 10,-30 C 10,-22 2,-20 0,0 z" ' +
                          'fill="' + color + '" stroke="#FFFFFF" stroke-width="2"/></svg>',
                    iconSize: [14, 35],
                    iconAnchor: [7, 35],
                    className: ''
                });

                const startPt = validTrackPoints[0];
                const endPt   = validTrackPoints[validTrackPoints.length - 1];

                L.marker([startPt.latitude, startPt.longitude], { icon: flagIcon('#00FF00'), title: 'Trip Start', zIndexOffset: 1000 })
                    .addTo(map)
                    .bindPopup('<div style="font-family: Arial, sans-serif;"><strong>Trip Start</strong><br>' + formatDate(startPt.timestamp) + '</div>');

                L.marker([endPt.latitude, endPt.longitude], { icon: flagIcon('#FF0000'), title: 'Trip End', zIndexOffset: 1000 })
                    .addTo(map)
                    .bindPopup('<div style="font-family: Arial, sans-serif;"><strong>Trip End</strong><br>' + formatDate(endPt.timestamp) + '</div>');
            }

            if (!isFullTrip && (navStartTs || navEndTs)) {
                addNavWindowMarkers(map, validTrackPoints, navStartTs, navEndTs);
            }
        }

        function addNavWindowMarkers(map, trackPoints, navStartTs, navEndTs) {
            function findClosestPoint(ts) {
                const targetMs = new Date(ts).getTime();
                let best = null, bestDiff = Infinity;
                for (const pt of trackPoints) {
                    const diff = Math.abs(new Date(pt.timestamp).getTime() - targetMs);
                    if (diff < bestDiff) { bestDiff = diff; best = pt; }
                }
                return best;
            }

            if (navStartTs) {
                const pt = findClosestPoint(navStartTs);
                if (pt) {
                    L.circleMarker([pt.latitude, pt.longitude], {
                        radius: 8,
                        fillColor: '#0099FF',
                        fillOpacity: 1,
                        color: '#FFFFFF',
                        weight: 2
                    })
                    .addTo(map)
                    .bindPopup(
                        '<div style="font-family: Arial, sans-serif;">' +
                        '<strong>Navigation Start</strong><br>' +
                        formatTime(navStartTs) +
                        '</div>'
                    );
                    const el = document.getElementById('navStartLegendItem');
                    if (el) el.style.display = '';
                }
            }

            if (navEndTs) {
                const pt = findClosestPoint(navEndTs);
                if (pt) {
                    L.circleMarker([pt.latitude, pt.longitude], {
                        radius: 8,
                        fillColor: '#FF6600',
                        fillOpacity: 1,
                        color: '#FFFFFF',
                        weight: 2
                    })
                    .addTo(map)
                    .bindPopup(
                        '<div style="font-family: Arial, sans-serif;">' +
                        '<strong>Navigation End</strong><br>' +
                        formatTime(navEndTs) +
                        '</div>'
                    );
                    const el = document.getElementById('navEndLegendItem');
                    if (el) el.style.display = '';
                }
            }
        }

        function createColoredTrack(map, trackPoints, hoverPopup, smoothFactor = 1.0) {
            if (trackPoints.length < 2) return;

            function segmentColor(p1, p2) {
                if (p2.engine_on === 1) return '#888888';
                if (p2.engine_on === 2) return '#FFD700';
                const speed = p2.avg_speed_kn || p1.avg_speed_kn || 0;
                return getSpeedColor(Math.round(speed * 2) / 2);
            }

            function showTooltip(e, pts) {
                const ll = e.latlng;
                let nearest = pts[0], minD = Infinity;
                for (const pt of pts) {
                    const d = (pt.latitude - ll.lat) ** 2 + (pt.longitude - ll.lng) ** 2;
                    if (d < minD) { minD = d; nearest = pt; }
                }
                const time    = nearest.timestamp ? formatTime(nearest.timestamp) : 'N/A';
                const speed   = nearest.avg_speed_kn != null ? nearest.avg_speed_kn.toFixed(1) + ' kn' : 'N/A';
                const heading = nearest.average_heading_deg != null ? nearest.average_heading_deg.toFixed(0) + '°' : 'N/A';
                const wind    = nearest.average_wind_speed_kn != null ? nearest.average_wind_speed_kn.toFixed(1) + ' kn' : 'N/A';
                let absWindDir = 'N/A';
                if (nearest.average_wind_angle_deg != null && nearest.average_heading_deg != null) {
                    let d = (nearest.average_wind_angle_deg + nearest.average_heading_deg) % 360;
                    if (d < 0) d += 360;
                    absWindDir = d.toFixed(0) + '°';
                }
                hoverPopup
                    .setLatLng(ll)
                    .setContent(
                        '<div class="map-track-tooltip">' +
                        '<div class="tooltip-time">' + time + '</div>' +
                        '<div><span class="tooltip-label">Speed </span><span class="tooltip-value">' + speed + ' ' + heading + '</span></div>' +
                        '<div><span class="tooltip-label">Wind </span><span class="tooltip-value">' + wind + ' ' + absWindDir + '</span></div>' +
                        '</div>'
                    )
                    .openOn(map);
            }

            function flushGroup(color, latlngs, pts) {
                if (latlngs.length < 2) return;
                const line = L.polyline(latlngs, { color, weight: 4, opacity: 1.0, smoothFactor }).addTo(map);
                if (hoverPopup) {
                    line.on('mousemove', (e) => showTooltip(e, pts));
                    line.on('mouseout',  () => map.closePopup(hoverPopup));
                }
            }

            // Group consecutive segments of the same quantized color into single polylines.
            // Speed is quantized to 0.5 kn to allow adjacent same-speed points to group.
            let groupColor  = segmentColor(trackPoints[0], trackPoints[1]);
            let groupLatLngs = [[trackPoints[0].latitude, trackPoints[0].longitude],
                                [trackPoints[1].latitude, trackPoints[1].longitude]];
            let groupPts    = [trackPoints[0], trackPoints[1]];

            for (let i = 1; i < trackPoints.length - 1; i++) {
                const c = segmentColor(trackPoints[i], trackPoints[i + 1]);
                if (c !== groupColor) {
                    flushGroup(groupColor, groupLatLngs, groupPts);
                    groupColor   = c;
                    groupLatLngs = [[trackPoints[i].latitude, trackPoints[i].longitude]];
                    groupPts     = [trackPoints[i]];
                }
                groupLatLngs.push([trackPoints[i + 1].latitude, trackPoints[i + 1].longitude]);
                groupPts.push(trackPoints[i + 1]);
            }
            flushGroup(groupColor, groupLatLngs, groupPts);
        }

        function getSpeedColor(speed) {
            const MAX_SPEED = 10;
            const MIN_SPEED = 2;

            // Hue calculation function as provided
            const d = 1;
            const hM = 360;
            const hm = 180;
            const sM = MAX_SPEED;
            const sm = MIN_SPEED;
            const s = Math.max(sm, Math.min(speed, sM));
            const hue = d * (s - sm) / (sM - sm) * (hM - hm) + hm;

            // Convert HSL to RGB (with full saturation and lightness)
            return hslToRgb(hue, 100, 50);
        }

    </script>
    <script src="/components/voyage-bar-component.js" defer></script>
</body>
