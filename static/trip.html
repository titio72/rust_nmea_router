        function createHeelDistributionChart(rollData) {
            const ctx = document.getElementById('heelDistributionChart').getContext('2d');
            const colors = getChartColors();

            if (!rollData || rollData.length === 0) {
                return new Chart(ctx, {
                    type: 'bar',
                    data: { datasets: [] },
                    options: {
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: 'Heel Distribution (No Data Available)', color: colors.text }
                        }
                    }
                });
            }

            // Bucket time by signed roll angle in centered 5° ranges (..., -7.5…-2.5, -2.5…2.5, 2.5…7.5, ...)
            const BUCKET_DEG = 5;
            const MAX_ANGLE = 60;
            const HALF_BUCKET = BUCKET_DEG / 2;
            const bucketRanges = [];
            for (let center = -MAX_ANGLE; center <= MAX_ANGLE; center += BUCKET_DEG) {
                bucketRanges.push({
                    center,
                    lo: center - HALF_BUCKET,
                    hi: center + HALF_BUCKET
                });
            }
            const format_angle = value => Number.isInteger(value) ? value.toString() : value.toFixed(1);
            const labels = bucketRanges.map(range => format_angle(range.center) + '\u00b0');
            const timeHours = new Array(bucketRanges.length).fill(0);

            for (let i = 0; i < rollData.length; i++) {
                const val = rollData[i].avg_value;
                if (val === null || val === undefined) continue;
                const clampedVal = Math.max(-MAX_ANGLE, Math.min(MAX_ANGLE, val));
                let bucketIdx = 0;
                let minDistance = Number.POSITIVE_INFINITY;
                let minCenterAbs = Number.POSITIVE_INFINITY;
                for (let b = 0; b < bucketRanges.length; b++) {
                    const center = bucketRanges[b].center;
                    const distance = Math.abs(clampedVal - center);
                    const centerAbs = Math.abs(center);
                    if (distance < minDistance || (Math.abs(distance - minDistance) < 1e-9 && centerAbs < minCenterAbs)) {
                        minDistance = distance;
                        minCenterAbs = centerAbs;
                        bucketIdx = b;
                    }
                }
                // Estimate duration from timestamp gap to next point; fall back to 30 s
                let durationSec = 30;
                if (i + 1 < rollData.length) {
                    const t1 = new Date(rollData[i].timestamp).getTime();
                    const t2 = new Date(rollData[i + 1].timestamp).getTime();
                    durationSec = Math.max(1, (t2 - t1) / 1000);
                }
                timeHours[bucketIdx] += durationSec / 3600;
            }

            const barColors = bucketRanges.map(range => {
                if (range.center < 0) return 'rgba(52, 152, 219, 0.7)';
                if (range.center > 0) return 'rgba(231, 76, 60, 0.7)';
                return 'rgba(149, 165, 166, 0.7)';
            });

            const borderColors = bucketRanges.map(range => {
                if (range.center < 0) return '#3498db';
                if (range.center > 0) return '#e74c3c';
                return '#95a5a6';
            });

            return new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Time (hours)',
                        data: timeHours,
                        backgroundColor: barColors,
                        borderColor: borderColors,
                        borderWidth: 1
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            ticks: { color: colors.text },
                            grid: { color: colors.grid }
                        },
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: 'Time (hours)', color: colors.text },
                            ticks: { color: colors.text },
                            grid: { color: colors.grid }
                        }
                    },
                    plugins: {
                        legend: { display: false, labels: { color: colors.text } },
                        title: { display: true, text: 'Heel Distribution (Port / Starboard)', color: colors.text },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const range = bucketRanges[context.dataIndex];
                                    const side = range.center < 0 ? 'Port' : (range.center > 0 ? 'Starboard' : 'Upright');
                                    return side + ' (' + format_angle(range.center) + '° bucket): ' + context.parsed.y.toFixed(2) + ' hours';
                                }
                            }
                        }
                    }
                }
            });
        }

        function addHourlyMarkers(map, trackPoints) {
            if (trackPoints.length === 0) return;

            const firstTime = new Date(trackPoints[0].timestamp).getTime();
            const lastTime = new Date(trackPoints[trackPoints.length - 1].timestamp).getTime();

            // Find the first full-hour boundary after the start
            const firstHour = Math.ceil(firstTime / 3600000) * 3600000;

            for (let hourMs = firstHour; hourMs < lastTime; hourMs += 3600000) {
                // Find the track point closest in time to this hour boundary
                let closest = null;
                let closestDelta = Infinity;
                for (const point of trackPoints) {
                    const delta = Math.abs(new Date(point.timestamp).getTime() - hourMs);
                    if (delta < closestDelta) {
                        closestDelta = delta;
                        closest = point;
                    }
                }
                if (!closest) continue;

                const hourLabel = new Date(hourMs).toISOString().slice(11, 16); // HH:MM UTC

                const svg = [
                    '<svg xmlns="http://www.w3.org/2000/svg" width="50" height="32">',
                    '<rect x="1" y="1" width="48" height="16" rx="3" fill="white" fill-opacity="0.9" stroke="#555" stroke-width="1"/>',
                    '<text x="25" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#222">' + hourLabel + '</text>',
                    '<line x1="25" y1="17" x2="25" y2="26" stroke="#555" stroke-width="1.5"/>',
                    '<circle cx="25" cy="28" r="4" fill="white" fill-opacity="0.9" stroke="#555" stroke-width="1.5"/>',
                    '</svg>'
                ].join('');

                const marker = new google.maps.Marker({
                    position: { lat: closest.latitude, lng: closest.longitude },
                    map: map,
                    title: hourLabel + ' UTC',
                    icon: {
                        url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
                        size: new google.maps.Size(50, 32),
                        origin: new google.maps.Point(0, 0),
                        anchor: new google.maps.Point(25, 28),
                        scaledSize: new google.maps.Size(50, 32)
                    },
                    zIndex: 500
                });
            }
        }

        function drawCanvasTrack(trackData, isFullTrip) {
            const container = document.getElementById('map');
            if (!container) return;

            const validPoints = trackData.filter(p =>
                p.latitude != null && p.longitude != null
            );
            if (validPoints.length === 0) {
                showMapFallback('No GPS track data available for this trip');
                return;
            }

            const isDark = document.body.classList.contains('dark-theme');

            const canvas = document.createElement('canvas');
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.display = 'block';
            container.innerHTML = '';
            container.appendChild(canvas);

            const W = container.clientWidth  || 600;
            const H = container.clientHeight || 400;
            canvas.width  = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = isDark ? '#1a1a2e' : '#d0e8f5';
            ctx.fillRect(0, 0, W, H);

            const PAD = 24;
            let minLat = Infinity, maxLat = -Infinity;
            let minLng = Infinity, maxLng = -Infinity;
            validPoints.forEach(p => {
                minLat = Math.min(minLat, p.latitude);
                maxLat = Math.max(maxLat, p.latitude);
                minLng = Math.min(minLng, p.longitude);
                maxLng = Math.max(maxLng, p.longitude);
            });

            const latSpan = maxLat - minLat || 0.01;
            const lngSpan = maxLng - minLng || 0.01;

            // Preserve aspect ratio using the cosine correction for longitude
            const midLat   = (minLat + maxLat) / 2;
            const cosLat   = Math.cos(midLat * Math.PI / 180);
            const drawW    = W - PAD * 2;
            const drawH    = H - PAD * 2;
            const scaleX   = drawW / lngSpan;
            const scaleY   = drawH / latSpan;
            const scale    = Math.min(scaleX, scaleY * cosLat);

            const toX = lng => PAD + (lng - minLng) * scale + (drawW - lngSpan * scale) / 2;
            const toY = lat => H - PAD - (lat - minLat) * (scale / cosLat) - (drawH - latSpan * (scale / cosLat)) / 2;

            // Track segments coloured by speed/engine (same logic as createColoredTrack)
            ctx.lineWidth = 2.5;
            ctx.lineJoin  = 'round';
            for (let i = 1; i < validPoints.length; i++) {
                const p  = validPoints[i];
                const p0 = validPoints[i - 1];
                let color;
                if (p.engine_on === 1) {
                    color = '#888888';
                } else if (p.engine_on === 2) {
                    color = '#FFD700';
                } else {
                    color = getSpeedColor(p.avg_speed_kn || p0.avg_speed_kn || 0);
                }
                ctx.strokeStyle = color;
                ctx.beginPath();
                ctx.moveTo(toX(p0.longitude), toY(p0.latitude));
                ctx.lineTo(toX(p.longitude),  toY(p.latitude));
                ctx.stroke();
            }

            // Hourly time labels (single-leg view only)
            if (!isFullTrip && validPoints[0].timestamp) {
                const firstMs  = new Date(validPoints[0].timestamp).getTime();
                const lastMs   = new Date(validPoints[validPoints.length - 1].timestamp).getTime();
                const firstHour = Math.ceil(firstMs / 3600000) * 3600000;
                ctx.font      = 'bold 10px Arial,sans-serif';
                ctx.textAlign = 'center';
                for (let h = firstHour; h < lastMs; h += 3600000) {
                    let closest = null, bestDelta = Infinity;
                    for (const p of validPoints) {
                        const d = Math.abs(new Date(p.timestamp).getTime() - h);
                        if (d < bestDelta) { bestDelta = d; closest = p; }
                    }
                    if (!closest) continue;
                    const label = new Date(h).toISOString().slice(11, 16);
                    const x = toX(closest.longitude);
                    const y = toY(closest.latitude);
                    ctx.fillStyle = isDark ? 'rgba(0,0,0,0.65)' : 'rgba(255,255,255,0.85)';
                    ctx.fillRect(x - 16, y - 14, 32, 13);
                    ctx.fillStyle = isDark ? '#ddd' : '#222';
                    ctx.fillText(label, x, y - 3);
                }
            }

            // Start marker (green) and end marker (red)
            const first = validPoints[0];
            const last  = validPoints[validPoints.length - 1];
            [[first, '#22cc44'], [last, '#ee3333']].forEach(([p, color]) => {
                const x = toX(p.longitude), y = toY(p.latitude);
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = isDark ? '#fff' : '#000';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            // Legend
            const legendY = H - 8;
            ctx.font      = '10px Arial,sans-serif';
            ctx.textAlign = 'left';
            const items = [
                { color: getSpeedColor(2),  label: '< 2 kn' },
                { color: getSpeedColor(5),  label: '5 kn'   },
                { color: getSpeedColor(10), label: '10 kn'  },
                { color: '#888888',         label: 'Motor'  },
            ];
            let lx = PAD;
            items.forEach(({ color, label }) => {
                ctx.fillStyle = color;
                ctx.fillRect(lx, legendY - 8, 18, 8);
                ctx.fillStyle = isDark ? '#ccc' : '#333';
                ctx.fillText(label, lx + 21, legendY);
                lx += 70;
            });
        }

        function initializeMap(trackData, isFullTrip, navStartTs, navEndTs) {
            // Reset nav legend items — they are re-shown by addNavWindowMarkers if applicable
            const navStartEl = document.getElementById('navStartLegendItem');
            const navEndEl   = document.getElementById('navEndLegendItem');
            if (navStartEl) navStartEl.style.display = 'none';
            if (navEndEl)   navEndEl.style.display   = 'none';

            // Check if Google Maps API is available
            if (!googleMapsLoaded || !window.google?.maps) {
                drawCanvasTrack(trackData, isFullTrip);
                return;
            }

            // Filter out data points without valid coordinates
            const validTrackPoints = trackData.filter(point =>
                point.latitude !== null && point.latitude !== undefined &&
                point.longitude !== null && point.longitude !== undefined
            );

            if (validTrackPoints.length === 0) {
                showMapFallback('No GPS track data available for this trip');
                return;
            }

            // Calculate bounds for the map
            let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
            validTrackPoints.forEach(point => {
                minLat = Math.min(minLat, point.latitude);
                maxLat = Math.max(maxLat, point.latitude);
                minLng = Math.min(minLng, point.longitude);
                maxLng = Math.max(maxLng, point.longitude);
            });

            // Add some padding to the bounds
            const latPadding = (maxLat - minLat) * 0.1 || 0.01;
            const lngPadding = (maxLng - minLng) * 0.1 || 0.01;

            const bounds = {
                north: maxLat + latPadding,
                south: minLat - latPadding,
                east: maxLng + lngPadding,
                west: minLng - lngPadding
            };

            // Create the map centered on the track
            const map = new google.maps.Map(document.getElementById('map'), {
                zoom: 12,
                center: { lat: (minLat + maxLat) / 2, lng: (minLng + maxLng) / 2 },
                mapTypeId: google.maps.MapTypeId.ROADMAP,
                mapTypeControl: true,
                streetViewControl: false,
                fullscreenControl: true
            });

            // Save map reference globally
            currentMap = map;

            // Add click listener to reset markers when clicking on the map
            map.addListener('click', () => {
                resetSegmentMarkers();
            });            // Fit the map to show all track points
            map.fitBounds(bounds);

            // Create shared hover info window for track tooltips
            const hoverInfoWindow = new google.maps.InfoWindow();

            // Create colored track segments based on speed
            createColoredTrack(map, validTrackPoints, hoverInfoWindow);

            // Add hourly markers when viewing a single leg
            if (!isFullTrip) {
                addHourlyMarkers(map, validTrackPoints);
            }

            // Add markers for start and end points
            if (validTrackPoints.length > 0) {
                // Start marker (green with flag icon)
                const startMarker = new google.maps.Marker({
                    position: { lat: validTrackPoints[0].latitude, lng: validTrackPoints[0].longitude },
                    map: map,
                    title: 'Trip Start',
                    icon: {
                        path: 'M 0,0 C -2,-20 -10,-22 -10,-30 L -10,-50 L 10,-50 L 10,-30 C 10,-22 2,-20 0,0 z',
                        fillColor: '#00FF00',
                        fillOpacity: 1,
                        strokeColor: '#FFFFFF',
                        strokeWeight: 2,
                        scale: 0.7,
                        anchor: new google.maps.Point(0, 0)
                    },
                    zIndex: 1000
                });

                // End marker (red with flag icon)
                const endMarker = new google.maps.Marker({
                    position: { lat: validTrackPoints[validTrackPoints.length - 1].latitude, lng: validTrackPoints[validTrackPoints.length - 1].longitude },
                    map: map,
                    title: 'Trip End',
                    icon: {
                        path: 'M 0,0 C -2,-20 -10,-22 -10,-30 L -10,-50 L 10,-50 L 10,-30 C 10,-22 2,-20 0,0 z',
                        fillColor: '#FF0000',
                        fillOpacity: 1,
                        strokeColor: '#FFFFFF',
                        strokeWeight: 2,
                        scale: 0.7,
                        anchor: new google.maps.Point(0, 0)
                    },
                    zIndex: 1000
                });

                // Add info windows with timestamps
                const startInfoWindow = new google.maps.InfoWindow({
                    content: '<div style="font-family: Arial, sans-serif;">' +
                        '<strong>Trip Start</strong><br>' +
                        formatDate(validTrackPoints[0].timestamp) +
                    '</div>'
                });

                const endInfoWindow = new google.maps.InfoWindow({
                    content: '<div style="font-family: Arial, sans-serif;">' +
                        '<strong>Trip End</strong><br>' +
                        formatDate(validTrackPoints[validTrackPoints.length - 1].timestamp) +
                    '</div>'
                });

                startMarker.addListener('click', () => {
                    startInfoWindow.open(map, startMarker);
                });

                endMarker.addListener('click', () => {
                    endInfoWindow.open(map, endMarker);
                });
            }

            // Add nav window markers when viewing a single leg
            if (!isFullTrip && (navStartTs || navEndTs)) {
                addNavWindowMarkers(map, validTrackPoints, navStartTs, navEndTs);
            }
        }

        function addNavWindowMarkers(map, trackPoints, navStartTs, navEndTs) {
            function findClosestPoint(ts) {
                const targetMs = new Date(ts).getTime();
                let best = null, bestDiff = Infinity;
                for (const pt of trackPoints) {
                    const diff = Math.abs(new Date(pt.timestamp).getTime() - targetMs);
                    if (diff < bestDiff) { bestDiff = diff; best = pt; }
                }
                return best;
            }

            const navStartIcon = {
                path: google.maps.SymbolPath.CIRCLE,
                fillColor: '#0099FF',
                fillOpacity: 1,
                strokeColor: '#FFFFFF',
                strokeWeight: 2,
                scale: 8
            };
            const navEndIcon = {
                path: google.maps.SymbolPath.CIRCLE,
                fillColor: '#FF6600',
                fillOpacity: 1,
                strokeColor: '#FFFFFF',
                strokeWeight: 2,
                scale: 8
            };

            if (navStartTs) {
                const pt = findClosestPoint(navStartTs);
                if (pt) {
                    const marker = new google.maps.Marker({
                        position: { lat: pt.latitude, lng: pt.longitude },
                        map: map,
                        title: 'Navigation Start',
                        icon: navStartIcon,
                        zIndex: 900
                    });
                    const iw = new google.maps.InfoWindow({
                        content: '<div style="font-family: Arial, sans-serif;">' +
                            '<strong>Navigation Start</strong><br>' +
                            formatTime(navStartTs) +
                            '</div>'
                    });
                    marker.addListener('click', () => iw.open(map, marker));
                    const el = document.getElementById('navStartLegendItem');
                    if (el) el.style.display = '';
                }
            }

            if (navEndTs) {
                const pt = findClosestPoint(navEndTs);
                if (pt) {
                    const marker = new google.maps.Marker({
                        position: { lat: pt.latitude, lng: pt.longitude },
                        map: map,
                        title: 'Navigation End',
                        icon: navEndIcon,
                        zIndex: 900
                    });
                    const iw = new google.maps.InfoWindow({
                        content: '<div style="font-family: Arial, sans-serif;">' +
                            '<strong>Navigation End</strong><br>' +
                            formatTime(navEndTs) +
                            '</div>'
                    });
                    marker.addListener('click', () => iw.open(map, marker));
                    const el = document.getElementById('navEndLegendItem');
                    if (el) el.style.display = '';
                }
            }
        }

        function createColoredTrack(map, trackPoints, hoverInfoWindow) {
            if (trackPoints.length < 2) return;

            // Create segments between consecutive points
            for (let i = 0; i < trackPoints.length - 1; i++) {
                const point1 = trackPoints[i];
                const point2 = trackPoints[i + 1];

                // Determine color based on engine status (0=off, 1=on, 2=unknown)
                let color;
                if (point2.engine_on === 1) {
                    // Use dark grey when engine is on (motoring)
                    color = '#888888';
                } else if (point2.engine_on === 2) {
                    // Use gold when engine status is unknown
                    color = '#FFD700';
                } else {
                    // Use speed-based color when sailing (engine off)
                    const speed = point2.avg_speed_kn || point1.avg_speed_kn || 0;
                    color = getSpeedColor(speed);
                }

                // Create a polyline segment
                const segmentPath = [
                    { lat: point1.latitude, lng: point1.longitude },
                    { lat: point2.latitude, lng: point2.longitude }
                ];

                const segmentLine = new google.maps.Polyline({
                    path: segmentPath,
                    geodesic: true,
                    strokeColor: color,
                    strokeOpacity: 1.0,
                    strokeWeight: 4
                });

                segmentLine.setMap(map);

                if (hoverInfoWindow) {
                    const tooltipPoint = point2;
                    segmentLine.addListener('mouseover', (event) => {
                        const time = tooltipPoint.timestamp ? formatTime(tooltipPoint.timestamp) : 'N/A';
                        const speed = tooltipPoint.avg_speed_kn != null ? tooltipPoint.avg_speed_kn.toFixed(1) + ' kn' : 'N/A';
                        const heading = tooltipPoint.average_heading_deg != null ? tooltipPoint.average_heading_deg.toFixed(0) + '°' : 'N/A';
                        const wind = tooltipPoint.average_wind_speed_kn != null ? tooltipPoint.average_wind_speed_kn.toFixed(1) + ' kn' : 'N/A';
                        const windDir = tooltipPoint.average_wind_angle_deg != null ? tooltipPoint.average_wind_angle_deg.toFixed(0) + '°' : 'N/A';
                        let absWindDir;
                        if (tooltipPoint.absolute_wind_direction_deg != null && tooltipPoint.average_heading_deg != null) {
                            let absWindDir_d = (tooltipPoint.absolute_wind_direction_deg + tooltipPoint.average_heading_deg) % 360;
                            if (absWindDir_d < 0) absWindDir_d += 360;
                            absWindDir = absWindDir_d.toFixed(0) + '°';
                        } else {
                            absWindDir = 'N/A';
                        }
                        hoverInfoWindow.setContent(
                            '<div class="map-track-tooltip">' +
                            '<div class="tooltip-time">' + time + '</div>' +
                            '<div><span class="tooltip-label">Speed </span><span class="tooltip-value">' + speed + ' ' + heading + '</span></div>' +
                            '<div><span class="tooltip-label">Wind </span><span class="tooltip-value">' + wind + ' ' + absWindDir + '</span></div>' +
                            '</div>'
                        );
                        hoverInfoWindow.setPosition(event.latLng);
                        hoverInfoWindow.open(map);
                    });
                    segmentLine.addListener('mouseout', () => {
                        hoverInfoWindow.close();
                    });
                }
            }
        }

        function getSpeedColor(speed) {
            const MAX_SPEED = 10;
            const MIN_SPEED = 2;

            // Hue calculation function as provided
            const d = 1;
            const hM = 360;
            const hm = 180;
            const sM = MAX_SPEED;
            const sm = MIN_SPEED;
            const s = Math.max(sm, Math.min(speed, sM));
            const hue = d * (s - sm) / (sM - sm) * (hM - hm) + hm;

            // Convert HSL to RGB (with full saturation and lightness)
            return hslToRgb(hue, 100, 50);
        }

        // ── Forecast Areas ────────────────────────────────────────────────────────────

        let forecastAreaMap = null;
        let forecastAreaRectangles = [];
        let drawStart = null;
        let drawRect = null;
        let isDrawing = false;
        let currentTripId = null;
        let isActiveTripForForecast = false;
        let forecastStatusInterval = null;

        function initForecastAreaMap() {
            if (forecastAreaMap) { forecastAreaMap.remove(); }
            forecastAreaMap = L.map('forecastAreaMap').setView([43.0, 9.0], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap', maxZoom: 16
            }).addTo(forecastAreaMap);

            // Use DOM events on the container — Leaflet's map.on() events can be
            // swallowed by the internal drag/pan handlers even when dragging is disabled.
            const c = forecastAreaMap.getContainer();
            c.addEventListener('mousedown', onMapMouseDown);
            c.addEventListener('mousemove', onMapMouseMove);
            c.addEventListener('mouseup',   onMapMouseUp);
        }

        function startDrawArea() {
            isDrawing = true;
            document.getElementById('cancelDrawBtn').style.display = '';
            document.getElementById('drawAreaBtn').style.display = 'none';
            document.getElementById('drawAreaHint').style.display = '';
            forecastAreaMap.dragging.disable();
            forecastAreaMap.getContainer().style.cursor = 'crosshair';
        }

        function cancelDrawArea() {
            isDrawing = false;
            drawStart = null;
            if (drawRect) { forecastAreaMap.removeLayer(drawRect); drawRect = null; }
            document.getElementById('cancelDrawBtn').style.display = 'none';
            document.getElementById('drawAreaBtn').style.display = '';
            document.getElementById('drawAreaHint').style.display = 'none';
            forecastAreaMap.dragging.enable();
            forecastAreaMap.getContainer().style.cursor = '';
        }

        function onMapMouseDown(e) {
            if (!isDrawing) return;
            e.preventDefault();
            drawStart = forecastAreaMap.mouseEventToLatLng(e);
            if (drawRect) { forecastAreaMap.removeLayer(drawRect); }
            drawRect = L.rectangle([drawStart, drawStart], {
                color: '#3b82f6', weight: 2, fillOpacity: 0.15, interactive: false
            }).addTo(forecastAreaMap);
        }

        function onMapMouseMove(e) {
            if (!isDrawing || !drawStart || !drawRect) return;
            drawRect.setBounds(L.latLngBounds(drawStart, forecastAreaMap.mouseEventToLatLng(e)));
        }

        async function onMapMouseUp(e) {
            if (!isDrawing || !drawStart) return;
            const end = forecastAreaMap.mouseEventToLatLng(e);
            const start = drawStart;  // save before cancel nulls it
            cancelDrawArea();

            const lat_min = Math.min(start.lat, end.lat);
            const lat_max = Math.max(start.lat, end.lat);
            const lon_min = Math.min(start.lng, end.lng);
            const lon_max = Math.max(start.lng, end.lng);

            if (Math.abs(lat_max - lat_min) < 0.05 || Math.abs(lon_max - lon_min) < 0.05) {
                return; // too small
            }

            try {
                await fetch('/api/forecast/areas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ trip_id: currentTripId, lat_min, lat_max, lon_min, lon_max }),
                });
                await loadForecastAreas(currentTripId);
            } catch (err) {
                console.error('Failed to save forecast area', err);
            }
        }

        async function deleteForecastArea(id) {
            try {
                await fetch('/api/forecast/areas?id=' + id, { method: 'DELETE' });
                await loadForecastAreas(currentTripId);
            } catch (err) {
                console.error('Failed to delete forecast area', err);
            }
        }

        function renderForecastAreaList(areas) {
            const container = document.getElementById('forecastAreaList');
            if (!areas.length) {
                container.innerHTML = '<div style="font-size:13px; color:var(--text-secondary);">No areas defined. Draw a bounding box on the map.</div>';
                return;
            }
            container.innerHTML = areas.map(a => `
                <div style="display:flex; justify-content:space-between; align-items:center;
                            background:var(--bg-secondary); padding:6px 10px; border-radius:5px;
                            margin-bottom:5px; font-size:13px;">
                    <span>
                        <strong>Area ${a.id}</strong>
                        <span style="color:var(--text-secondary); font-size:11px; margin-left:8px;">
                            ${a.lat_min.toFixed(2)}–${a.lat_max.toFixed(2)}°N &nbsp;
                            ${a.lon_min.toFixed(2)}–${a.lon_max.toFixed(2)}°E
                        </span>
                    </span>
                    ${isActiveTripForForecast
                        ? `<button onclick="deleteForecastArea(${Number(a.id)})"
                               style="background:transparent; border:1px solid #e74c3c; color:#e74c3c;
                                      border-radius:3px; padding:1px 8px; font-size:11px; cursor:pointer;">
                               Delete
                           </button>`
                        : ''}
                </div>`).join('');
        }

        function renderForecastAreasOnMap(areas) {
            forecastAreaRectangles.forEach(r => forecastAreaMap.removeLayer(r));
            forecastAreaRectangles = [];
            areas.forEach(a => {
                const r = L.rectangle(
                    [[a.lat_min, a.lon_min], [a.lat_max, a.lon_max]],
                    { color: '#3b82f6', weight: 2, fillOpacity: 0.1 }
                ).addTo(forecastAreaMap);
                forecastAreaRectangles.push(r);
            });
            if (areas.length) {
                const bounds = L.latLngBounds(areas.map(a => [
                    [a.lat_min, a.lon_min], [a.lat_max, a.lon_max]
                ]).flat());
                forecastAreaMap.fitBounds(bounds, { padding: [20, 20] });
            }
        }

        async function loadForecastAreas(tripId) {
            try {
                const resp = await fetch('/api/forecast/areas?trip_id=' + tripId);
                const json = await resp.json();
                const areas = json.data || [];
                renderForecastAreaList(areas);
                renderForecastAreasOnMap(areas);
            } catch (err) {
                console.error('Failed to load forecast areas', err);
                renderForecastAreaList([]);
                renderForecastAreasOnMap([]);
            }
        }

        async function updateForecastStatus(tripId) {
            try {
                const resp = await fetch('/api/forecast/status?trip_id=' + tripId);
                const json = await resp.json();
                const s = json.data;
                if (!s) return;
                const onlineBadge = s.online
                    ? '<span style="background:#14532d;color:#86efac;padding:2px 8px;border-radius:10px;font-size:11px;">● Fetching every 3h</span>'
                    : '<span style="background:#7c2d12;color:#fdba74;padding:2px 8px;border-radius:10px;font-size:11px;">⚠ Offline — retrying</span>';
                const lastFetch = s.last_fetch
                    ? 'Last fetch: ' + new Date(s.last_fetch).toLocaleTimeString() + ' UTC'
                    : 'No fetch yet';
                const nextFetch = s.next_fetch
                    ? ' · Next: ' + new Date(s.next_fetch).toLocaleTimeString()
                    : '';
                document.getElementById('forecastPollerStatus').innerHTML =
                    onlineBadge + ' <span style="font-size:11px;color:var(--text-secondary);margin-left:8px;">' +
                    lastFetch + nextFetch + ' · ' + s.point_count + ' pts</span>';
            } catch (_) {}
        }

        function initForecastAreasSection(tripId, isActive) {
            // Reset draw state from any previous session
            isDrawing = false;
            drawStart = null;
            drawRect = null;

            currentTripId = tripId;
            isActiveTripForForecast = isActive;

            document.getElementById('forecastAreasContainer').style.display = '';
            document.getElementById('forecastAreaControls').style.display = isActive ? '' : 'none';

            // Defer map init so the browser reflows the now-visible container first;
            // without this the map gets 0×0 dimensions and mouseEventToLatLng is wrong.
            requestAnimationFrame(() => {
                initForecastAreaMap();
                forecastAreaMap.invalidateSize();
                loadForecastAreas(tripId);
            });
            updateForecastStatus(tripId);

            if (forecastStatusInterval) clearInterval(forecastStatusInterval);
            forecastStatusInterval = setInterval(() => updateForecastStatus(tripId), 60000);
        }

    </script>
    <script src="/components/voyage-bar-component.js" defer></script>
</body>
</html>
