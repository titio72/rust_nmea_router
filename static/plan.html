            if (savedWindOverlay !== null) {
                windOverlayVisible = savedWindOverlay === 'true';
                document.getElementById('windOverlayInput').checked = windOverlayVisible;
                if (!windOverlayVisible) windLegendControl.getContainer().style.display = 'none';
            }

            const saved = localStorage.getItem('plan_speed_kn');
            if (saved) document.getElementById('speedInput').value = saved;
            const savedEff = localStorage.getItem('plan_polar_efficiency');
            if (savedEff) document.getElementById('efficiencyInput').value = savedEff;
            const savedMinSail = localStorage.getItem('plan_min_sail_speed');
            if (savedMinSail) document.getElementById('minSailInput').value = savedMinSail;
            const savedMinTwa = localStorage.getItem('plan_min_twa_deg');
            if (savedMinTwa) document.getElementById('minTwaInput').value = savedMinTwa;
            const savedSailWeight = localStorage.getItem('plan_sail_weight');
            if (savedSailWeight) document.getElementById('sailWeightInput').value = savedSailWeight;
            const savedAvoidLand = localStorage.getItem('plan_avoid_land');
            if (savedAvoidLand !== null) document.getElementById('avoidLandInput').checked = savedAvoidLand === 'true';

            await loadAvailableDays();
            restoreRoute();
        }

        async function loadAvailableDays() {
            try {
                const statusResp = await fetch('/api/forecast/status');
                const statusJson = await statusResp.json();
                if (!statusJson.data || statusJson.data.point_count === 0) {
                    document.getElementById('dayTabsContainer').innerHTML =
                        '<span style="font-size:13px; color:var(--text-secondary);">' +
                        'No forecast data. Draw a bounding box on the <a href="/navigation-areas.html">Navigation Areas</a> page.</span>';
                    return;
                }

                // Build day tabs: today UTC through today + 7 days
                const today = new Date();
                today.setUTCHours(0, 0, 0, 0);
                availableDays = [];
                for (let i = 0; i < 8; i++) {
                    const d = new Date(today);
                    d.setUTCDate(today.getUTCDate() + i);
                    availableDays.push({
                        date: d,
                        label: d.toLocaleDateString('en-GB', {
                            weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC'
                        })
                    });
                }
                renderDayTabs();
                jumpToNow();
            } catch (err) {
                console.error('Failed to load available days', err);
                document.getElementById('dayTabsContainer').innerHTML =
                    '<span style="font-size:13px; color:var(--text-secondary);">Failed to load forecast data. Please refresh.</span>';
            }
        }

        // ── Time scrubber ─────────────────────────────────────────────────────────
        function renderDayTabs() {
            document.getElementById('dayTabsContainer').innerHTML = availableDays
                .map((d, i) =>
                    `<button class="day-tab${i === selectedDay ? ' active' : ''}"
                             onclick="selectDay(${i})">${d.label}</button>`)
                .join('');
            layoutOverlays();
        }

        function selectDay(i, doLoad = true) {
            selectedDay = i;
            selectedHour = 0;
            document.getElementById('hourSlider').value = 0;
            renderDayTabs();
            updateSelectedTime();
            if (doLoad) loadGridPoints();
        }

        function updateSelectedTime() {
            if (!availableDays[selectedDay]) return;
            const d = new Date(availableDays[selectedDay].date);
            d.setUTCHours(selectedHour);
            document.getElementById('selectedTime').textContent =
                d.toLocaleDateString('en-GB', {
                    weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC'
                }) + ' · ' + String(selectedHour).padStart(2, '0') + ':00 UTC';
        }

        function getSelectedISO() {
            if (!availableDays[selectedDay]) return null;
            const d = new Date(availableDays[selectedDay].date);
            d.setUTCHours(selectedHour, 0, 0, 0);
            return d.toISOString();
        }

        document.getElementById('hourSlider').addEventListener('input', function () {
            selectedHour = parseInt(this.value);
            updateSelectedTime();
            clearTimeout(hourDebounceTimer);
            hourDebounceTimer = setTimeout(() => { loadGridPoints(); }, 150);
        });

        function jumpToNow() {
            const now = new Date();
            const todayUTC = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
            const idx = availableDays.findIndex(d => d.date.getTime() === todayUTC.getTime());
            if (idx >= 0) {
                selectedHour = now.getUTCHours();
                document.getElementById('hourSlider').value = selectedHour;
                selectedDay = idx;
                renderDayTabs();
                updateSelectedTime();
                loadGridPoints();
            }
        }

        // ── IDW display interpolation ─────────────────────────────────────────────

        // Fast degree-based distance approximation in nautical miles (no trig in hot path).
        function degDistNm(lat1, lon1, lat2, lon2) {
            const dlat = lat2 - lat1;
            const dlon = (lon2 - lon1) * Math.cos(lat1 * Math.PI / 180);
            return Math.sqrt(dlat * dlat + dlon * dlon) * 60;
        }

        const IDW_MAX_NM = 25;

        // Inverse-distance-weighted blend of the points in `pointArrays` (one or more
        // arrays, e.g. the 3x3 neighborhood of spatial-index cells) at the target point.
        // Accumulators are static named locals rather than an object keyed by field name —
        // computed-key assignment (obj[key] = ...) forces V8 into slow dictionary-mode
        // objects, which badly regressed this once it's called once per output texel.
        function accumulateIdw(targetLat, targetLon, pointArrays) {
            let sumW = 0;
            let swSpeed = 0, svSpeed = 0;
            let swGust = 0, svGust = 0;
            let swWaveH = 0, svWaveH = 0;
            let swWaveP = 0, svWaveP = 0;
            let swCape = 0, svCape = 0;
            let swWindDir = 0, sinWindDir = 0, cosWindDir = 0;
            let swWaveDir = 0, sinWaveDir = 0, cosWaveDir = 0;

            for (let ai = 0; ai < pointArrays.length; ai++) {
                const arr = pointArrays[ai];
                if (!arr) continue;
                for (let i = 0; i < arr.length; i++) {
                    const pt = arr[i];
                    const d = degDistNm(targetLat, targetLon, pt.lat, pt.lon);
                    if (d < 0.01) return pt;   // exact match
                    if (d > IDW_MAX_NM) continue;
                    const w = 1 / (d * d);
                    sumW += w;

                    if (pt.wind_speed_kn != null) { swSpeed += w; svSpeed += pt.wind_speed_kn * w; }
                    if (pt.wind_gust_kn != null) { swGust += w; svGust += pt.wind_gust_kn * w; }
                    if (pt.wave_height_m != null) { swWaveH += w; svWaveH += pt.wave_height_m * w; }
                    if (pt.wave_period_s != null) { swWaveP += w; svWaveP += pt.wave_period_s * w; }
                    if (pt.cape_j_kg != null) { swCape += w; svCape += pt.cape_j_kg * w; }
                    if (pt.wind_direction_deg != null) {
                        const rad = pt.wind_direction_deg * Math.PI / 180;
                        swWindDir += w; sinWindDir += Math.sin(rad) * w; cosWindDir += Math.cos(rad) * w;
                    }
                    if (pt.wave_direction_deg != null) {
                        const rad = pt.wave_direction_deg * Math.PI / 180;
                        swWaveDir += w; sinWaveDir += Math.sin(rad) * w; cosWaveDir += Math.cos(rad) * w;
                    }
                }
            }
            if (sumW === 0) return null;

            const angDeg = (sw, sinS, cosS) => {
                if (!sw) return null;
                const deg = Math.atan2(sinS / sw, cosS / sw) * 180 / Math.PI;
                return deg < 0 ? deg + 360 : deg;
            };

            return {
                lat: targetLat, lon: targetLon,
                wind_speed_kn: swSpeed ? svSpeed / swSpeed : null,
                wind_gust_kn: swGust ? svGust / swGust : null,
                wave_height_m: swWaveH ? svWaveH / swWaveH : null,
                wave_period_s: swWaveP ? svWaveP / swWaveP : null,
                cape_j_kg: swCape ? svCape / swCape : null,
                wind_direction_deg: angDeg(swWindDir, sinWindDir, cosWindDir),
                wave_direction_deg: angDeg(swWaveDir, sinWaveDir, cosWaveDir),
            };
        }

        function idwInterpolate(targetLat, targetLon, sourcePts) {
            return accumulateIdw(targetLat, targetLon, [sourcePts]);
        }

        // Uniform grid index over sourcePts for fast radius queries, reused across many
        // idwInterpolateIndexed() calls against the same point set (e.g. one per output
        // texel). A flat row-major array (not a Map keyed by string) avoids per-query
        // hashing/string-concat overhead. Cell size matches IDW_MAX_NM so a 3x3
        // neighborhood around the target's cell always covers every candidate within
        // range; lon cells are scaled by the point set's mean latitude so cells stay
        // roughly square in nm.
        function buildSpatialIndex(sourcePts) {
            let latSum = 0, latMin = Infinity, latMax = -Infinity, lonMin = Infinity, lonMax = -Infinity;
            for (const p of sourcePts) {
                latSum += p.lat;
                if (p.lat < latMin) latMin = p.lat;
                if (p.lat > latMax) latMax = p.lat;
                if (p.lon < lonMin) lonMin = p.lon;
                if (p.lon > lonMax) lonMax = p.lon;
            }
            const refLat = sourcePts.length ? latSum / sourcePts.length : 0;
            const cosRef = Math.max(Math.cos(refLat * Math.PI / 180), 1e-6);
            const cellDegLat = IDW_MAX_NM / 60;
            const cellDegLon = IDW_MAX_NM / 60 / cosRef;

            const rowMin = sourcePts.length ? Math.floor(latMin / cellDegLat) : 0;
            const colMin = sourcePts.length ? Math.floor(lonMin / cellDegLon) : 0;
            const numRows = sourcePts.length ? Math.floor(latMax / cellDegLat) - rowMin + 1 : 0;
            const numCols = sourcePts.length ? Math.floor(lonMax / cellDegLon) - colMin + 1 : 0;

            const cells = new Array(numRows * numCols);
            for (const pt of sourcePts) {
                const row = Math.floor(pt.lat / cellDegLat) - rowMin;
                const col = Math.floor(pt.lon / cellDegLon) - colMin;
                const idx = row * numCols + col;
                (cells[idx] || (cells[idx] = [])).push(pt);
            }
            return { cells, cellDegLat, cellDegLon, rowMin, colMin, numRows, numCols };
        }

        // Reusable scratch array for the 9-cell neighborhood, to avoid an allocation
        // per texel (this runs up to 256*256 times per rebuild).
        const IDW_NEIGHBORHOOD = new Array(9);
        function idwInterpolateIndexed(targetLat, targetLon, index) {
            const row = Math.floor(targetLat / index.cellDegLat) - index.rowMin;
            const col = Math.floor(targetLon / index.cellDegLon) - index.colMin;
            let n = 0;
            for (let dr = -1; dr <= 1; dr++) {
                const r = row + dr;
                if (r < 0 || r >= index.numRows) continue;
                for (let dc = -1; dc <= 1; dc++) {
                    const c = col + dc;
                    if (c < 0 || c >= index.numCols) continue;
                    IDW_NEIGHBORHOOD[n++] = index.cells[r * index.numCols + c];
                }
            }
            IDW_NEIGHBORHOOD.length = n;
            const result = accumulateIdw(targetLat, targetLon, IDW_NEIGHBORHOOD);
            IDW_NEIGHBORHOOD.length = 9;
            return result;
        }

        // Estimate the native grid lat and lon steps from the stored source points.
        // Lat step: reliable median of sorted unique lat differences.
        // Lon step: computed per lat-row, then median across rows (avoids mixing
        // different-row lon grids that would underestimate the true step).
        function nativeGridSteps(sourcePts) {
            const R4 = v => Math.round(v * 10000) / 10000;

            const sortedLats = [...new Set(sourcePts.map(p => R4(p.lat)))].sort((a, b) => a - b);
            if (sortedLats.length < 2) return { lat: 0.1, lon: 0.15 };
            const latDiffs = [];
            for (let i = 1; i < sortedLats.length; i++) latDiffs.push(sortedLats[i] - sortedLats[i - 1]);
            latDiffs.sort((a, b) => a - b);
            const latStep = latDiffs[latDiffs.length >> 1];

            // Group by lat row, compute per-row lon step, take median of those
            const byLat = new Map();
            for (const p of sourcePts) {
                const k = Math.round(p.lat * 10000);
                if (!byLat.has(k)) byLat.set(k, []);
                byLat.get(k).push(R4(p.lon));
            }
            const rowMedians = [];
            for (const lons of byLat.values()) {
                const s = [...new Set(lons)].sort((a, b) => a - b);
                const diffs = [];
                for (let i = 1; i < s.length; i++) diffs.push(s[i] - s[i - 1]);
                if (diffs.length) {
                    diffs.sort((a, b) => a - b);
                    rowMedians.push(diffs[diffs.length >> 1]);
                }
            }
            rowMedians.sort((a, b) => a - b);
            const lonStep = rowMedians.length ? rowMedians[rowMedians.length >> 1] : latStep * 1.5;

            return { lat: latStep, lon: lonStep };
        }

        // Subdivide each native grid cell into SUBDIVISIONS equal parts and IDW-interpolate
        // each sub-point from the original native grid. Performance guard: never more than
        // MAX_SIDE columns or rows of arrows (prevents thousands of markers when zoomed out).
        function interpolateDisplayGrid(sourcePts) {
            if (!sourcePts.length || !planMap) return [];

            const bounds = planMap.getBounds();
            const west = bounds.getWest(), east = bounds.getEast();
            const south = bounds.getSouth(), north = bounds.getNorth();

            const SUBDIVISIONS = 3;
            const MAX_SIDE = 30;
            const { lat: nativeLatStep, lon: nativeLonStep } = nativeGridSteps(sourcePts);
            const displayLatStep = Math.max(nativeLatStep / SUBDIVISIONS, (north - south) / MAX_SIDE);
            const displayLonStep = Math.max(nativeLonStep / SUBDIVISIONS, (east - west) / MAX_SIDE);

            // Clamp display grid to intersection of source data bbox and viewport
            let srcLatMin = Infinity, srcLatMax = -Infinity, srcLonMin = Infinity, srcLonMax = -Infinity;
            for (const p of sourcePts) {
                if (p.lat < srcLatMin) srcLatMin = p.lat;
                if (p.lat > srcLatMax) srcLatMax = p.lat;
                if (p.lon < srcLonMin) srcLonMin = p.lon;
                if (p.lon > srcLonMax) srcLonMax = p.lon;
            }

            const latMin = Math.max(south, srcLatMin);
            const latMax = Math.min(north, srcLatMax);
            const lonMin = Math.max(west, srcLonMin);
            const lonMax = Math.min(east, srcLonMax);
            if (latMin >= latMax || lonMin >= lonMax) return [];

            const index = buildSpatialIndex(sourcePts);
            const result = [];
            for (let lat = latMin; lat <= latMax + 1e-9; lat += displayLatStep) {
                for (let lon = lonMin; lon <= lonMax + 1e-9; lon += displayLonStep) {
                    const pt = idwInterpolateIndexed(lat, lon, index);
                    if (pt) result.push(pt);
                }
            }
            return result;
        }

        // ── Grid-point wind field ─────────────────────────────────────────────────
        async function loadGridPoints() {
            const ts = getSelectedISO();
            if (!ts) return;
            try {
                const resp = await fetch(
                    `/api/forecast/grid-points?timestamp=${encodeURIComponent(ts)}`
                );
                const json = await resp.json();
                lastGridPts = json.data || [];
                const activeModel = lastGridPts.length ? (lastGridPts[0].model || 'ecmwf') : null;
                const badge = document.getElementById('modelBadge');
                if (badge) {
                    badge.textContent = activeModel ? activeModel.toUpperCase() : '—';
                    badge.title = activeModel === 'arome'
                        ? 'AROME ~1.5 km (short-term)'
                        : 'ECMWF ~9 km';
                }
                windLayers.forEach(layer => layer.rebuildTexture());
                renderStats();
            } catch (err) {
                console.error('Failed to load grid points', err);
            }
        }

        function interpolateColorStops(speed, stops) {
            const kn = Math.max(speed || 0, 0);
            if (kn <= stops[0][0]) return `rgb(${stops[0][1].join(',')})`;
            if (kn >= stops[stops.length - 1][0]) return `rgb(${stops[stops.length - 1][1].join(',')})`;
            for (let i = 1; i < stops.length; i++) {
                if (kn <= stops[i][0]) {
                    const t = (kn - stops[i-1][0]) / (stops[i][0] - stops[i-1][0]);
                    const c = stops[i-1][1].map((a, j) => Math.round(a + t * (stops[i][1][j] - a)));
                    return `rgb(${c.join(',')})`;
                }
            }
        }

        function windColor(speed) {
            return interpolateColorStops(speed, [
                [0,  [170, 170, 170]],
                [4,  [30,  160, 255]],
                [7,  [0,   210, 180]],
                [10, [0,   190,  60]],
                [16, [220, 210,   0]],
                [22, [255, 140,   0]],
                [28, [220,  30,   0]],
            ]);
        }

        // Route line/dots use shades of red instead of windColor()'s blue-green-yellow scale,
        // so they stay visible against the colored wind-intensity background layer.
        function routeColor(speed) {
            return interpolateColorStops(speed, [
                [0,  [255, 205, 210]],
                [4,  [239, 154, 154]],
                [7,  [229, 115, 115]],
                [10, [211,  47,  47]],
                [16, [183,  28,  28]],
                [22, [136,  14,  14]],
                [28, [ 90,   0,   0]],
            ]);
        }

        function pointInArea(lat, lon, area) {
            return lat >= area.lat_min && lat <= area.lat_max &&
                   lon >= area.lon_min && lon <= area.lon_max;
        }

        function pointInAnyArea(lat, lon) {
            return planAreas.some(a => pointInArea(lat, lon, a));
        }

        function showWindPopupAt(latlng) {
            const area = planAreas.find(a => pointInArea(latlng.lat, latlng.lng, a));
            if (!area) return;
            const pt = idwInterpolate(latlng.lat, latlng.lng, pointsInArea(lastGridPts, area));
            if (!pt) return;
            const wind = pt.wind_speed_kn || 0;
            const gust = pt.wind_gust_kn || 0;
            const dir = pt.wind_direction_deg || 0;
            L.popup()
                .setLatLng(latlng)
                .setContent(
                    `<b>Wind:</b> ${wind.toFixed(1)} kn ${dir.toFixed(0)}°<br>` +
                    `<b>Gust:</b> ${gust.toFixed(1)} kn<br>` +
                    `<b>Wave:</b> ${(pt.wave_height_m || 0).toFixed(1)} m ` +
                    `${(pt.wave_period_s || 0).toFixed(0)} s<br>` +
                    `<b>CAPE:</b> ${(pt.cape_j_kg || 0).toFixed(0)} J/kg<br>` +
                    `<b>Model:</b> ${(document.getElementById('modelBadge')?.textContent) || '—'}`
                )
                .openOn(planMap);
        }

        function toggleWindOverlay() {
            windOverlayVisible = document.getElementById('windOverlayInput').checked;
            localStorage.setItem('plan_wind_overlay_visible', windOverlayVisible);
            windLayers.forEach(layer => layer.setEnabled(windOverlayVisible));
            if (windLegendControl) {
                windLegendControl.getContainer().style.display = windOverlayVisible ? '' : 'none';
            }
        }

        function toggleGustMode() {
            showGust = !showGust;
            const btn = document.getElementById('gustToggleBtn');
            if (showGust) {
                btn.textContent = 'Show Wind';
                btn.style.background = 'var(--link-color)';
                btn.style.color = '#fff';
                btn.style.borderColor = 'var(--link-color)';
            } else {
                btn.textContent = 'Show Gust';
                btn.style.background = 'var(--bg-secondary)';
                btn.style.color = 'var(--text-secondary)';
                btn.style.borderColor = 'var(--border-color)';
            }
            document.getElementById('legendLabel').textContent = showGust ? 'Gust (kn)' : 'Wind (kn)';
            windLayers.forEach(layer => layer.rebuildTexture());
        }

        function renderStats() {
            document.getElementById('statWind').textContent   = '—';
            document.getElementById('statGust').textContent   = '—';
            document.getElementById('statWave').textContent   = '—';
            document.getElementById('statPeriod').textContent = '—';
            document.getElementById('statCape').textContent   = '—';
        }

        function totalRouteNm() {
            let d = 0;
            for (let i = 1; i < routeWaypoints.length; i++)
                d += degDistNm(routeWaypoints[i - 1].lat, routeWaypoints[i - 1].lng,
                               routeWaypoints[i].lat,     routeWaypoints[i].lng);
            return d;
        }

        function updateRouteBar() {
            const n  = routeWaypoints.length;
            const nm = totalRouteNm();
            document.getElementById('routeWptCount').textContent = n
                ? `${n} waypoint${n !== 1 ? 's' : ''} · ${nm.toFixed(1)} nm`
                : 'click map to add waypoints';

            const undoBtn    = document.getElementById('undoBtn');
            const doneBtn    = document.getElementById('doneBtn');
            undoBtn.disabled = (n === 0 || routeDone);
            doneBtn.disabled = (n < 2  || routeDone);
            undoBtn.style.display = routeDone ? 'none' : '';
            doneBtn.style.display = routeDone ? 'none' : '';

            const dep   = document.getElementById('depInput').value;
            const speed = parseFloat(document.getElementById('speedInput').value);
            const ready = routeDone && n >= 2 && !!dep && speed > 0;
            const computeBtn = document.getElementById('computeBtn');
            computeBtn.disabled = !ready;
            computeBtn.style.opacity = ready ? '1' : '0.4';

            const optimizeBtn = document.getElementById('optimizeBtn');
            if (optimizeBtn) {
                const canOptimize = routeDone && routeWaypoints.length >= 2 && !!dep && speed > 0;
                optimizeBtn.disabled = !canOptimize;
                optimizeBtn.style.opacity = canOptimize ? '1' : '0.4';
            }
        }

        function undoWaypoint() {
            if (!routeWaypoints.length) return;
            planMap.removeLayer(waypointMarkers.pop());
            if (previewLines.length) planMap.removeLayer(previewLines.pop());
            routeWaypoints.pop();
            const newN = routeWaypoints.length;
            if (newN >= 1) {
                const lastIdx = newN - 1;
                // First waypoint stays green; any other new-last becomes red
                const fillColor = (lastIdx === 0) ? '#48bb78' : '#fc8181';
                waypointMarkers[lastIdx].setStyle({ fillColor, color: '#fff' });
            }
            updateRouteBar();
        }

        function doneDrawing() {
            if (routeWaypoints.length < 2) return;
            routeDone = true;
            planMap.getContainer().style.cursor = '';
            updateRouteBar();
            saveRouteState();
        }

        // ── Route mode ────────────────────────────────────────────────────────────
        function toggleRouteMode() {
            if (routeMode) {
                clearRoute();
            } else {
                routeMode = true;
                document.getElementById('planRouteBtn').textContent = 'Clear Route';
                document.getElementById('planRouteBtn').style.background = '#e74c3c';
                document.getElementById('routeBar').style.display = '';
                planMap.getContainer().style.cursor = 'crosshair';
                // Pre-fill departure from current scrubber
                const iso = getSelectedISO();
                if (iso) document.getElementById('depInput').value = iso.slice(0, 16);
            }
        }

        function clearRoute() {
            routeMode = false;
            routeDone = false;
            waypointMarkers.forEach(m => planMap.removeLayer(m));
            waypointMarkers = [];
            previewLines.forEach(l => planMap.removeLayer(l));
            previewLines = [];
            routeWaypoints = [];
            routeSegments.forEach(l => planMap.removeLayer(l));
            routeSegments = [];
            frontierLines.forEach(l => planMap.removeLayer(l));
            frontierLines = [];
            lastFrontiers = [];
            lastFrontiersDeparture = null;
            closeFrontierReport();
            if (alternativeLine) { planMap.removeLayer(alternativeLine); alternativeLine = null; }
            document.getElementById('routeBar').style.display = 'none';
            document.getElementById('routeSummary').style.display = 'none';
            document.getElementById('routeWptCount').textContent = 'click map to add waypoints';
            lastRouteOverlay = [];
            localStorage.removeItem('plan_route');
            document.getElementById('planRouteBtn').textContent = 'Plan Route';
            document.getElementById('planRouteBtn').style.background = '';
            planMap.getContainer().style.cursor = '';
            updateRouteBar();
        }

        function onMapClick(e) {
            if (!routeMode || routeDone) {
                showWindPopupAt(e.latlng);
                return;
            }
            const n = routeWaypoints.length;

            if (n > 0) {
                const prev = routeWaypoints[n - 1];
                previewLines.push(
                    L.polyline([[prev.lat, prev.lng], [e.latlng.lat, e.latlng.lng]], {
                        color: '#888', weight: 2, dashArray: '6,6', opacity: 0.7
                    }).addTo(planMap)
                );
                // Previous last marker → gray (first marker always stays green)
                if (n > 1) waypointMarkers[n - 1].setStyle({ fillColor: '#888', color: '#888' });
            }

            routeWaypoints.push(e.latlng);
            const fillColor = (n === 0) ? '#48bb78' : '#fc8181';
            waypointMarkers.push(
                L.circleMarker(e.latlng, {
                    color: '#fff', fillColor, fillOpacity: 1, radius: 7, weight: 2
                }).addTo(planMap)
            );
            updateRouteBar();
            saveRouteState();
        }

        document.getElementById('depInput').addEventListener('change', updateRouteBar);
        document.getElementById('speedInput').addEventListener('input', function () {
            localStorage.setItem('plan_speed_kn', this.value);
            updateRouteBar();
        });
        document.getElementById('efficiencyInput').addEventListener('input', function () {
            localStorage.setItem('plan_polar_efficiency', this.value);
        });
        document.getElementById('minSailInput').addEventListener('input', function () {
            localStorage.setItem('plan_min_sail_speed', this.value);
        });
        document.getElementById('minTwaInput').addEventListener('input', function () {
            localStorage.setItem('plan_min_twa_deg', this.value);
        });
        document.getElementById('sailWeightInput').addEventListener('input', function () {
            localStorage.setItem('plan_sail_weight', this.value);
        });
        document.getElementById('avoidLandInput').addEventListener('change', function () {
            localStorage.setItem('plan_avoid_land', this.checked);
        });

        async function computeRoute() {
            const dep        = document.getElementById('depInput').value;
            const speed      = parseFloat(document.getElementById('speedInput').value);
            const efficiency = parseFloat(document.getElementById('efficiencyInput').value) / 100;
            const minSail    = parseFloat(document.getElementById('minSailInput').value);
            const minTwa     = parseFloat(document.getElementById('minTwaInput').value);
            if (!routeDone || routeWaypoints.length < 2 || !dep || !(speed > 0)) return;

            drawRouteLine([]);
            frontierLines.forEach(l => planMap.removeLayer(l));
            frontierLines = [];
            lastFrontiers = [];
            lastFrontiersDeparture = null;
            closeFrontierReport();
            if (alternativeLine) { planMap.removeLayer(alternativeLine); alternativeLine = null; }
            lastRouteOverlay = [];

            const departure      = dep.slice(0, 16) + ':00Z';
            const waypointsParam = routeWaypoints
                .map(p => `${p.lat.toFixed(6)},${p.lng.toFixed(6)}`)
                .join(';');
            const url = `/api/forecast/route?waypoints=${encodeURIComponent(waypointsParam)}` +
                `&departure=${encodeURIComponent(departure)}` +
                `&motoring_speed_kn=${speed}` +
                `&polar_efficiency=${efficiency.toFixed(3)}` +
                `&min_sail_speed_kn=${minSail}` +
                `&min_twa_deg=${minTwa}`;

            const btn = document.getElementById('computeBtn');
            btn.textContent = 'Computing…';
            btn.disabled = true;
            let hadError = false;
            try {
                const resp = await fetch(url);
                const json = await resp.json();
                if (json.status === 'error') {
                    console.error('Route API error:', json.message);
                    hadError = true;
                    return;
                }
                drawRouteLine(json.data || []);
            } catch (err) {
                console.error('Route forecast failed', err);
                hadError = true;
            } finally {
                btn.textContent = hadError ? 'Error — retry' : 'Compute';
                updateRouteBar();
            }
        }

        async function optimizeRoute() {
            const btn = document.getElementById('optimizeBtn');
            const orig = btn.textContent;
            const dep   = document.getElementById('depInput').value;
            const speed = parseFloat(document.getElementById('speedInput').value);
            if (!routeDone || routeWaypoints.length < 2 || !dep || !(speed > 0)) return;

            drawRouteLine([]);
            frontierLines.forEach(l => planMap.removeLayer(l));
            frontierLines = [];
            lastFrontiers = [];
            lastFrontiersDeparture = null;
            closeFrontierReport();
            if (alternativeLine) { planMap.removeLayer(alternativeLine); alternativeLine = null; }
            lastRouteOverlay = [];

            btn.disabled = true;
            btn.textContent = '⚡ Optimizing…';

            const from       = routeWaypoints[0];                          // isochrone uses endpoints only
            const to         = routeWaypoints[routeWaypoints.length - 1]; // intermediate waypoints are ignored
            const departure  = dep.slice(0, 16) + ':00Z';
            const efficiency = parseFloat(document.getElementById('efficiencyInput').value) / 100;
            const minSail    = parseFloat(document.getElementById('minSailInput').value);
            const minTwa     = parseFloat(document.getElementById('minTwaInput').value);
            const sailWeight = parseFloat(document.getElementById('sailWeightInput').value) || 0;
            const avoidLand  = document.getElementById('avoidLandInput').checked;

            try {
                const url = `/api/forecast/optimal-route?from_lat=${from.lat.toFixed(6)}&from_lon=${from.lng.toFixed(6)}`
                    + `&to_lat=${to.lat.toFixed(6)}&to_lon=${to.lng.toFixed(6)}`
                    + `&departure=${encodeURIComponent(departure)}`
                    + `&motoring_speed_kn=${speed}`
                    + `&polar_efficiency=${efficiency.toFixed(3)}`
                    + `&min_sail_speed_kn=${minSail}`
                    + `&min_twa_deg=${minTwa}`
                    + `&sail_weight_kn=${sailWeight.toFixed(1)}`
                    + `&avoid_land=${avoidLand}`;

                const resp = await fetch(url);
                const json = await resp.json();
                if (json.status !== 'ok' || !json.data?.route?.length) {
                    btn.textContent = '✗ ' + (json.error || 'Error');
                    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 3000);
                    return;
                }
                lastFrontiersDeparture = departure;
                drawFrontiers(json.data.frontiers || []);
                drawRouteLine(json.data.route);
                btn.textContent = orig;
                btn.disabled = false;
            } catch (_) {
                btn.textContent = '✗ Error';
                setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 3000);
            }
        }


        function buildSegmentPopup(p) {
            const ts   = p.timestamp ? new Date(p.timestamp).toUTCString().slice(0, 22) : '—';
            const spd  = p.wind_speed_kn   != null ? p.wind_speed_kn.toFixed(1)   + ' kn'  : '—';
            const dir  = p.wind_direction_deg != null ? p.wind_direction_deg.toFixed(0) + '°' : '—';
            const gust = p.wind_gust_kn    != null ? p.wind_gust_kn.toFixed(1)    + ' kn'  : '—';
            const wh   = p.wave_height_m   != null ? p.wave_height_m.toFixed(1)   + ' m'   : '—';
            const wp   = p.wave_period_s   != null ? p.wave_period_s.toFixed(0)   + ' s'   : '—';
            const spd2 = p.speed_kn        != null ? p.speed_kn.toFixed(1)        + ' kn'  : '—';
            const twa  = p.twa_deg         != null ? p.twa_deg.toFixed(0)         + '°'    : '—';
            return `<b>${ts}</b><br>Wind: ${spd} · ${dir} (gust ${gust})<br>`
                 + `Wave: ${wh} / ${wp}<br>Boat speed: ${spd2} · TWA: ${twa}`;
        }

        // Frontier grid samples are raw isochrone reachability points — they never land
        // exactly on the destination. Mirrors the backend's own backtrack() (src/routing.rs),
        // which always appends the exact destination coordinate + extrapolated arrival time
        // as the final route point. Returns null if the point is already at the destination.
        function frontierDestinationLeg(lastLat, lastLon, lastTime, speedKn) {
            const dest = routeWaypoints[routeWaypoints.length - 1];
            const distNm = degDistNm(lastLat, lastLon, dest.lat, dest.lng);
            if (distNm < 0.05) return null;
            const spd = speedKn > 0.1 ? speedKn : 0.1;
            const hours = distNm / spd;
            return { lat: dest.lat, lon: dest.lng, time: new Date(lastTime.getTime() + hours * 3600000) };
        }

        // Walks parent_idx from (stepIdx, ptIdx) in lastFrontiers back to the route origin,
        // returning an origin-to-point path of [lat, lon] pairs. Appends an extrapolated
        // final leg to the actual destination waypoint (see frontierDestinationLeg).
        function backtrackFrontierPath(stepIdx, ptIdx) {
            const path = [];
            let s = stepIdx, i = ptIdx;
            const clickedPt = lastFrontiers[stepIdx][ptIdx];
            while (s >= 0) {
                const pt = lastFrontiers[s][i];
                path.push([pt.lat, pt.lon]);
                i = pt.parent_idx;
                s -= 1;
            }
            const origin = routeWaypoints[0];
            path.push([origin.lat, origin.lng]);
            path.reverse();

            const lastTime = new Date(new Date(lastFrontiersDeparture).getTime()
                + (stepIdx + 1) * FRONTIER_STEP_HOURS * 3600000);
            const leg = frontierDestinationLeg(clickedPt.lat, clickedPt.lon, lastTime, clickedPt.speed_kn);
            if (leg) path.push([leg.lat, leg.lon]);
            return path;
        }

        // latlngs/ptIdxs are parallel arrays for one drawn frontier run: latlngs[i] is the
        // [lat, lon] of the point whose original index (into lastFrontiers[stepIdx]) is ptIdxs[i].
        // Returns the ptIdxs entry closest to the event's map position.
        function nearestFrontierPtIdx(e, ptIdxs, latlngs) {
            let nearest = 0;
            let nearestDist = Infinity;
            for (let i = 0; i < latlngs.length; i++) {
                const dLat = latlngs[i][0] - e.latlng.lat;
                const dLon = latlngs[i][1] - e.latlng.lng;
                const dist = dLat * dLat + dLon * dLon;
                if (dist < nearestDist) {
                    nearestDist = dist;
                    nearest = i;
                }
            }
            return ptIdxs[nearest];
        }

        function showFrontierAlternative(e, stepIdx, ptIdxs, latlngs) {
            const path = backtrackFrontierPath(stepIdx, nearestFrontierPtIdx(e, ptIdxs, latlngs));
            if (alternativeLine) planMap.removeLayer(alternativeLine);
            alternativeLine = L.polyline(path, {
                color: '#ff8c00',
                weight: 2,
                opacity: 0.9,
                dashArray: '4,4'
            }).addTo(planMap);
        }

        function hideFrontierAlternative() {
            if (alternativeLine) {
                planMap.removeLayer(alternativeLine);
                alternativeLine = null;
            }
        }

        // Walks parent_idx from (stepIdx, ptIdx) back to the route origin, returning
        // one row per 0.5h step with the leg telemetry that was already computed during
        // the isochrone search (speed, engine status, true wind speed/direction).
        function backtrackFrontierReport(stepIdx, ptIdx) {
            const rows = [];
            let s = stepIdx, i = ptIdx;
            const clickedPt = lastFrontiers[stepIdx][ptIdx];
            while (s >= 0) {
                const pt = lastFrontiers[s][i];
                rows.push({
                    time: new Date(new Date(lastFrontiersDeparture).getTime()
                        + (s + 1) * FRONTIER_STEP_HOURS * 3600000),
                    speed_kn: pt.speed_kn,
                    motoring: pt.motoring,
                    wind_speed_kn: pt.wind_speed_kn,
                    wind_dir_deg: pt.wind_dir_deg,
                    wind_gust_kn: pt.wind_gust_kn,
                    relative_wind_deg: pt.relative_wind_deg
                });
                i = pt.parent_idx;
                s -= 1;
            }
            rows.push({ time: new Date(lastFrontiersDeparture), speed_kn: null, motoring: null,
                        wind_speed_kn: null, wind_dir_deg: null, wind_gust_kn: null, relative_wind_deg: null });
            rows.reverse();

            const lastTime = rows[rows.length - 1].time;
            const leg = frontierDestinationLeg(clickedPt.lat, clickedPt.lon, lastTime, clickedPt.speed_kn);
            if (leg) {
                rows.push({ time: leg.time, speed_kn: clickedPt.speed_kn, motoring: clickedPt.motoring,
                            wind_speed_kn: null, wind_dir_deg: null, wind_gust_kn: clickedPt.wind_gust_kn,
                            relative_wind_deg: null });
            }
            return rows;
        }

        function closeFrontierReport() {
            document.getElementById('altRouteModal').classList.remove('active');
            openFrontierReportStepIdx = null;
            openFrontierReportPtIdx = null;
        }

        function showFrontierReport(stepIdx, ptIdx) {
            if (!lastFrontiersDeparture) return;
            openFrontierReportStepIdx = stepIdx;
            openFrontierReportPtIdx = ptIdx;
            const rows = backtrackFrontierReport(stepIdx, ptIdx);
            const dep = rows[0].time;
            const eta = rows[rows.length - 1].time;
            const durMs = eta.getTime() - dep.getTime();
            const h = Math.floor(durMs / 3600000);
            const m = Math.round((durMs % 3600000) / 60000);
            document.getElementById('altRouteEta').textContent =
                eta.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' })
                + ' ' + eta.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' }) + ' UTC';
            document.getElementById('altRouteDur').textContent = m > 0 ? `${h}h ${m}m` : `${h}h`;

            const body = document.getElementById('altRouteTableBody');
            body.innerHTML = rows.map(r => {
                const t = r.time.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' })
                    + ' UTC ' + r.time.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', timeZone: 'UTC' });
                const spd = r.speed_kn != null ? r.speed_kn.toFixed(1) + ' kn' : '—';
                const eng = r.motoring == null ? '—' : (r.motoring ? '⚙ Motoring' : '⛵ Sailing');
                const tws = r.wind_speed_kn != null ? r.wind_speed_kn.toFixed(1) + ' kn' : '—';
                const twd = r.relative_wind_deg != null ? r.relative_wind_deg.toFixed(0) + '°' : '—';
                return `<tr><td>${t}</td><td>${spd}</td><td>${eng}</td><td>${tws}</td><td>${twd}</td></tr>`;
            }).join('');

            document.getElementById('altRouteModal').classList.add('active');
        }

        // Promotes the frontier path/report currently shown in altRouteModal to the
        // displayed accepted route, replacing whatever drawRouteLine/drawRouteSummary
        // currently show. Merges backtrackFrontierPath's lat/lon with
        // backtrackFrontierReport's telemetry (same parent_idx walk, same row count)
        // into a RouteTrackPoint-shaped array.
        function selectFrontierRoute() {
            if (openFrontierReportStepIdx == null || openFrontierReportPtIdx == null) return;
            const path = backtrackFrontierPath(openFrontierReportStepIdx, openFrontierReportPtIdx);
            const rows = backtrackFrontierReport(openFrontierReportStepIdx, openFrontierReportPtIdx);
            const pts = rows.map((r, i) => ({
                lat: path[i][0],
                lon: path[i][1],
                timestamp: r.time.toISOString(),
                speed_kn: r.speed_kn,
                twa_deg: r.motoring == null ? null : (r.motoring ? null : 0),
                wind_speed_kn: r.wind_speed_kn,
                wind_direction_deg: r.wind_dir_deg,
                relative_wind_deg: r.relative_wind_deg,
                wind_gust_kn: r.wind_gust_kn,
                wave_height_m: null,
                wave_period_s: null
            }));

            hideFrontierAlternative();

            drawRouteLine(pts);
            drawRouteSummary(pts);
            closeFrontierReport();
        }

        function drawFrontierRun(latlngs, stepIdx, ptIdxs) {
            const line = L.polyline(latlngs, {
                color: '#444',
                weight: 1,
                opacity: 0.6
            }).addTo(planMap);
            // Invisible fat line layered on top of the thin visible one — the visible
            // weight:1 stroke is too thin to reliably catch mousemove, so hover detection
            // uses this wider (but transparent) hit target instead.
            const hitLine = L.polyline(latlngs, {
                weight: 16,
                opacity: 0
            }).addTo(planMap);
            hitLine.on('mousemove', e => showFrontierAlternative(e, stepIdx, ptIdxs, latlngs));
            hitLine.on('mouseout', hideFrontierAlternative);
            hitLine.on('click', e => {
                L.DomEvent.stopPropagation(e);
                showFrontierReport(stepIdx, nearestFrontierPtIdx(e, ptIdxs, latlngs));
            });
            frontierLines.push(line, hitLine);
        }

        function drawFrontiers(frontiers) {
            frontierLines.forEach(l => planMap.removeLayer(l));
            frontierLines = [];
            hideFrontierAlternative();
            lastFrontiers = frontiers;
            for (let s = 0; s < frontiers.length; s++) {
                const frontier = frontiers[s];
                let run = [];
                let runIdx = [];
                for (let i = 0; i < frontier.length; i++) {
                    const { lat, lon } = frontier[i];
                    if (pointInAnyArea(lat, lon)) {
                        run.push([lat, lon]);
                        runIdx.push(i);
                    } else {
                        if (run.length >= 2) drawFrontierRun(run, s, runIdx);
                        run = [];
                        runIdx = [];
                    }
                }
                if (run.length >= 2) drawFrontierRun(run, s, runIdx);
            }
        }

        function drawRouteLine(pts) {
            routeSegments.forEach(l => planMap.removeLayer(l));
            routeSegments = [];
            previewLines.forEach(l => planMap.removeLayer(l));
            previewLines = [];
            if (pts.length < 2) return;
            lastRouteOverlay = pts;
            saveRouteState();

            for (let i = 0; i < pts.length - 1; i++) {
                const p = pts[i];
                const pNext = pts[i + 1];
                // twa_deg is null when motoring (light wind, too close to wind, or no polar loaded)
                const isMotoring = pNext.twa_deg === null && pNext.speed_kn !== null;
                const seg = L.polyline(
                    [[p.lat, p.lon], [pNext.lat, pNext.lon]],
                    {
                        color: routeColor(p.wind_speed_kn || 0),
                        weight: 5,
                        opacity: 0.9,
                        dashArray: isMotoring ? '8 7' : null
                    }
                ).addTo(planMap);
                seg.bindPopup(buildSegmentPopup(pNext));
                routeSegments.push(seg);
            }

            // Mark each discrete step point (30 min apart — the routing/forecast granularity)
            // where one segment gives way to the next.
            for (const p of pts) {
                const dot = L.circleMarker([p.lat, p.lon], {
                    radius: 3,
                    weight: 1,
                    color: '#fff',
                    fillColor: routeColor(p.wind_speed_kn || 0),
                    fillOpacity: 1
                }).addTo(planMap);
                dot.bindPopup(buildSegmentPopup(p));
                routeSegments.push(dot);
            }

            // ETA tooltip at destination
            const last = pts[pts.length - 1];
            const eta  = new Date(last.timestamp);
            const etaStr =
                eta.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', timeZone:'UTC' }) +
                ' ' + eta.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', timeZone:'UTC' }) + ' UTC';
            const windStr = last.wind_speed_kn != null ? `${last.wind_speed_kn.toFixed(1)} kn` : '—';
            const tt = L.tooltip({ permanent: true, direction: 'right' })
                .setContent(`ETA ${etaStr} · ${windStr}`)
                .setLatLng([last.lat, last.lon]);
            planMap.addLayer(tt);
            routeSegments.push(tt);
            drawRouteSummary(pts);
        }

        function drawRouteSummary(pts) {
            const panel = document.getElementById('routeSummary');
            if (pts.length < 2) { panel.style.display = 'none'; return; }

            const depMs  = new Date(pts[0].timestamp).getTime();
            const arrMs  = new Date(pts[pts.length - 1].timestamp).getTime();
            const totalMs = arrMs - depMs;
            const totalHours = totalMs / 3600000;

            // Total distance along track
            let totalNm = 0;
            for (let i = 1; i < pts.length; i++)
                totalNm += degDistNm(pts[i-1].lat, pts[i-1].lon, pts[i].lat, pts[i].lon);

            // Sail / motor split by segment duration
            let sailMs = 0, motorMs = 0;
            for (let i = 1; i < pts.length; i++) {
                const p = pts[i];
                if (p.speed_kn == null) continue;
                const segMs = new Date(p.timestamp).getTime() - new Date(pts[i-1].timestamp).getTime();
                if (p.twa_deg !== null) sailMs  += segMs;
                else                    motorMs += segMs;
            }
            const trackedMs = sailMs + motorMs;
            const sailPct  = trackedMs > 0 ? sailMs  / trackedMs * 100 : 0;
            const motorPct = trackedMs > 0 ? motorMs / trackedMs * 100 : 0;

            const fmtTime = d =>
                d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', timeZone:'UTC' }) +
                ' ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', timeZone:'UTC' }) + ' UTC';
            const fmtDur = ms => {
                const h = Math.floor(ms / 3600000);
                const m = Math.round((ms % 3600000) / 60000);
                return m > 0 ? `${h}h ${m}m` : `${h}h`;
            };

            document.getElementById('sumDistance').textContent  = totalNm.toFixed(1) + ' nm';
            document.getElementById('sumDep').textContent       = fmtTime(new Date(depMs));
            document.getElementById('sumArr').textContent       = fmtTime(new Date(arrMs));
            document.getElementById('sumDur').textContent       = fmtDur(totalMs);
            document.getElementById('sumSailPct').textContent   = sailPct.toFixed(0)  + '%';
            document.getElementById('sumMotorPct').textContent  = motorPct.toFixed(0) + '%';
            document.getElementById('modeBarSail').style.width  = sailPct  + '%';
            document.getElementById('modeBarMotor').style.width = motorPct + '%';

            drawSpeedChart(pts, depMs, totalHours);
            renderRouteReportTable(pts);
            panel.style.display = 'flex';
        }

        function drawSpeedChart(pts, depMs, totalHours) {
            const W = 280, H = 110;
            const PAD = { top: 6, right: 8, bottom: 20, left: 28 };
            const plotW = W - PAD.left - PAD.right;
            const plotH = H - PAD.top  - PAD.bottom;

            // Max speed for y-axis ceiling (round up to next even number, min 6)
            const maxSpd = pts.reduce((m, p) => p.speed_kn != null ? Math.max(m, p.speed_kn) : m, 0);
            const yMax   = Math.max(Math.ceil(maxSpd / 2) * 2, 6);

            const px = t => PAD.left + (t / totalHours) * plotW;
            const py = s => PAD.top  + plotH - (s / yMax) * plotH;

            // Segments: each covers pts[i-1]→pts[i], speed stored in pts[i]
            const segs = [];
            for (let i = 1; i < pts.length; i++) {
                const p = pts[i];
                if (p.speed_kn == null) continue;
                const t0 = (new Date(pts[i-1].timestamp).getTime() - depMs) / 3600000;
                const t1 = (new Date(p.timestamp).getTime()         - depMs) / 3600000;
                segs.push({ t0, t1, spd: p.speed_kn, motor: p.twa_deg === null });
            }

            let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
                            style="width:100%; display:block; max-height:${H}px;">`;

            // Horizontal grid lines + y labels
            const yStep = yMax <= 8 ? 2 : yMax <= 14 ? 3 : 4;
            for (let v = 0; v <= yMax; v += yStep) {
                const y = py(v);
                svg += `<line x1="${PAD.left}" y1="${y}" x2="${W - PAD.right}" y2="${y}"
                              stroke="var(--border-color)" stroke-width="0.6" opacity="0.5"/>`;
                svg += `<text x="${PAD.left - 5}" y="${y + 4}" font-size="10"
                              fill="var(--text-secondary)" text-anchor="end">${v}</text>`;
            }

            // Vertical grid lines + x labels (UTC time)
            const xInterval = totalHours <= 12 ? 2 : totalHours <= 30 ? 4 : totalHours <= 60 ? 8 : 12;
            for (let h = 0; h <= totalHours + 0.01; h += xInterval) {
                const x = px(Math.min(h, totalHours));
                const label = new Date(depMs + Math.min(h, totalHours) * 3600000)
                    .toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', timeZone:'UTC' });
                svg += `<line x1="${x}" y1="${PAD.top}" x2="${x}" y2="${PAD.top + plotH}"
                              stroke="var(--border-color)" stroke-width="0.6" opacity="0.4"/>`;
                svg += `<text x="${x}" y="${H - 4}" font-size="9"
                              fill="var(--text-secondary)" text-anchor="middle">${label}</text>`;
            }

            // Coloured area fills (step chart)
            for (const s of segs) {
                const x0 = px(s.t0), x1 = px(s.t1);
                const y0 = py(s.spd), yBase = py(0);
                const fill = s.motor ? 'rgba(156,163,175,0.22)' : 'rgba(72,187,120,0.18)';
                svg += `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${yBase - y0}" fill="${fill}"/>`;
            }

            // Step lines (horizontal) + connectors (vertical)
            for (let i = 0; i < segs.length; i++) {
                const s = segs[i];
                const col = s.motor ? '#9ca3af' : '#48bb78';
                svg += `<line x1="${px(s.t0)}" y1="${py(s.spd)}" x2="${px(s.t1)}" y2="${py(s.spd)}"
                              stroke="${col}" stroke-width="2" stroke-linecap="round"/>`;
                if (i + 1 < segs.length && Math.abs(segs[i+1].t0 - s.t1) < 0.02) {
                    const x = px(s.t1);
                    svg += `<line x1="${x}" y1="${py(s.spd)}" x2="${x}" y2="${py(segs[i+1].spd)}"
                                  stroke="var(--border-color)" stroke-width="1"/>`;
                }
            }

            // Zero baseline
            svg += `<line x1="${PAD.left}" y1="${py(0)}" x2="${W - PAD.right}" y2="${py(0)}"
                          stroke="var(--border-color)" stroke-width="1"/>`;

            svg += '</svg>';
            document.getElementById('speedChartContainer').innerHTML = svg;
        }

        // Mirrors utilities::calculate_true_wind (Rust) in reverse: adds the boat's
        // velocity vector to the true wind vector instead of subtracting it.
        function trueToApparentWind(twsKn, twaDeg, boatSpeedKn) {
            if (twsKn == null || twaDeg == null || boatSpeedKn == null) return null;
            const twaRad = twaDeg * Math.PI / 180;
            const twX = twsKn * Math.cos(twaRad);
            const twY = twsKn * Math.sin(twaRad);
            const awX = twX + boatSpeedKn;
            const awY = twY;
            return {
                awsKn: Math.sqrt(awX * awX + awY * awY),
                awaDeg: Math.atan2(awY, awX) * 180 / Math.PI
            };
        }

        function renderRouteReportTable(pts) {
            const body = document.getElementById('routeReportTableBody');
            body.innerHTML = pts.map(p => {
                const t = new Date(p.timestamp);
                const time = t.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' })
                    + ' UTC ' + t.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', timeZone: 'UTC' });
                const spd = p.speed_kn != null ? p.speed_kn.toFixed(1) + ' kn' : '—';
                const eng = p.speed_kn == null ? '—' : (p.twa_deg === null ? '⚙ Motoring' : '⛵ Sailing');
                const tws = p.wind_speed_kn != null ? p.wind_speed_kn.toFixed(1) + ' kn' : '—';
                const twd = p.relative_wind_deg != null ? p.relative_wind_deg.toFixed(0) + '°' : '—';
                const gust = p.wind_gust_kn != null ? p.wind_gust_kn.toFixed(1) + ' kn' : '—';
                const apparent = trueToApparentWind(p.wind_speed_kn, p.relative_wind_deg, p.speed_kn);
                const awa = apparent ? apparent.awaDeg.toFixed(0) + '°' : '—';
                const aws = apparent ? apparent.awsKn.toFixed(1) + ' kn' : '—';
                return `<tr><td>${time}</td><td>${spd}</td><td>${eng}</td><td>${tws}</td><td>${twd}</td>` +
                    `<td>${gust}</td><td>${awa}</td><td>${aws}</td></tr>`;
            }).join('');
        }

        // ── Route persistence ─────────────────────────────────────────────────────
        function saveRouteState() {
            if (!routeMode) return;
            localStorage.setItem('plan_route', JSON.stringify({
                waypoints: routeWaypoints.map(p => ({ lat: p.lat, lng: p.lng })),
                done:      routeDone,
                departure: document.getElementById('depInput').value,
                overlay:   lastRouteOverlay,
            }));
        }

        function restoreRoute() {
            let state;
            try {
                const raw = localStorage.getItem('plan_route');
                if (!raw) return;
                state = JSON.parse(raw);
            } catch (_) { return; }

            if (!state.waypoints || state.waypoints.length < 1) return;

            // Enter route mode silently (don't pre-fill departure from scrubber)
            routeMode = true;
            document.getElementById('planRouteBtn').textContent = 'Clear Route';
            document.getElementById('planRouteBtn').style.background = '#e74c3c';
            document.getElementById('routeBar').style.display = '';

            // Re-create waypoint markers and preview lines
            state.waypoints.forEach((wp, i) => {
                const latlng = L.latLng(wp.lat, wp.lng);
                routeWaypoints.push(latlng);

                if (i > 0) {
                    const prev = routeWaypoints[i - 1];
                    previewLines.push(
                        L.polyline([[prev.lat, prev.lng], [latlng.lat, latlng.lng]], {
                            color: '#888', weight: 2, dashArray: '6,6', opacity: 0.7
                        }).addTo(planMap)
                    );
                }

                const n = state.waypoints.length;
                const fillColor = i === 0 ? '#48bb78' : i === n - 1 ? '#fc8181' : '#888';
                const borderColor = i > 0 && i < n - 1 ? '#888' : '#fff';
                waypointMarkers.push(
                    L.circleMarker(latlng, {
                        color: borderColor, fillColor, fillOpacity: 1, radius: 7, weight: 2
                    }).addTo(planMap)
                );
            });

            if (state.done) {
                routeDone = true;
            } else {
                planMap.getContainer().style.cursor = 'crosshair';
            }

            if (state.departure) {
                document.getElementById('depInput').value = state.departure;
            }

            updateRouteBar();

            if (state.overlay && state.overlay.length >= 2) {
                lastRouteOverlay = state.overlay;
                drawRouteLine(state.overlay);
            }
        }

        init();

        // ── Navigation areas (wind field data) + forecast refresh ───────────────────

        // Adds/removes a WindParticleLayer on planMap for each area, keyed by area.id,
        // so existing layers (and their live WebGL contexts) aren't torn down and
        // recreated on every areas refresh — only actual additions/removals are applied.
        function syncWindLayers(areas) {
            planAreas = areas;
            const seen = new Set();
            areas.forEach(area => {
                seen.add(area.id);
                if (!windLayers.has(area.id)) {
                    const layer = new WindParticleLayer(area);
                    windLayers.set(area.id, layer);
                    layer.onAdd(planMap);
                    if (!windOverlayVisible) layer.setEnabled(false);
                }
            });
            windLayers.forEach((layer, id) => {
                if (!seen.has(id)) {
                    layer.onRemove();
                    windLayers.delete(id);
                }
            });
        }

        // Navigation areas are drawn/edited on navigation-areas.html; this page only
        // needs their bounds to build wind layers and for point-in-area lookups.
        async function loadPlanAreas() {
            try {
                const resp = await fetch('/api/forecast/areas');
                const json = await resp.json();
                syncWindLayers(json.data || []);
            } catch (err) {
                console.error('Failed to load forecast areas', err);
            }
        }

        let forecastStatusInterval = null;

        async function updateForecastStatus() {
            try {
                const resp = await fetch('/api/forecast/status');
                const json = await resp.json();
                const s = json.data;
                if (!s) return;
                const statusEl = document.getElementById('forecastPollerStatus');
                const onlineBadge = s.online
                    ? '<span style="background:#14532d;color:#86efac;padding:2px 8px;border-radius:10px;font-size:11px;">● Fetching every 3h</span>'
                    : '<span style="background:#7c2d12;color:#fdba74;padding:2px 8px;border-radius:10px;font-size:11px;">⚠ Offline — retrying</span>';
                const lastFetch = s.last_fetch
                    ? 'Last fetch: ' + new Date(s.last_fetch).toLocaleTimeString('en-GB', { timeZone: 'UTC' }) + ' UTC'
                    : 'No fetch yet';
                const nextFetch = s.next_fetch
                    ? ' · Next: ' + new Date(s.next_fetch).toLocaleTimeString('en-GB', { timeZone: 'UTC' }) + ' UTC'
                    : '';
                statusEl.innerHTML =
                    onlineBadge + ' <span style="font-size:11px;color:var(--text-secondary);margin-left:8px;">' +
                    lastFetch + nextFetch + ' · ' + s.point_count + ' pts</span>';
                layoutOverlays();
            } catch (_) {}
        }

        async function refreshForecast() {
            const btn = document.getElementById('forecastRefreshBtn');
            const orig = btn.textContent;
            btn.disabled = true;
            btn.textContent = '↻ Fetching…';
            try {
                const resp = await fetch('/api/forecast/refresh', { method: 'POST' });
                const json = await resp.json();
                btn.textContent = json.status === 'ok' ? '✓ Done' : '✗ Error';
                setTimeout(() => { btn.textContent = orig; btn.disabled = false; },
                           json.status === 'ok' ? 2000 : 3000);
            } catch (_) {
                btn.textContent = '✗ Error';
                setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 3000);
            }
            await updateForecastStatus();
            await loadAvailableDays();
        }

        window.addEventListener('load', () => {
            requestAnimationFrame(() => {
                loadPlanAreas();
                updateForecastStatus();
                if (forecastStatusInterval) clearInterval(forecastStatusInterval);
                forecastStatusInterval = setInterval(updateForecastStatus, 60000);
            });
        });
    </script>
</body>
</html>
