<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning - NMEA Router</title>
    <link rel="icon" type="image/png" href="/images/nmeasail.png">
    <link rel="stylesheet" href="/shared.css">
    <link rel="stylesheet" href="/libs/leaflet.min.css" />
    <script src="/js/shared-theme.js?v=3"></script>
    <script src="/libs/leaflet.min.js"></script>
    <script src="/libs/wind-gl.js"></script>
    <script src="/js/wind-particle-layer.js"></script>
    <script src="/js/map-lat-lon-panel.js"></script>
    <style>
        .container { max-width: 100%; margin: 0; padding: 0; }
        #mapWrap { position: relative; width: 100%; min-height: 380px; }
        #planMap { position: absolute; inset: 0; }

        .map-overlay-panel {
            position: absolute;
            background: color-mix(in srgb, var(--bg-secondary) 90%, transparent);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 16px var(--card-shadow);
            z-index: 500;
            backdrop-filter: blur(4px);
        }
        .map-overlay-header {
            display: flex; align-items: center; cursor: pointer; user-select: none;
            font-size: 11px; color: var(--text-secondary); font-weight: 600;
            letter-spacing: 0.5px; text-transform: uppercase; gap: 6px;
        }
        .day-tab { padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
                   background: var(--bg-secondary); color: var(--text-secondary);
                   border: 1px solid var(--border-color); }
        .day-tab.active { background: var(--link-color); color: #fff; border-color: var(--link-color); }
        .day-tab:hover:not(.active) { background: var(--bg-hover); }

        .alt-route-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .alt-route-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .alt-route-modal-content {
            background: var(--bg-secondary);
            padding: 24px 26px;
            border-radius: 8px;
            box-shadow: 0 4px 20px var(--card-shadow);
            max-width: 560px;
            width: 90%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .alt-route-modal-header {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-bold);
            margin-bottom: 16px;
        }
        .alt-route-modal-stats {
            display: flex;
            gap: 24px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 18px;
            margin-bottom: 14px;
        }
        .alt-route-modal-stats > div { flex: 1; }
        .alt-route-modal-stats .label { font-size: 11px; color: var(--text-secondary); margin-bottom: 2px; }
        .alt-route-modal-stats .value { font-size: 15px; font-weight: 600; color: var(--text-primary); }
        .alt-route-modal-table-wrap { overflow-y: auto; }
        .alt-route-modal table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .alt-route-modal th {
            position: sticky; top: 0; background: var(--bg-secondary);
            text-align: left; padding: 6px 10px; color: var(--text-secondary);
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px;
            border-bottom: 1px solid var(--border-color);
        }
        .alt-route-modal td { padding: 5px 10px; color: var(--text-primary); border-bottom: 1px solid var(--border-color); }
        .alt-route-modal-actions {
            margin-top: 16px; align-self: flex-end; display: flex; gap: 10px;
        }
        .alt-route-modal-close, .alt-route-modal-select {
            padding: 9px 18px; border: none; border-radius: 4px; cursor: pointer;
            font-size: 14px;
        }
        .alt-route-modal-close {
            background-color: var(--bg-tertiary); color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .alt-route-modal-close:hover { opacity: 0.8; }
        .alt-route-modal-select {
            background-color: var(--sailing-color); color: white; border: 1px solid transparent;
        }
        .alt-route-modal-select:hover { background-color: #229954; }
        .route-report-table-wrap { flex: 1; min-height: 0; overflow-y: auto; overflow-x: auto; }
        .route-report-table-wrap table { border-collapse: collapse; font-size: 11px; white-space: nowrap; }
        .route-report-table-wrap th {
            position: sticky; top: 0; background: var(--bg-secondary);
            text-align: left; padding: 4px 7px; color: var(--text-secondary);
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px;
            border-bottom: 1px solid var(--border-color);
        }
        .route-report-table-wrap td {
            padding: 3px 7px; color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
        }
        .route-summary-resize-handle {
            position: absolute; top: 0; bottom: 0; left: -4px; width: 8px;
            cursor: ew-resize; z-index: 20; border-radius: 4px;
        }
        .route-summary-resize-handle:hover, .route-summary-resize-handle.dragging {
            background: color-mix(in srgb, var(--link-color) 40%, transparent);
        }
    </style>
</head>
<body>
    <div id="headerContainer"></div>

    <div class="container">
        <div id="mapWrap">
            <div id="planMap"></div>

            <!-- Top overlay: time scrubber + forecast controls + stats -->
            <div id="topOverlay" class="map-overlay-panel" style="top:12px; left:12px; right:12px; padding:10px 14px;">
                <div class="map-overlay-header" onclick="toggleOverlayCollapse('topOverlayBody','topOverlayChevron')">
                    <span id="topOverlayChevron">▾</span> Forecast &amp; Time
                </div>
                <div id="topOverlayBody" style="margin-top:8px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
                        <div id="dayTabsContainer" style="display:flex; gap:5px; flex-wrap:wrap;"></div>
                        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                            <span id="forecastPollerStatus" style="font-size:12px; color:var(--text-secondary);"></span>
                            <button id="forecastRefreshBtn" onclick="refreshForecast()"
                                style="padding:5px 14px; background:var(--bg-secondary); color:var(--text-secondary);
                                       border:1px solid var(--border-color); border-radius:4px; cursor:pointer; font-size:13px;">
                                ↻ Refresh
                            </button>
                            <label style="display:flex; align-items:center; gap:5px; color:var(--text-secondary); font-size:13px;">
                                <input type="checkbox" id="windOverlayInput" checked onchange="toggleWindOverlay()">
                                Wind overlay
                            </label>
                            <button id="gustToggleBtn" onclick="toggleGustMode()"
                                style="padding:5px 14px; background:var(--bg-secondary); color:var(--text-secondary);
                                       border:1px solid var(--border-color); border-radius:4px; cursor:pointer; font-size:13px;">
                                Show Gust
                            </button>
                            <button id="planRouteBtn" onclick="toggleRouteMode()"
                                style="padding:5px 14px; background:var(--link-color); color:#fff; border:none;
                                       border-radius:4px; cursor:pointer; font-size:13px;">
                                Plan Route
                            </button>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:12px; margin-bottom:10px;">
                        <input type="range" id="hourSlider" min="0" max="23" value="0"
                            style="flex:1; accent-color:var(--link-color);">
                        <span id="selectedTime"
                            style="font-size:13px; color:var(--text-bold); min-width:185px; text-align:right;"></span>
                        <button onclick="jumpToNow()"
                            style="padding:4px 10px; font-size:12px; border:1px solid var(--border-color);
                                   border-radius:4px; background:transparent; color:var(--text-secondary); cursor:pointer;">
                            Now
                        </button>
                    </div>
                    <div style="display:flex; gap:22px; flex-wrap:wrap; font-size:12px; color:var(--text-secondary);">
                        Wind: <strong id="statWind" style="color:var(--text-primary);">—</strong>
                        &nbsp;Gust: <strong id="statGust" style="color:var(--text-primary);">—</strong>
                        &nbsp;Wave: <strong id="statWave" style="color:var(--text-primary);">—</strong>
                        &nbsp;Period: <strong id="statPeriod" style="color:var(--text-primary);">—</strong>
                        &nbsp;CAPE: <strong id="statCape" style="color:var(--text-primary);">—</strong>
                    </div>
                </div>
            </div>

            <!-- Left sidebar overlay: route config (hidden until route mode) -->
            <div id="routeBar" class="map-overlay-panel"
                 style="display:none; left:12px; width:280px; max-height:60vh; overflow-y:auto; padding:12px 14px;">
                <div class="map-overlay-header" onclick="toggleOverlayCollapse('routeBarBody','routeBarChevron')">
                    <span id="routeBarChevron">▾</span> Route
                </div>
                <div id="routeBarBody" style="display:flex; flex-direction:column; gap:10px; margin-top:10px; font-size:13px;">
                    <span id="routeWptCount" style="color:var(--text-primary); font-weight:600;">
                        click map to add waypoints
                    </span>
                    <label style="color:var(--text-secondary); display:flex; flex-direction:column; gap:3px;">Dep (UTC):
                        <input type="datetime-local" id="depInput"
                            style="background:var(--bg-secondary); border:1px solid var(--border-color);
                                   border-radius:4px; padding:4px 8px; color:var(--text-primary); font-size:13px;">
                    </label>
                    <label style="color:var(--text-secondary); display:flex; flex-direction:column; gap:3px;">Motoring speed (kn):
                        <input type="number" id="speedInput" value="5.5" min="1" max="20" step="0.5"
                            style="background:var(--bg-secondary); border:1px solid var(--border-color);
                                   border-radius:4px; padding:4px 8px; color:var(--text-primary); font-size:13px;">
                    </label>
                    <label style="color:var(--text-secondary); display:flex; flex-direction:column; gap:3px;"
                           title="Fraction of polar speed to use (sea state, sail trim, etc.)">Polar efficiency (%):
                        <input type="number" id="efficiencyInput" value="95" min="50" max="100" step="1"
                            style="background:var(--bg-secondary); border:1px solid var(--border-color);
                                   border-radius:4px; padding:4px 8px; color:var(--text-primary); font-size:13px;">
                    </label>
                    <label style="color:var(--text-secondary); display:flex; flex-direction:column; gap:3px;"
                           title="Motor if expected sail speed drops below this">Min sail speed (kn):
                        <input type="number" id="minSailInput" value="3.0" min="0" max="10" step="0.5"
                            style="background:var(--bg-secondary); border:1px solid var(--border-color);
                                   border-radius:4px; padding:4px 8px; color:var(--text-primary); font-size:13px;">
                    </label>
                    <label style="color:var(--text-secondary); display:flex; flex-direction:column; gap:3px;"
                           title="Motor instead of sail when the wind is tighter than this off the bow">Min wind angle (°):
                        <input type="number" id="minTwaInput" value="60" min="0" max="180" step="1"
                            style="background:var(--bg-secondary); border:1px solid var(--border-color);
                                   border-radius:4px; padding:4px 8px; color:var(--text-primary); font-size:13px;">
                    </label>
                    <label style="color:var(--text-secondary); display:flex; flex-direction:column; gap:3px;"
                           title="Bonus score per sailed hour during route optimisation. 0 = fastest route, higher values favour more sailing.">Sail preference (kn):
                        <input type="number" id="sailWeightInput" value="0" min="0" max="10" step="0.5"
                            style="background:var(--bg-secondary); border:1px solid var(--border-color);
                                   border-radius:4px; padding:4px 8px; color:var(--text-primary); font-size:13px;">
                    </label>
                    <label style="color:var(--text-secondary); display:flex; align-items:center; gap:6px;"
                           title="Route around land/islands when optimizing. Turn off to compare against a straight-line-ignoring-coastline result.">
                        <input type="checkbox" id="avoidLandInput" checked>
                        Avoid land
                    </label>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px;">
                        <button id="undoBtn" onclick="undoWaypoint()" disabled
                            style="padding:6px 10px; background:var(--bg-secondary); color:var(--text-secondary);
                                   border:1px solid var(--border-color); border-radius:4px;
                                   cursor:pointer; font-size:13px;">
                            ↩ Undo
                        </button>
                        <button id="doneBtn" onclick="doneDrawing()" disabled
                            style="padding:6px 10px; background:#48bb78; color:#fff; border:none;
                                   border-radius:4px; cursor:pointer; font-size:13px;">
                            ✓ Done
                        </button>
                        <button id="computeBtn" onclick="computeRoute()" disabled
                            style="padding:6px 10px; background:var(--link-color); color:#fff; border:none;
                                   border-radius:4px; cursor:pointer; font-size:13px; opacity:0.4;">
                            Compute
                        </button>
                        <button id="optimizeBtn" onclick="optimizeRoute()" disabled
                            style="padding:6px 10px; background:#805ad5; color:#fff;
                                   border:none; border-radius:4px; cursor:pointer; font-size:13px; opacity:0.4;">
                            ⚡ Optimize
                        </button>
                    </div>
                </div>
            </div>

            <!-- Bottom sheet overlay: route summary (shown after compute) -->
            <div id="routeSummary" class="map-overlay-panel"
                 style="display:none; right:12px; bottom:12px; width:300px; padding:10px 12px;
                        flex-direction:column; overflow:hidden;">
                <div id="routeSummaryResizeHandle" class="route-summary-resize-handle" title="Drag to resize"></div>
                <div class="map-overlay-header" onclick="toggleOverlayCollapse('routeSummaryBody','routeSummaryChevron')">
                    <span id="routeSummaryChevron">▾</span> Route Summary
                </div>
                <div id="routeSummaryBody" style="display:flex; flex-direction:column; flex:1; min-height:0; margin-top:8px; font-size:12px;">
                    <!-- Key stats -->
                    <div style="display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--border-color);
                                border-radius:6px; overflow:hidden; margin-bottom:10px;">
                        <div style="padding:6px 9px; border-right:1px solid var(--border-color); border-bottom:1px solid var(--border-color);">
                            <div style="font-size:10px; color:var(--text-secondary); margin-bottom:1px;">Distance</div>
                            <div id="sumDistance" style="font-size:15px; font-weight:700; color:var(--text-primary);">—</div>
                        </div>
                        <div style="padding:6px 9px; border-bottom:1px solid var(--border-color);">
                            <div style="font-size:10px; color:var(--text-secondary); margin-bottom:1px;">Duration</div>
                            <div id="sumDur" style="font-size:15px; font-weight:700; color:var(--text-primary);">—</div>
                        </div>
                        <div style="padding:6px 9px; border-right:1px solid var(--border-color);">
                            <div style="font-size:10px; color:var(--text-secondary); margin-bottom:1px;">Departure</div>
                            <div id="sumDep" style="font-size:11px; font-weight:600; color:var(--text-primary);">—</div>
                        </div>
                        <div style="padding:6px 9px;">
                            <div style="font-size:10px; color:var(--text-secondary); margin-bottom:1px;">Arrival</div>
                            <div id="sumArr" style="font-size:11px; font-weight:600; color:var(--text-primary);">—</div>
                        </div>
                    </div>

                    <!-- Sail / motor split -->
                    <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-secondary);
                                margin-bottom:4px;">
                        <span>⛵ &nbsp;<strong id="sumSailPct" style="color:#48bb78;">—</strong></span>
                        <span>⚙ &nbsp;<strong id="sumMotorPct" style="color:#9ca3af;">—</strong></span>
                    </div>
                    <div style="height:6px; border-radius:3px; overflow:hidden; background:var(--bg-secondary);
                                display:flex; margin-bottom:10px;">
                        <div id="modeBarSail"  style="background:#48bb78; transition:width 0.4s;"></div>
                        <div id="modeBarMotor" style="background:#9ca3af; transition:width 0.4s;"></div>
                    </div>

                    <!-- Speed chart -->
                    <div style="font-size:10px; color:var(--text-secondary); margin-bottom:3px;">Boat speed (kn)</div>
                    <div id="speedChartContainer"></div>

                    <!-- Step-by-step table -->
                    <div style="font-size:10px; color:var(--text-secondary); margin-top:10px; margin-bottom:3px;">
                        Step-by-step
                    </div>
                    <div class="route-report-table-wrap">
                        <table>
                            <thead>
                                <tr><th>Time</th><th>Speed</th><th>Engine</th><th>TWS</th><th>TWD</th><th>Gust</th><th>AWA</th><th>AWS</th></tr>
                            </thead>
                            <tbody id="routeReportTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="altRouteModal" class="alt-route-modal">
        <div class="alt-route-modal-content">
            <div class="alt-route-modal-header">Alternative Route</div>
            <div class="alt-route-modal-stats">
                <div>
                    <div class="label">ETA</div>
                    <div class="value" id="altRouteEta">—</div>
                </div>
                <div>
                    <div class="label">Duration</div>
                    <div class="value" id="altRouteDur">—</div>
                </div>
            </div>
            <div class="alt-route-modal-table-wrap">
                <table>
                    <thead>
                        <tr><th>Time</th><th>Boat Speed</th><th>Engine</th><th>TWS</th><th>TWD</th></tr>
                    </thead>
                    <tbody id="altRouteTableBody"></tbody>
                </table>
            </div>
            <div class="alt-route-modal-actions">
                <button class="alt-route-modal-close" onclick="closeFrontierReport()">Close</button>
                <button class="alt-route-modal-select" onclick="selectFrontierRoute()">Select this route</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('headerContainer').innerHTML = createHeaderBar('planning');
        initializeTheme();

        fetchUiMode().then(readOnly => { if (readOnly) window.location.href = '/'; });

        // ── State ─────────────────────────────────────────────────────────────────
        let planMap = null;
        let windLayers = new Map();  // area.id -> WindParticleLayer
        let planAreas = [];          // ForecastArea[] from last /api/forecast/areas load
        let availableDays = [];
        let selectedDay = 0;
        let selectedHour = 0;
        let hourDebounceTimer = null;

        let routeMode = false;
        let routeDone = false;
        let routeWaypoints = [];    // L.LatLng[] in order
        let waypointMarkers = [];   // L.CircleMarker[] one per waypoint
        let previewLines = [];      // L.Polyline[] dashed segments between consecutive waypoints
        let routeSegments = [];     // coloured segments from drawRouteLine
        let frontierLines = [];     // muted backdrop polylines from isochrone search frontiers — session-only, never persisted
        let lastFrontiers = [];     // raw FrontierPoint[][] from last API call — session-only, never persisted
        let lastFrontiersDeparture = null; // departure ISO string used for the last optimize call — anchors frontier report timestamps
        let alternativeLine = null; // L.Polyline dashed hover highlight of discarded route, replaced/cleared on mousemove/mouseout
        let openFrontierReportStepIdx = null; // stepIdx/ptIdx of the frontier report currently shown in altRouteModal, for "Select this route"
        let openFrontierReportPtIdx = null;

        const FRONTIER_STEP_HOURS = 0.5; // must match STEP_HOURS in src/routing.rs

        let lastGridPts = [];     // raw GridPointForecast[] from last API call
        let showGust = false;     // when true, color arrows by gust speed instead of wind speed
        let windOverlayVisible = true;   // when false, wind particle/intensity layers and legend are hidden
        let windLegendControl = null;    // L.Control instance for the wind color-scale legend
        let lastRouteOverlay = []; // last computed overlay — persisted across reloads

        // ── Full-bleed map + floating overlay panels ────────────────────────────────

        // Sizes #mapWrap to fill the viewport below the header bar. Leaflet needs the
        // container to have a real pixel height before L.map() runs, so this is called
        // synchronously before map creation in init(), then again on resize.
        function sizeMapWrap() {
            const wrap = document.getElementById('mapWrap');
            if (!wrap) return;
            const top = wrap.getBoundingClientRect().top;
            const height = Math.max(window.innerHeight - top - 20, 380);
            wrap.style.height = height + 'px';
            if (planMap) planMap.invalidateSize();
        }
        window.addEventListener('resize', sizeMapWrap);

        // Positions the left route-config sidebar just below the top overlay bar,
        // whose height varies with content (day-tab wrapping, status text, collapse state).
        function layoutOverlays() {
            const topBar = document.getElementById('topOverlay');
            const wrap = document.getElementById('mapWrap');
            const routeBarEl = document.getElementById('routeBar');
            const summaryEl = document.getElementById('routeSummary');
            if (!topBar || !wrap) return;
            const top = topBar.offsetHeight + 24;
            const maxHeight = Math.max(wrap.offsetHeight - top - 12, 120);
            if (routeBarEl) {
                routeBarEl.style.top = top + 'px';
                routeBarEl.style.maxHeight = maxHeight + 'px';
            }
            // routeSummary pins top AND bottom (set in its own CSS) so it always spans
            // down to the bottom of the map, regardless of how much content it holds.
            if (summaryEl) {
                summaryEl.style.top = top + 'px';
            }
        }
        window.addEventListener('resize', layoutOverlays);

        // Generic collapse toggle for the three floating overlay panels — collapses to
        // just the header row, expanded/collapsed state remembered per body element id.
        function toggleOverlayCollapse(bodyId, chevronId) {
            const body = document.getElementById(bodyId);
            const chevron = document.getElementById(chevronId);
            const collapsed = body.style.display === 'none';
            body.style.display = collapsed ? '' : 'none';
            chevron.textContent = collapsed ? '▾' : '▸';
            localStorage.setItem('plan_overlay_' + bodyId + '_collapsed', collapsed ? '0' : '1');
            layoutOverlays();
        }

        function restoreOverlayCollapse(bodyId, chevronId) {
            if (localStorage.getItem('plan_overlay_' + bodyId + '_collapsed') === '1') {
                document.getElementById(bodyId).style.display = 'none';
                document.getElementById(chevronId).textContent = '▸';
            }
        }

        // Lets the user drag the Route Summary panel's left edge to widen/narrow it
        // (it's anchored to the map's right/bottom corner, so only the left edge moves).
        const ROUTE_SUMMARY_MIN_WIDTH = 280;
        const ROUTE_SUMMARY_WIDTH_KEY = 'plan_routeSummary_width';

        function setupRouteSummaryResize() {
            const panel = document.getElementById('routeSummary');
            const handle = document.getElementById('routeSummaryResizeHandle');
            if (!panel || !handle) return;

            let startX = 0;
            let startWidth = 0;

            function maxWidth() {
                const wrap = document.getElementById('mapWrap');
                return Math.max(wrap.offsetWidth - 40, ROUTE_SUMMARY_MIN_WIDTH);
            }

            function onMouseMove(e) {
                const delta = startX - e.clientX;
                const width = Math.min(Math.max(startWidth + delta, ROUTE_SUMMARY_MIN_WIDTH), maxWidth());
                panel.style.width = width + 'px';
            }

            function onMouseUp() {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
                handle.classList.remove('dragging');
                localStorage.setItem(ROUTE_SUMMARY_WIDTH_KEY, parseInt(panel.style.width, 10));
            }

            handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                startX = e.clientX;
                startWidth = panel.offsetWidth;
                handle.classList.add('dragging');
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }

        function restoreRouteSummaryWidth() {
            const saved = parseInt(localStorage.getItem(ROUTE_SUMMARY_WIDTH_KEY), 10);
            if (saved) {
                document.getElementById('routeSummary').style.width = saved + 'px';
            }
        }

        // ── Init ─────────────────────────────────────────────────────────────────
        async function init() {
            restoreOverlayCollapse('topOverlayBody', 'topOverlayChevron');
            restoreOverlayCollapse('routeBarBody', 'routeBarChevron');
            restoreOverlayCollapse('routeSummaryBody', 'routeSummaryChevron');
            restoreRouteSummaryWidth();

            planMap = L.map('planMap', { zoomControl: false }).setView([43.0, 9.0], 6);

            }).addTo(planMap);

                            <div id="legendTitle" style="font-weight:600; margin-bottom:4px; letter-spacing:0.3px;"><span id="legendLabel">Wind (kn)</span> <span id="modelBadge" style="font-weight:500; font-size:0.8em; opacity:0.75; margin-left:4px;">—</span></div>
                            <div style="height:10px; width:120px; border-radius:2px;
                                        border:1px solid rgba(0,0,0,0.3);
                                        background:linear-gradient(to right,
                                            rgb(170,170,170) 0%,
                                            rgb(30,160,255)  14%,
                                            rgb(0,210,180)   25%,
                                            rgb(0,190,60)    36%,

            windLegendControl = new WindLegend({ position: 'bottomleft' }).addTo(planMap);

            addLatLonPanel(planMap, 'bottomright');
